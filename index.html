定資産回転率","body":"機械設備などがどれだけ有効に使われているか。建設仮勘定は含めず、減価償却後の額を使うのが一般的。","formula":"有形固定資産回転率 ＝ 売上高 ÷ 有形固定資産"}],"questions":[{"id":"acct-7-01","type":"choice","prompt":"回転率の単位は？","options":["回","％","円","日"],"answer":0,"explanation":"収益性分析や安全性分析は主に％だが、効率性分析の回転率は「回」。×100は使わない。"},{"id":"acct-7-02","type":"choice","prompt":"売上高600、総資本400のとき、総資本回転率は？","options":["1.5回","0.67回","150回","2.5回"],"answer":0,"explanation":"600÷400＝1.5回。"},{"id":"acct-7-03","type":"choice","prompt":"売上高1,200、棚卸資産150のとき、棚卸資産回転率は？","options":["8回","12.5回","0.125回","80回"],"answer":0,"explanation":"1,200÷150＝8回。在庫が1年間に8回入れ替わるイメージ。"},{"id":"acct-7-04","type":"tf","prompt":"有形固定資産回転率を計算するときは、建設仮勘定を含めずに計算するのが一般的である。","answer":true,"explanation":"建設仮勘定はまだ完成しておらず売上に貢献していないため、除いて計算する。"},{"id":"acct-7-05","type":"tf","prompt":"売上債権回転率が高いほど、売上債権の回収状況は悪いと判断できる。","answer":false,"explanation":"高いほど少ない売上債権で多くの売上を上げており、回収が順調であることを示す。"},{"id":"acct-7-06","type":"choice","prompt":"総資本回転率が低いとき、原因を探るためにまず行うことは？","options":["個別の資産の回転率を分析する","自己資本比率を計算する","売上高総利益率を計算する","資本金を増やす"],"answer":0,"explanation":"売上債権・棚卸資産・有形固定資産などの回転率を調べ、どの資産が効率を下げているかを明らかにする。"}]},{"id":"acct-8","title":"安全性分析","summary":"倒産リスクを見抜く、短期・長期・資本構造の6つの指標を押さえよう。","cards":[{"title":"流動比率（短期安全性）","body":"1年以内の支払義務（流動負債）に対し、1年以内に現金化できる資産（流動資産）が足りているか。少なくとも100％以上、理想は200％以上。","formula":"流動比率 ＝ 流動資産 ÷ 流動負債 × 100"},{"title":"当座比率（短期安全性）","body":"流動資産を、よりすぐ換金できる当座資産に置き換えて厳しく判定する。100％以上が望ましい。流動比率は良いのに当座比率が低いなら、在庫の過剰が疑われる。","formula":"当座比率 ＝ 当座資産 ÷ 流動負債 × 100\n当座資産 ＝ 現金及び預金 ＋ 売掛金 ＋ 有価証券"},{"title":"固定比率（長期安全性）","body":"長く資金が寝る固定資産を、返済不要の自己資本でどれだけまかなえているか。低いほど良い。","formula":"固定比率 ＝ 固定資産 ÷ 自己資本 × 100"},{"title":"固定長期適合率（長期安全性）","body":"固定資産を、自己資本と固定負債を合わせた長期資本でまかなえているか。住宅を自己資金と長期ローンで買うイメージ。100％以下であることが必要。","formula":"固定長期適合率 ＝ 固定資産 ÷（自己資本 ＋ 固定負債）× 100"},{"title":"自己資本比率と負債比率","body":"資金調達の構造を見る指標。自己資本比率は高いほど良く、負債比率は低いほど安全性が高い。","formula":"自己資本比率 ＝ 自己資本 ÷ 総資本 × 100\n負債比率 ＝ 負債 ÷ 自己資本 × 100"}],"questions":[{"id":"acct-8-01","type":"choice","prompt":"流動資産500、流動負債250のとき、流動比率は？","options":["200％","50％","250％","125％"],"answer":0,"explanation":"500÷250×100＝200％。理想とされる200％を満たしている。"},{"id":"acct-8-02","type":"choice","prompt":"当座資産に含まれないものは？","options":["商品（棚卸資産）","現金及び預金","売掛金","有価証券"],"answer":0,"explanation":"在庫は売れるまで現金にならないので、当座資産には含めない。"},{"id":"acct-8-03","type":"tf","prompt":"固定比率は、高いほど資金面で安定した設備投資がなされていることを示す。","answer":false,"explanation":"固定比率は低いほど良い。固定資産を返済不要の自己資本で余裕をもってまかなえている状態。"},{"id":"acct-8-04","type":"choice","prompt":"固定資産600、自己資本550、固定負債300のとき、固定長期適合率はおよそ？","options":["70.6％","109.1％","200％","54.5％"],"answer":0,"explanation":"600÷（550＋300）×100≒70.6％。100％以下なので、固定資産は長期資本でまかなえている。"},{"id":"acct-8-05","type":"choice","prompt":"「高いほうが望ましい」指標はどれ？","options":["自己資本比率","負債比率","固定比率","固定長期適合率"],"answer":0,"explanation":"自己資本は原則返済不要なので、自己資本比率は高いほど安全。ほかの3つは低いほうが良い。"},{"id":"acct-8-06","type":"choice","prompt":"流動比率は良好なのに当座比率が低い場合、考えられる原因は？","options":["棚卸資産（在庫）の過剰","固定資産の過大","自己資本の不足","売上債権の減少"],"answer":0,"explanation":"2つの指標の差は主に棚卸資産。在庫が多すぎると、将来の資金繰りを悪化させるおそれがある。"},{"id":"acct-8-07","type":"choice","prompt":"負債550、自己資本550のとき、負債比率は？","options":["100％","50％","200％","0％"],"answer":0,"explanation":"550÷550×100＝100％。他人資本と自己資本が同じ額。"},{"id":"acct-8-08","type":"tf","prompt":"固定長期適合率は、100％以下であることが必要とされる。","answer":true,"explanation":"長く資金が拘束される固定資産は、長期資本でまかなうべき。100％を超えると短期の資金で固定資産を買っている状態。"}]}]},{"id":"mgmt","order":3,"title":"企業経営理論","shortTitle":"企業経営理論","worldName":"戦略の森","symbol":"lightbulb.fill","theme":"blue","boss":{"name":"迷走ゴーレム","emoji":"🗿","taunt":"戦略なき者は、この森で永遠に迷い続けるのだ…"},"stages":[{"id":"mgmt-1","title":"経営戦略とSWOT分析","summary":"戦略の3つの階層と、環境分析の定番フレームワークSWOTを押さえよう。","cards":[{"title":"経営戦略とは","body":"企業がいかに経営目的を達成し、成長していくかについての指針。ヒト・モノ・カネ・情報といった経営資源をどこにどう配分するかの方向性を決める。","formula":null},{"title":"戦略の3つの階層","body":"①企業戦略（成長戦略）：全社でどの領域に進み、資源をどう配分するか。②事業戦略（競争戦略）：特定の事業で競合に勝つ優位性をどう築くか。③機能戦略：生産・人事・財務・研究開発など各機能の生産性を高める戦略。","formula":null},{"title":"SWOT分析","body":"内部環境を強み（Strength）と弱み（Weakness）、外部環境を機会（Opportunity）と脅威（Threat）に分け、4つの象限で企業の特徴を洗い出す。2次試験でも欠かせない分析手法。","formula":"内部環境：S・W　／　外部環境：O・T"},{"title":"洗い出した結果の使い方","body":"強み×機会＝強みを活かして機会をつかむ。弱み×機会＝弱みを克服して機会を逃さない。強み×脅威＝脅威の影響を最小限にとどめる。弱み×脅威＝撤退し他に委ねる。","formula":null}],"questions":[{"id":"mgmt-1-01","type":"choice","prompt":"SWOT分析で「外部環境」に分類されるものは？","options":["機会と脅威","強みと弱み","強みと機会","弱みと脅威"],"answer":0,"explanation":"OとTが外部環境、SとWが内部環境（経営資源）。"},{"id":"mgmt-1-02","type":"choice","prompt":"特定の事業分野で、競争相手に対する優位性を築くための戦略は？","options":["事業戦略（競争戦略）","企業戦略（成長戦略）","機能戦略","経営理念"],"answer":0,"explanation":"事業戦略はポーターの競争戦略論や競争地位別戦略などが含まれる。全社レベルの方向性は企業戦略。"},{"id":"mgmt-1-03","type":"tf","prompt":"生産戦略・人事戦略・財務戦略などは「機能戦略」にあたる。","answer":true,"explanation":"購買・生産・営業・研究開発・財務・人事・情報システムなど、各機能に焦点をあてた戦略が機能戦略。"},{"id":"mgmt-1-04","type":"choice","prompt":"「自社は食品加工の技術力が高い」×「健康志向の市場が拡大している」。この組み合わせで取るべき方向性は？","options":["強みを活かして機会をつかむ","撤退して他に委ねる","脅威の影響を最小限にとどめる","弱みを克服して機会を逃さない"],"answer":0,"explanation":"技術力は強み（S）、市場の拡大は機会（O）。S×Oでは強みを活かして機会をつかむ。"},{"id":"mgmt-1-05","type":"tf","prompt":"内部環境分析では、生産能力などのハード面だけでなく、ノウハウやスキルなどのソフト面も分析する。","answer":true,"explanation":"内部環境（資源）分析では、競合と比較しながらハード・ソフトの両面から強みと弱みを識別する。"},{"id":"mgmt-1-06","type":"choice","prompt":"企業全体としてどんな領域で事業を行い、各事業に経営資源をどう配分するかを決める戦略は？","options":["企業戦略（成長戦略）","事業戦略（競争戦略）","機能戦略","マーケティング戦略"],"answer":0,"explanation":"企業戦略はドメイン、多角化、PPMなど全社的なテーマを扱う。"}]},{"id":"mgmt-2","title":"ドメイン（事業領域）","summary":"「自社は何屋なのか」を決めるドメインの定義のしかたを学ぼう。","cards":[{"title":"ドメインとは","body":"企業の事業領域（生存領域）。現在から将来にかけて、自社の事業がどうあるべきかを示すもの。","formula":null},{"title":"ドメインを決めるメリット","body":"①意思決定者の注意の焦点が定まる。②どんな経営資源を蓄積すべきかの指針になる。③どこで戦うかが明確になり、企業全体の一体感が生まれる。","formula":null},{"title":"物理的定義と機能的定義","body":"物理的定義は「モノ」中心（例：映画の製作）。わかりやすいが、今の事業を超える発想が出にくい。機能的定義は「コト・顧客ニーズ」中心（例：エンターテインメント）。発展の可能性を感じさせるが、抽象的になりすぎることもある。","formula":null},{"title":"企業ドメインと事業ドメイン","body":"企業ドメインは、事業の範囲や組み合わせ、会社のアイデンティティ、事業間のシナジーなど全社レベルの領域。事業ドメインは、個々の事業がどんな顧客のどんなニーズを満たすかを決めるもの。","formula":null},{"title":"ドメイン・コンセンサス","body":"ドメインを狭く決めすぎると将来の選択肢が限られるため、環境変化に合わせて見直す。変更するときは、組織の内部だけでなく外部とも合意（コンセンサス）を得ることが望ましい。","formula":null}],"questions":[{"id":"mgmt-2-01","type":"choice","prompt":"映画会社が自社の事業領域を「エンターテインメント」と定義するのは？","options":["機能的定義","物理的定義","製品別定義","地域別定義"],"answer":0,"explanation":"顧客が求める「楽しさ」というコト・ニーズで定義しているので機能的定義。「映画の製作」なら物理的定義。"},{"id":"mgmt-2-02","type":"tf","prompt":"物理的定義の最大のメリットは、事業の将来の発展可能性を感じさせることである。","answer":false,"explanation":"発展可能性を感じさせるのは機能的定義のメリット。物理的定義はわかりやすく、ターゲットや製品が明確になるのがメリット。"},{"id":"mgmt-2-03","type":"choice","prompt":"部門横断的な活動や事業間の関連性、将来のあるべき姿や経営理念を含むのはどれ？","options":["企業ドメイン","事業ドメイン","製品ドメイン","機能ドメイン"],"answer":0,"explanation":"企業全体として設定する内容なので企業ドメイン。事業ドメインは個々の事業の範囲を決めるもの。"},{"id":"mgmt-2-04","type":"choice","prompt":"ドメインを設定するメリットとして不適切なものは？","options":["あらゆる事業機会に同時に対応できる","意思決定者の注意の焦点が定まる","蓄積すべき経営資源の指針になる","組織全体の一体感が生まれる"],"answer":0,"explanation":"ドメインは「どこで戦うか」を絞り込むもの。あらゆる機会に同時に対応するのとは逆の考え方。"},{"id":"mgmt-2-05","type":"tf","prompt":"ドメインを変更するときは、組織内部だけでなく組織外部とも合意を得ることが望ましい。","answer":true,"explanation":"これをドメイン・コンセンサスという。取引先や顧客など外部の理解も必要になる。"},{"id":"mgmt-2-06","type":"tf","prompt":"経営者は、事業間でシナジー効果がどれくらい働くかを考えて企業ドメインを決定する。","answer":true,"explanation":"事業間のシナジーは企業全体に関わることなので、企業ドメインを決めるときの検討事項になる。"}]},{"id":"mgmt-3","title":"VRIOとコアコンピタンス","summary":"自社の経営資源が競争優位の源泉になるかを見極めよう。","cards":[{"title":"リソース・ベースト・ビュー","body":"自社の人員・ノウハウ・ブランドなどの経営資源（リソース）をベースに、競争優位を築くという考え方。","formula":null},{"title":"VRIO分析","body":"V：価値（その資源に価値はあるか）、R：希少性（珍しいか）、I：模倣困難性（真似しにくいか）、O：組織（活かす組織力があるか）の4点で資源を評価する。","formula":"Value・Rarity・Inimitability・Organization"},{"title":"模倣困難性を高める4つの要因","body":"①独自の歴史的条件（その企業の歴史をたどらないと得られない＝経路依存性）②因果関係の不明性（何が強みの原因かわからない）③社会的複雑性（評判や人間関係など形のないもの）④特許（法律で守られている）。","formula":null},{"title":"コアコンピタンス","body":"独自性を生み出す組織能力。模倣されにくく、さまざまな市場や製品に展開でき、多角化の核となる。ケイパビリティとほぼ同じ意味で使われる。","formula":null}],"questions":[{"id":"mgmt-3-01","type":"order","prompt":"VRIO分析の4つの視点を、頭文字の順に並べよ。","items":["価値（Value）","希少性（Rarity）","模倣困難性（Inimitability）","組織（Organization）"],"explanation":"V→R→I→Oの順。価値があり、珍しく、真似されにくく、それを活かせる組織があってはじめて持続的な競争優位になる。"},{"id":"mgmt-3-02","type":"choice","prompt":"VRIOの「I」が問いかける内容は？","options":["その資源は真似されにくいか","その資源に価値はあるか","その資源は珍しいか","その資源を活かす組織があるか"],"answer":0,"explanation":"I は Inimitability（模倣困難性）。資源を持たない企業が手に入れようとするとコスト面で不利になるかを見る。"},{"id":"mgmt-3-03","type":"tf","prompt":"価値があり、希少で、模倣困難な経営資源を持っていれば、必ず持続的な競争優位を確立できる。","answer":false,"explanation":"組織（O）がその資源の力を十分に引き出して活用できなければ、競争優位を確立できないことがある。"},{"id":"mgmt-3-04","type":"choice","prompt":"模倣困難性を高める要因として不適切なものは？","options":["資源が物理的で目に見えるものであること","長い歴史の中で独自に形成されたこと","競争優位の因果関係がわかりにくいこと","特許で保護されていること"],"answer":0,"explanation":"形のあるものは真似しやすい。評判や人間関係など形のないもの（社会的複雑性）が模倣困難性を高める。"},{"id":"mgmt-3-05","type":"tf","prompt":"コアコンピタンスから生まれるコア製品は、特定の製品や業界に限定され、複数の業界に展開することはない。","answer":false,"explanation":"コアコンピタンスの要件のひとつは「さまざまな市場や製品に展開できる」こと。コア製品も複数の製品・業界に展開できる。"},{"id":"mgmt-3-06","type":"choice","prompt":"経営資源の形成が、過去の出来事や発展の経路に依存している度合いを何という？","options":["経路依存性","社会的複雑性","範囲の経済性","規模の経済性"],"answer":0,"explanation":"同じ歴史をたどることはできないので、経路依存性が高い資源は真似しにくい。"}]},{"id":"mgmt-4","title":"成長戦略と多角化","summary":"アンゾフの製品＝市場マトリックスと、多角化・シナジーの考え方を学ぼう。","cards":[{"title":"製品＝市場マトリックス（アンゾフ）","body":"市場浸透：既存市場×既存製品（シェア拡大）。新製品開発：既存市場×新製品（モデルチェンジなど）。新市場開拓：新市場×既存製品（海外進出など）。多角化：新市場×新製品。","formula":null},{"title":"多角化の5つの理由","body":"①組織スラック（余裕資源）の活用 ②新しい事業分野の認識 ③主力事業の需要の停滞 ④リスクの分散 ⑤シナジーの追求。多角化は一般に、市場浸透などの拡大化戦略よりリスクが高い。","formula":null},{"title":"関連多角化と無関連多角化","body":"今の主力事業と関連のある分野に広げるのが関連多角化、まったく関連のない分野に広げるのが無関連多角化。一般に関連多角化のほうが成功率が高いとされる。","formula":null},{"title":"シナジー・範囲の経済・規模の経済","body":"シナジー：複数事業の組み合わせで効果が大きくなる（鉄道会社が百貨店や劇場を運営）。範囲の経済：多様な事業で資源を共有し効率よく運営できる（光学技術をカメラ・コピー機に活用）。規模の経済：同じものを大量に作り1個あたりのコストを下げる。","formula":null}],"questions":[{"id":"mgmt-4-01","type":"choice","prompt":"既存の市場に、新しい製品を投入する戦略は？","options":["新製品開発戦略","市場浸透戦略","新市場開拓戦略","多角化戦略"],"answer":0,"explanation":"既存市場×新製品は新製品開発戦略。機能の追加やデザイン変更、モデルチェンジなどが該当する。"},{"id":"mgmt-4-02","type":"choice","prompt":"シリアル専業メーカーが、国内の一般消費者向けに自社ECサイトを立ち上げ、既存のシリアルのシェア拡大を狙う。これは？","options":["市場浸透戦略","多角化戦略","新市場開拓戦略","新製品開発戦略"],"answer":0,"explanation":"市場（国内の一般消費者）も製品（シリアル）も既存のままなので市場浸透戦略。販売チャネルが新しくても多角化ではない。"},{"id":"mgmt-4-03","type":"choice","prompt":"国内で売れている既存製品を、海外市場に展開する戦略は？","options":["新市場開拓戦略","市場浸透戦略","新製品開発戦略","多角化戦略"],"answer":0,"explanation":"新しい市場×既存製品なので新市場開拓戦略。異なる地域や年齢層などへの展開が該当する。"},{"id":"mgmt-4-04","type":"tf","prompt":"社内に存在する未利用資源の活用は、多角化の動機の1つである。","answer":true,"explanation":"企業は活動を通じて組織スラック（余裕資源）を蓄積しており、それを多角化に活かせる。"},{"id":"mgmt-4-05","type":"tf","prompt":"シナジー効果は、規模の経済を構成する中心的な要素の1つである。","answer":false,"explanation":"シナジーは複数事業の組み合わせによる相乗効果。規模の経済は生産量の増加で1個あたりのコストが下がる現象で、別の概念。"},{"id":"mgmt-4-06","type":"choice","prompt":"光学技術を持つ企業が、その技術をカメラ・プロジェクター・コピー機に活用して効率よく事業を運営する。これを最もよく表すのは？","options":["範囲の経済性","規模の経済性","市場浸透戦略","カニバリゼーション"],"answer":0,"explanation":"多様な事業でノウハウなどの資源を共有し、固定費を分散して効率化するのが範囲の経済性。"},{"id":"mgmt-4-07","type":"choice","prompt":"アンゾフのマトリックスで、一般に最もリスクが高いとされる戦略は？","options":["多角化戦略","市場浸透戦略","新製品開発戦略","新市場開拓戦略"],"answer":0,"explanation":"製品も市場も新しい多角化は、既存の経験を活かしにくいためリスクが高い。"}]},{"id":"mgmt-5","title":"組織構造の形態","summary":"機能別・事業部制・マトリックス組織のメリットとデメリットを比べよう。","cards":[{"title":"分業と統合・調整","body":"組織の基本は、仕事を手分けする「分業」と、分業した仕事の方向性をまとめる「統合・調整」。組織構造の形態とは、この2つのあり方を決めること。","formula":null},{"title":"ラインとスタッフ","body":"ラインは購買・製造・販売など、企業の目的達成を直接担う職能。スタッフは経営企画や情報システムなど、専門的な助言・補佐でラインを支援する職能で、ラインへの直接の命令権限は持たない。","formula":null},{"title":"機能（職能）別組織","body":"人事・営業・製造など機能ごとに部門をつくる。メリット：専門性が高まる、規模の経済、統制しやすい。デメリット：トップに調整の負担が集中し意思決定が遅れがち、部門間の壁、全社的な人材が育ちにくい、利益責任が不明確。","formula":null},{"title":"事業部制組織","body":"製品・地域・顧客別の事業部に大きな権限を委譲した分権的組織。各事業部はプロフィットセンター（利益責任単位）としてROIで管理される。メリット：迅速な意思決定、次世代の経営者育成。デメリット：機能の重複、短期志向、セクショナリズム。","formula":null},{"title":"マトリックス組織","body":"機能別組織と事業部制組織の利点を同時に狙う格子型の組織。人的資源を共有でき課題に柔軟に対応できるが、2人の上司を持つ（ワンマン・ツーボス）ためコンフリクトが起きやすい。不確実性の高い環境で採用されやすい。","formula":null}],"questions":[{"id":"mgmt-5-01","type":"choice","prompt":"ラインに専門的な助言・補佐を行い、ラインへの直接の命令権限を持たない職能は？","options":["スタッフ","ライン","プロフィットセンター","トップマネジメント"],"answer":0,"explanation":"スタッフは管理職能が複雑になり、経営者だけでは担いきれなくなったことから生まれた支援的な職能。"},{"id":"mgmt-5-02","type":"tf","prompt":"機能別組織では、各機能部門長が事業戦略の策定・執行について最終責任を負う。","answer":false,"explanation":"機能部門長は営業や製造など特定機能の責任者にすぎず、事業戦略をつくる立場にはない。"},{"id":"mgmt-5-03","type":"choice","prompt":"各事業部をプロフィットセンター（利益責任単位）として管理する組織は？","options":["事業部制組織","機能別組織","マトリックス組織","ラインアンドスタッフ組織"],"answer":0,"explanation":"事業部制では各事業部に大きな権限が委譲され、資本利益率（ROI）で管理される。"},{"id":"mgmt-5-04","type":"tf","prompt":"事業部制組織は事業部どうしが有機的に連携しやすいため、機能別組織よりも事業横断的なシナジーを生みやすい。","answer":false,"explanation":"各事業部が自部門の利益にこだわりやすく、連携がとりにくい。セクショナリズムが起きやすく、シナジーは生まれにくい。"},{"id":"mgmt-5-05","type":"choice","prompt":"メンバーが2人の上司から指示を受けるため、コンフリクトが発生しやすい組織は？","options":["マトリックス組織","機能別組織","事業部制組織","ライン組織"],"answer":0,"explanation":"マトリックス組織はワンマン・ツーボス・システム。命令系統が錯綜し、責任の所在が不明確になりやすい。"},{"id":"mgmt-5-06","type":"tf","prompt":"マトリックス組織は運営が難しいため、不確実性の低い安定した環境で採用されやすい。","answer":false,"explanation":"課題への柔軟な対応や情報処理の迅速化というメリットがあるため、不確実性の高い環境で採用されやすい。"},{"id":"mgmt-5-07","type":"choice","prompt":"機能別組織のメリットとして適切なものは？","options":["分業により専門性を発揮しやすい","各部門の利益責任が明確になる","トップの調整負担が軽くなる","全社的なマネジメント人材が育ちやすい"],"answer":0,"explanation":"専門化による熟練や規模の経済がメリット。ほかの3つは機能別組織ではむしろデメリットとされる点。"}]},{"id":"mgmt-6","title":"マーケティングの基本","summary":"売れる仕組みづくりの全体像、4P、競争戦略と競争地位を押さえよう。","cards":[{"title":"マーケティングとは","body":"ひとことで言えば「売れる仕組みづくり」。顧客ニーズの把握、商品開発、価格設定、流通、プロモーションまでの一連の活動。一方的に売り込む「セリング志向」とは異なる。","formula":null},{"title":"マーケティング・マネジメント・プロセス","body":"環境分析（SWOT）→ 目標設定 → 市場細分化 → 標的市場の選定 → ポジショニング → マーケティング・ミックスの開発・実行。","formula":null},{"title":"4P（マーケティング・ミックス）","body":"Product（製品）、Price（価格）、Place（チャネル・物流）、Promotion（プロモーション）。この4つを最適に組み合わせたものがマーケティング・ミックス。","formula":null},{"title":"ポーターの3つの競争戦略","body":"差別化戦略：価格以外の独自性で優位に立つ。コストリーダーシップ戦略：他社より低コストで生産する。集中戦略：特定の顧客層や市場に絞り込む。","formula":null},{"title":"競争上の地位","body":"リーダー（最大シェア）、チャレンジャー（リーダーに挑む2番手）、フォロワー（挑戦せず現状維持）、ニッチャー（リーダーが採算面で狙わない隙間を狙う）。地位によってとるべき戦略が変わる。","formula":null}],"questions":[{"id":"mgmt-6-01","type":"choice","prompt":"マーケティングの4Pに含まれないものは？","options":["People（人材）","Product（製品）","Price（価格）","Promotion（プロモーション）"],"answer":0,"explanation":"4PはProduct・Price・Place・Promotion。"},{"id":"mgmt-6-02","type":"tf","prompt":"顧客の要望に応えつつ競合にも気を配り、それらをバランスよく両立する企業は「セリング志向」である。","answer":false,"explanation":"セリング志向は売り込み（押し売り）中心の考え方。顧客志向で売れる仕組みをつくるのがマーケティング。"},{"id":"mgmt-6-03","type":"choice","prompt":"流通経路の選定、倉庫の立地、輸送手段、適正な在庫量などを決めるのは4Pのどれ？","options":["Place","Product","Price","Promotion"],"answer":0,"explanation":"Placeはチャネル・物流に関する意思決定。広告や販売促進はPromotion。"},{"id":"mgmt-6-04","type":"choice","prompt":"リーダー企業が採算面から狙わない隙間市場で、独自の地位を築く企業は？","options":["ニッチャー","チャレンジャー","フォロワー","リーダー"],"answer":0,"explanation":"ニッチャーは小さな市場に特化して、その中で強い地位を築く。"},{"id":"mgmt-6-05","type":"choice","prompt":"価格以外の点で、買い手にとって魅力的な独自性をつくり出す戦略は？","options":["差別化戦略","コストリーダーシップ戦略","集中戦略","市場浸透戦略"],"answer":0,"explanation":"品質・デザイン・サービスなど価格以外で優位性を築くのが差別化戦略。"},{"id":"mgmt-6-06","type":"order","prompt":"マーケティング・マネジメント・プロセスを順に並べよ。","items":["環境分析","市場細分化","標的市場の選定","ポジショニング","マーケティング・ミックスの実行"],"explanation":"環境を分析し、市場を細かく分け、狙う市場を決め、立ち位置を定めてから、4Pを組み立てて実行する。"},{"id":"mgmt-6-07","type":"tf","prompt":"マクロ的外部環境には、経済・人口動態・社会文化・技術・政治法律・自然などが含まれる。","answer":true,"explanation":"マクロ的外部環境は社会全体の大きな環境。消費者・競争企業・取引先などはミクロ的外部環境。"}]},{"id":"mgmt-7","title":"STP（細分化・標的・位置づけ）","summary":"市場の切り分け方、狙い方、ポジションの決め方を学ぼう。","cards":[{"title":"ターゲット・マーケティング","body":"ニーズが多様化した今、同じ製品を大量に投入するマス・マーケティングは通用しにくい。市場を細分化し、標的を選び、自社の位置づけを決めてから、それぞれに合ったマーケティングを行う。","formula":"市場細分化 → 標的市場の設定 → ポジショニング"},{"title":"市場細分化の4つの基準","body":"ジオグラフィック（地理的：地域・気候・人口密度）、デモグラフィック（人口統計的：年齢・性別・所得・家族構成）、サイコグラフィック（心理的：ライフスタイル・価値観）、行動変数（求めるベネフィット・使用率）。","formula":null},{"title":"エーベルの5つの類型","body":"単一セグメント集中型、製品専門型（1つの製品を複数の市場へ）、市場専門型（1つの市場に複数の製品を）、選択的専門型、全市場浸透型。","formula":null},{"title":"ポジショニングと知覚マップ","body":"顧客の頭の中での自社製品の位置づけを知覚マップで分析し、競合と差別化できる空白のポジションを探す。既存製品ならリポジショニングの要否も検討する。","formula":null},{"title":"カニバリゼーション","body":"同じ企業の類似製品どうしが同じ市場で顧客を奪い合う「共食い」。自社の製品ラインで新製品を位置づけるときに注意する。","formula":null}],"questions":[{"id":"mgmt-7-01","type":"choice","prompt":"年齢・性別・所得・家族構成などで市場を分ける基準は？","options":["デモグラフィック基準","ジオグラフィック基準","サイコグラフィック基準","行動変数基準"],"answer":0,"explanation":"人口統計的な基準がデモグラフィック。少年誌や女性向け商品などの例がある。"},{"id":"mgmt-7-02","type":"choice","prompt":"ライフスタイルや価値観、趣味で市場を分ける基準は？","options":["サイコグラフィック基準","デモグラフィック基準","ジオグラフィック基準","行動変数基準"],"answer":0,"explanation":"心理的な基準。主観的な要素なので、把握には消費者調査が必要になる。"},{"id":"mgmt-7-03","type":"choice","prompt":"使用率（ヘビーユーザー・ライトユーザー）や、求めるベネフィットで市場を分ける基準は？","options":["行動変数基準","心理的基準","地理的基準","人口統計的基準"],"answer":0,"explanation":"製品に対する知識・態度・使用・反応に注目するのが行動変数基準。"},{"id":"mgmt-7-04","type":"tf","prompt":"主力のハンドタオル1ブランドを、高級ホテル・スポーツジム・贈答品店など幅広い市場に展開するのは「市場専門型」である。","answer":false,"explanation":"1つの製品を多くの市場に展開するのは製品専門型。市場専門型は1つの市場に複数の製品を投入する。"},{"id":"mgmt-7-05","type":"choice","prompt":"同じ企業の類似製品どうしが、同じ市場で顧客を奪い合う現象は？","options":["カニバリゼーション","ポジショニング","セグメンテーション","リポジショニング"],"answer":0,"explanation":"いわゆる「共食い」。新製品を投入するときは自社製品との関係にも注意する。"},{"id":"mgmt-7-06","type":"tf","prompt":"走行性能が従来型バイクより劣る小型電動バイクでは、ベネフィットによる市場細分化を検討すべきではない。","answer":false,"explanation":"手軽さや維持費の安さ、環境へのやさしさなど、別のベネフィットでは優れている。むしろ検討すべき。"},{"id":"mgmt-7-07","type":"choice","prompt":"顧客が認識している製品の位置づけを、2つの軸で図に表したものは？","options":["知覚マップ","製品＝市場マトリックス","SWOT分析","組織図"],"answer":0,"explanation":"知覚マップで競合との位置関係を見て、空白で有利なポジションを探す。"}]}]},{"id":"ops","order":4,"title":"運営管理","shortTitle":"運営管理","worldName":"カイゼン工房","symbol":"gearshape.2.fill","theme":"teal","boss":{"name":"ムダ・ムラ・ムリ魔人","emoji":"👺","taunt":"工場も店も、ムダだらけにしてやるわ！"},"stages":[{"id":"ops-1","title":"生産管理とQCD","summary":"生産管理の目的であるQCDと、生産性・4Mの考え方を押さえよう。","cards":[{"title":"生産管理の目的","body":"設計・調達・作業という生産活動を、Q（品質）・C（原価）・D（数量・納期）の観点から管理する。計画（Plan）・実施（Do）・統制（See）のサイクルを回すことが大切。","formula":"Q：Quality　C：Cost　D：Delivery"},{"title":"生産性","body":"投入した資源に対して、どれだけ産出できたか。労働生産性、設備生産性など「〜生産性」の形で使う。","formula":"生産性 ＝ 産出量（output）÷ 投入量（input）"},{"title":"設計品質と製造品質","body":"設計品質は、製造の目標として狙った品質（ねらいの品質）。製造品質は、実際にできた品質（できばえの品質）。生産管理では「狙いどおり」が目的なので、狙いより良すぎても合格ではない。","formula":null},{"title":"納期の考え方","body":"受注生産では顧客と約束した期日、見込生産では完成すべき期日。生産管理では「決めた納期どおりに終わるか」が問題で、単に短縮すれば良いわけではない。","formula":null},{"title":"生産の4M","body":"Man（作業者）、Machine（機械設備）、Material（原材料・部品）、Method（作業方法）。狙ったQCDを達成するために、4Mをムダ・ムラ・ムリなく使う。","formula":null}],"questions":[{"id":"ops-1-01","type":"choice","prompt":"QCDの「D」が表すものは？","options":["数量および納期（Delivery）","設計（Design）","需要（Demand）","流通（Distribution）"],"answer":0,"explanation":"Q＝品質、C＝原価、D＝数量および納期。狙ったQCDの達成が生産管理の最重要課題。"},{"id":"ops-1-02","type":"tf","prompt":"生産性は、産出量に対する投入量の比で求める。","answer":false,"explanation":"逆。生産性は「投入量に対する産出量の比」＝産出量÷投入量。"},{"id":"ops-1-03","type":"choice","prompt":"狙った品質を目指して製造した製品の、実際の品質を何という？","options":["製造品質（できばえの品質）","設計品質（ねらいの品質）","総合品質","使用品質"],"answer":0,"explanation":"製品の総合品質は、設計品質と製造品質から構成される。"},{"id":"ops-1-04","type":"tf","prompt":"10年使えるように設計した腕時計が30年使えたら、狙いを上回ったので生産管理上は合格である。","answer":false,"explanation":"生産管理はあくまで「狙ったとおり」に作ることが目的。大きく上回るのも狙いどおりではない。"},{"id":"ops-1-05","type":"choice","prompt":"生産の4Mに含まれないものは？","options":["Market（市場）","Man（作業者）","Machine（機械設備）","Method（作業方法）"],"answer":0,"explanation":"4MはMan・Machine・Material・Method。MethodをMoney（お金）とすることもある。"},{"id":"ops-1-06","type":"order","prompt":"生産活動の3つのプロセスを順に並べよ。","items":["設計","調達","作業"],"explanation":"生産活動は設計 → 調達 → 作業で構成される。広い意味では前後の受注や納品も含む。"},{"id":"ops-1-07","type":"tf","prompt":"作業管理に使う「標準作業」は、4M（Man・Machine・Material・Method）を有効に活用した作業でなければならない。","answer":true,"explanation":"良い品質の製品を、より安く・早く・安定的に生産するため、4Mを有効に活用した作業を標準とする。"}]},{"id":"ops-2","title":"改善の原則","summary":"現場改善の定番、3S・5S・ECRS・5W1Hを使いこなそう。","cards":[{"title":"3S","body":"生産を合理化する基本原則。単純化（Simplification：製品や仕事の種類を減らす）、標準化（Standardization：物や方法を統一する）、専門化（Specialization：品種を限定したり分担して専業化する）。","formula":null},{"title":"5S","body":"整理（不要なものを捨てる）→ 整頓（決めた場所にすぐ使えるよう置く）→ 清掃（きれいにする）→ 清潔（その状態を維持する）→ しつけ（決めたことを守る）。工場の5Sを見れば生産性や信頼性がわかると言われる。","formula":null},{"title":"ECRSの原則（改善の4原則）","body":"E：排除（なくせないか）→ C：結合（一緒にできないか）→ R：交換（順序を変えられないか）→ S：簡素化（簡単にできないか）の順に検討する。","formula":"Eliminate → Combine → Rearrange → Simplify"},{"title":"5W1H","body":"What・When・Who・Where・Why・How による問いかけ。改善では最初に「What？Why？」で、その仕事自体が必要かを問う。不要なら仕事そのものをなくせるから。","formula":null}],"questions":[{"id":"ops-2-01","type":"order","prompt":"5Sを実施する順に並べよ。","items":["整理","整頓","清掃","清潔","しつけ"],"explanation":"まず不要なものを捨て（整理）、必要なものを置き場所に揃え（整頓）、きれいにし（清掃）、それを維持し（清潔）、ルールを守る（しつけ）。"},{"id":"ops-2-02","type":"order","prompt":"ECRSの原則を、検討する順に並べよ。","items":["排除（Eliminate）","結合（Combine）","交換（Rearrange）","簡素化（Simplify）"],"explanation":"まず「なくせないか」を考えるのが最も効果が大きい。次に結合、交換、最後に簡素化。"},{"id":"ops-2-03","type":"choice","prompt":"生産合理化の3Sに含まれないものは？","options":["平準化","単純化","標準化","専門化"],"answer":0,"explanation":"3Sは単純化・標準化・専門化。平準化は含まれない。"},{"id":"ops-2-04","type":"tf","prompt":"5Sで最初にすべきことは、必要なものを決められた場所に置き、すぐ使える状態にすることである。","answer":false,"explanation":"最初にすべきは「整理」＝必要なものと不要なものを分けて不要なものを処分すること。設問の内容は次の「整頓」。"},{"id":"ops-2-05","type":"tf","prompt":"ECRSの原則で、最後にする問いかけはStandardization（標準化）である。","answer":false,"explanation":"最後はSimplify（簡素化）。E・C・R・Sの4つに標準化は含まれない。"},{"id":"ops-2-06","type":"choice","prompt":"5W1Hを使って改善するとき、最初に検討すべき視点は？","options":["What？Why？（何を・なぜ）","How？（どのように）","When？（いつ）","Who？（だれが）"],"answer":0,"explanation":"その仕事がなぜ必要かを問い、不要ならやめてしまうのが最も効果的。やり方（How）の検討はその後。"},{"id":"ops-2-07","type":"choice","prompt":"「必要なものを、必要なときにすぐ使えるよう決められた場所に準備しておく」のは5Sのどれ？","options":["整頓","整理","清掃","清潔"],"answer":0,"explanation":"整頓＝一目でわかるようにする。整理＝不要なものを捨てる。"}]},{"id":"ops-3","title":"現場の活動とキーワード","summary":"QCサークルやTPM、多台持ち・多工程持ちなど、現場の用語を整理しよう。","cards":[{"title":"QCサークル活動","body":"第一線の職場の人々が、製品・サービス・仕事の質の改善を継続的に行う小グループ活動。問題解決手法の習得、チームワークの醸成、会社への貢献につながる。","formula":null},{"title":"TPM（全員参加の生産保全）","body":"生産・開発・営業・管理などの全部門が参加し「災害ゼロ・不良ゼロ・故障ゼロ」を目指す。職制にとらわれない重複小集団活動と、設備を使うオペレーター自身が清掃・給油などを行う自主保全が特徴。","formula":null},{"title":"多工程持ちと多台持ち","body":"多工程持ち：1人が複数の工程を担当する。複数工程をこなせる多能工が必要で、手待ちのムダを防げる。多台持ち：1つの工程で複数台の機械を担当する。単能工でよいが、台数が多すぎると機械干渉が起きる。","formula":null},{"title":"手待ちと機械干渉","body":"手待ち：前工程が終わらない、機械が故障しているなどで作業者の手が空いてしまうこと。機械干渉：作業者が1台の機械を扱っている間に、他の機械が止まってしまうこと。","formula":null},{"title":"押さえたい生産管理用語","body":"リードタイム：発注から納入まで。生産リードタイム：生産の着手から完了まで。稼働率：利用可能な時間のうち有効に稼働した割合。歩留り：投入した原材料に対する産出品の割合。","formula":"歩留り ＝ 産出された品物の量 ÷ 投入した主原材料の量 × 100"}],"questions":[{"id":"ops-3-01","type":"tf","prompt":"TPMは、上位管理者の指示のもとで行われる活動である。","answer":false,"explanation":"TPMは職制にとらわれない、全員参加の自主的な活動。現場の知恵や工夫を活かして設備保全などに取り組む。"},{"id":"ops-3-02","type":"choice","prompt":"1人の作業者が複数の工程を受け持つ作業と、それに必要な作業者の組み合わせは？","options":["多工程持ち作業と多能工","多台持ち作業と多能工","多工程持ち作業と単能工","多台持ち作業と熟練工"],"answer":0,"explanation":"複数の工程を担当するには、複数の工程をこなせる多能工が必要。多台持ちは1工程なので単能工でよい。"},{"id":"ops-3-03","type":"choice","prompt":"作業者がある機械の材料補給などをしている間に、他の機械が停止してしまう現象は？","options":["機械干渉","手待ち","段取替え","チョコ停"],"answer":0,"explanation":"多台持ちで受け持ち台数を増やしすぎると起きる。作業者と機械の稼働率がともに高くなる台数を決める。"},{"id":"ops-3-04","type":"tf","prompt":"生産リードタイムとは、顧客が注文してから製品を手にするまでの時間である。","answer":false,"explanation":"生産リードタイムは「生産の着手から完了まで」の時間。設問の内容は（一般的な）リードタイム。"},{"id":"ops-3-05","type":"choice","prompt":"原材料100kgを投入して、製品が92kgできた。歩留りは？","options":["92％","8％","108％","46％"],"answer":0,"explanation":"歩留り＝92÷100×100＝92％。"},{"id":"ops-3-06","type":"tf","prompt":"多工程持ち作業は、作業者のスキルアップにつながり、モラール（士気）を高める効果があるとされる。","answer":true,"explanation":"単調な作業の繰り返しより、複数工程を担うことで生産全体の理解が進み、意欲が高まるとされる。"},{"id":"ops-3-07","type":"choice","prompt":"品質の改善を目的に、第一線の職場の人が小グループで継続的に行う活動は？","options":["QCサークル活動","TPM","ECRS","5W1H"],"answer":0,"explanation":"QCサークルは品質改善の小集団活動。全部門・全階層が参加する重複小集団活動のTPMとは区別する。"}]},{"id":"ops-4","title":"生産形態","summary":"受注生産と見込生産、個別・ロット・連続生産、多種少量と少種多量を比べよう。","cards":[{"title":"受注生産と見込生産","body":"注文と生産のタイミングによる分類。受注生産は注文を受けてから設計・製造する（ポイント：見積りの正確さ、リードタイム短縮、受注の平準化）。見込生産は需要を予測して先に作り、在庫から販売する（ポイント：需要予測の正確さ）。","formula":null},{"title":"個別・ロット・連続生産","body":"仕事の流し方による分類。個別生産は注文ごとに1回限り（船舶・注文住宅）。連続生産は同じ製品を続けて生産（清涼飲料・日用雑貨）。ロット生産は品種ごとにまとめて交互に生産する中間形態。生産効率は個別が最も低く、連続が最も高い。","formula":null},{"title":"段取替え","body":"品種を切り替えるための準備作業。機械を止めて行う内段取と、止めずに行う外段取がある。停止10分未満はシングル段取。ロットを小さくするほど段取替えが増えるので、内段取の短縮や外段取化が重要。","formula":null},{"title":"多種少量生産と少種多量生産","body":"多種少量は中小企業に多く、柔軟だが合理化しにくく、工場内の流れが複雑になりやすい。少種多量は専用ラインで効率的、仕掛品が少なくリードタイムも短いが、作業が単調になりやすい。","formula":null}],"questions":[{"id":"ops-4-01","type":"tf","prompt":"市場の需要を見越して企画・設計した製品を、不特定の顧客向けに生産するのは受注生産である。","answer":false,"explanation":"需要を見越して先に生産するのは見込生産。受注生産は顧客が決めた仕様の製品を、注文を受けてから生産する。"},{"id":"ops-4-02","type":"choice","prompt":"品種ごとに生産量をまとめ、複数の製品を交互に生産する形態は？","options":["ロット生産","連続生産","個別生産","見込生産"],"answer":0,"explanation":"ロット生産は断続生産ともいい、個別生産と連続生産の中間的な形態。"},{"id":"ops-4-03","type":"choice","prompt":"「仕事の流し方」による分類の組み合わせとして正しいものは？","options":["個別生産・ロット生産・連続生産","受注生産・見込生産","多種少量生産・少種多量生産","内段取・外段取"],"answer":0,"explanation":"受注生産と見込生産は「注文と生産のタイミング」、多種少量と少種多量は「製品の種類数と生産量」による分類。"},{"id":"ops-4-04","type":"choice","prompt":"機械やラインを止めずに行う段取作業は？","options":["外段取","内段取","シングル段取","多台持ち"],"answer":0,"explanation":"止めて行うのが内段取、止めずに行うのが外段取。内段取を外段取に変えると停止時間を短縮できる。"},{"id":"ops-4-05","type":"tf","prompt":"ロットサイズを小さくすると段取替えの回数が増えるため、段取替え時間の短縮が重要になる。","answer":true,"explanation":"小ロットは在庫を減らせるが、段取替えが増える。その時間を短くすることが合理化の鍵。"},{"id":"ops-4-06","type":"choice","prompt":"見込生産で特に重要なポイントは？","options":["需要予測の正確さ","受注時の見積りの正確さ","受注の平準化","顧客ごとの仕様確認"],"answer":0,"explanation":"注文の前に作るので、どれだけ売れるかの予測が外れると在庫過剰や品切れになる。"},{"id":"ops-4-07","type":"tf","prompt":"少種多量生産は、多種少量生産に比べて仕掛品が多くなり、生産リードタイムが長くなる。","answer":false,"explanation":"逆。少種多量生産は専用ラインで単純な流れになるため、仕掛品が少なく、生産リードタイムも短くなる。"}]},{"id":"ops-5","title":"店舗の機能とレイアウト","summary":"店舗が持つ6つの機能と、売上を伸ばす動線づくりを学ぼう。","cards":[{"title":"店舗の6つの機能","body":"①訴求（知らしめる：店構え・看板）②誘導（入らせる・回らせる：入りやすい入口、通路の工夫）③演出（魅せる：陳列・色彩・照明）④選択（選ばせる：触れやすい陳列・POP）⑤購入促進（買わせる：販売方法・接客）⑥情報発信（伝える：ポスター・チラシ）。","formula":null},{"title":"動線コントロール","body":"客動線はできるだけ長くして、店内を回遊させ多くの商品に触れてもらう（客単価アップ）。従業員動線は短くして作業効率を上げる。","formula":"客動線：長く　／　従業員動線：短く"},{"title":"マグネット","body":"磁石のように顧客を引きつける売場・商品。突き当たりや曲がり角に置くと、店の奥まで回遊してもらえる。コンビニなら飲料や弁当。レジの近くに置くと回遊性が下がる。","formula":null},{"title":"売場生産性","body":"単位面積あたりの売上・利益のほか、従業員1人が1時間あたりどれだけ粗利を稼いだかを示す人時生産性で測る。","formula":"人時生産性 ＝ 粗利益額 ÷ 総労働時間"}],"questions":[{"id":"ops-5-01","type":"choice","prompt":"客動線と従業員動線の基本方針として正しいものは？","options":["客動線は長く、従業員動線は短く","客動線は短く、従業員動線は長く","どちらも長く","どちらも短く"],"answer":0,"explanation":"客には店内を広く回ってもらい、従業員はムダなく動けるようにする。"},{"id":"ops-5-02","type":"tf","prompt":"購買率の高いマグネット商品をレジの近くに配置すると、売場の回遊性が高まる。","answer":false,"explanation":"レジ近くの商品だけ買って帰る客が増え、客動線が短くなって回遊性が下がるおそれがある。"},{"id":"ops-5-03","type":"choice","prompt":"人時生産性の計算式は？","options":["粗利益額 ÷ 総労働時間","売上高 ÷ 売場面積","粗利益額 ÷ 従業員数","売上高 ÷ 来店客数"],"answer":0,"explanation":"1人1時間あたりの粗利益。売場生産性の代表的な指標のひとつ。"},{"id":"ops-5-04","type":"choice","prompt":"店構え・外装・看板などで、店舗の存在や個性をアピールする機能は？","options":["訴求機能","誘導機能","選択機能","購入促進機能"],"answer":0,"explanation":"訴求機能は「知らしめる」機能。店頭での実演販売や呼び込みも要素のひとつ。"},{"id":"ops-5-05","type":"choice","prompt":"手に取りやすい陳列や関連陳列、POPで商品を選びやすくする機能は？","options":["選択機能","演出機能","訴求機能","情報発信機能"],"answer":0,"explanation":"選択機能は「選ばせる」機能。多くの商品は手に取ったり触れたりすることが選ぶ決め手になる。"},{"id":"ops-5-06","type":"tf","prompt":"セルフサービス店舗のワンウェイコントロールは、買物客の売場回遊を促し、商品との接点を増やす。","answer":true,"explanation":"一方通行の動線で店内をくまなく回ってもらい、多くの商品に触れる機会をつくる。客単価アップにつながる。"}]},{"id":"ops-6","title":"什器と照明","summary":"陳列什器・ショーケースの種類と、照明の単位・方法・演色性を覚えよう。","cards":[{"title":"陳列什器","body":"ゴンドラ：複数段の棚でフェイス（商品の正面）をそろえやすい。ひな段型陳列台：階段状で全体を見せやすいが陳列量は少ない。ステージ：床より一段高くして重点商品をアピール（大型商品は低め、衣料品は高め）。","formula":null},{"title":"ショーウインドウ","body":"オープン型は背面の壁がなく店内が見えるので誘導効果がある。ボックス型は背面が壁で視線を集めやすく、ウインドウショッピング向き。ライトアップすれば閉店後も訴求できる。買回品の店や専門店に多い。","formula":null},{"title":"ショーケース","body":"クローズドケース：前面もガラスで囲み、高級感の演出や商品保護に向く。オープンケース：前面が開いて手に取りやすい。リーチインケース：前面にガラス扉の冷蔵・冷凍庫。ウォークインケース：裏が冷蔵庫で店員が裏から補充し、先入れ先出しが容易。","formula":null},{"title":"照明の単位","body":"光束（ルーメン lm）：光源から出る光の量。光度（カンデラ cd）：ある方向への光の強さ。照度（ルクス lx）：照らされた面の明るさ。輝度：ある方向から見たときの輝きの強さ。","formula":null},{"title":"照明方法と演色性","body":"直接照明は効率が最も高い。間接照明は壁や天井に反射させるため効率は悪いが、高級感やソフトな雰囲気をつくる。演色性は物の色の見え方を表す光源の性質で、平均演色評価数Ra（最大100）で表し、売場ではRa80以上が目安。","formula":null}],"questions":[{"id":"ops-6-01","type":"choice","prompt":"照らされた面の明るさを表す単位は？","options":["ルクス（lx）","ルーメン（lm）","カンデラ（cd）","ケルビン（K）"],"answer":0,"explanation":"照度の単位がルクス。光束はルーメン、光度はカンデラ。"},{"id":"ops-6-02","type":"choice","prompt":"光で照らされた物体の色の見え方を表す、光源の性質は？","options":["演色性","光色","輝度","光束"],"answer":0,"explanation":"演色性はRaで数値化される。光色は昼白色・電球色など照明自体の色味のことで、別の概念。"},{"id":"ops-6-03","type":"tf","prompt":"間接照明は照明効率が最も高く、店内全体を明るくするのに適している。","answer":false,"explanation":"最も効率が高いのは直接照明。間接照明は効率は悪いが、高級感やソフトなイメージの演出に向く。"},{"id":"ops-6-04","type":"choice","prompt":"ケースの裏側が冷蔵庫になっていて、店員が裏から補充するため先入れ先出しがしやすいのは？","options":["ウォークインケース","リーチインケース","オープンケース","クローズドケース"],"answer":0,"explanation":"飲料やビールを箱ごと冷やせる。ただしスペース効率とエネルギー効率が低いという欠点もある。"},{"id":"ops-6-05","type":"choice","prompt":"背面が壁になっていて店内が見えず、ウインドウ内に視線を集めやすいショーウインドウは？","options":["ボックス型","オープン型","アイランド型","ひな段型"],"answer":0,"explanation":"ボックス型はウインドウショッピング向き。オープン型は店内が見えるので店内への誘導効果がある。"},{"id":"ops-6-06","type":"tf","prompt":"ゴンドラ陳列には、フェイス（商品の正面）をそろえやすいというメリットがある。","answer":true,"explanation":"手前の商品を整えやすいので、定番商品を多数アピールするのに向いている。"},{"id":"ops-6-07","type":"choice","prompt":"価格や品質を比べるために、いくつかの店を見て回ってから買う商品を何という？","options":["買回品","最寄品","専門品","生鮮品"],"answer":0,"explanation":"趣味の品などが買回品。日用品のように特別な手間をかけず頻繁に買うものは最寄品。"}]},{"id":"ops-7","title":"POSとバーコード","summary":"販売データの活用法と、バーコードのしくみを学ぼう。","cards":[{"title":"POSシステム","body":"Point of Sales の略で「販売時点情報管理」。どの商品が、いつ、いくらで、いくつ売れたかをリアルタイムに把握できる。","formula":null},{"title":"ID-POSとRFM分析","body":"ポイントカードなどで顧客IDが結びついたPOSデータがID-POS。RFM分析は、Recency（最終購買日）、Frequency（購買頻度）、Monetary（購買金額）で顧客をランク分けし、優良顧客を見つける。","formula":"R：Recency　F：Frequency　M：Monetary"},{"title":"バスケット分析（併買分析）","body":"レシート単位で「何と何が一緒に買われたか」を分析する。紙おむつとビールの事例が有名。関連陳列やセット販売で客単価アップにつなげる。","formula":null},{"title":"JANコード","body":"国際的な共通商品コード（GTIN）。13桁の標準タイプ（GTIN-13）と8桁の短縮タイプ（GTIN-8）がある。先頭2桁の45・49は日本の国コードだが、原産国を表すわけではない。","formula":null},{"title":"ソースマーキングとインストアマーキング","body":"ソースマーキングは、メーカーなどが製造段階で包装にバーコードを印刷すること。インストアマーキングは、生鮮食品や惣菜など店内で包装・計量する商品に、店内で作ったラベルを貼ること。","formula":null}],"questions":[{"id":"ops-7-01","type":"choice","prompt":"RFM分析の「F」が表すものは？","options":["Frequency（購買頻度）","Festival（祝日の購買数）","Fee（手数料）","Final（最終購買日）"],"answer":0,"explanation":"Fはどれだけ頻繁に買っているか。最終購買日はRecency（R）。"},{"id":"ops-7-02","type":"order","prompt":"RFM分析の3つの指標を、頭文字の順に並べよ。","items":["Recency（最終購買日）","Frequency（購買頻度）","Monetary（購買金額）"],"explanation":"最近・頻繁に・たくさん買う顧客ほど優良顧客とみなし、手厚いプロモーションにつなげる。"},{"id":"ops-7-03","type":"tf","prompt":"JANコードの先頭2桁が「49」の商品は、日本で生産されたことを意味する。","answer":false,"explanation":"45・49は日本の国コードだが、原産国ではなく、どこの企業が供給責任者かを識別するためのもの。"},{"id":"ops-7-04","type":"choice","prompt":"店内で計り売りした惣菜に、店内で印刷したバーコードラベルを貼るのは？","options":["インストアマーキング","ソースマーキング","ID-POS","RFM分析"],"answer":0,"explanation":"重さや価格が商品ごとに違うため、店内で独自のラベルを作って貼る。"},{"id":"ops-7-05","type":"choice","prompt":"「何と何が一緒に買われたか」をレシート単位で分析する手法は？","options":["バスケット分析（併買分析）","RFM分析","SWOT分析","知覚マップ"],"answer":0,"explanation":"併買の多い商品を見つけて、並べて陳列したりセットで売ったりすることで客単価を上げる。"},{"id":"ops-7-06","type":"choice","prompt":"JANコードの標準タイプ（GTIN-13）の桁数は？","options":["13桁","8桁","10桁","16桁"],"answer":0,"explanation":"標準は13桁。印字スペースが限られる小さな商品には8桁の短縮タイプ（GTIN-8）が認められている。"},{"id":"ops-7-07","type":"tf","prompt":"機能や成分が従来品と同じでも、ブランドロゴを変更した商品には新しいGTIN-13を設定するべきである。","answer":true,"explanation":"GTINを変えるかどうかは「流通の場で別の商品として区別されるか」で判断する。見た目が変われば混同を防ぐため新しいコードが必要。"}]}]},{"id":"law","order":5,"title":"経営法務","shortTitle":"経営法務","worldName":"法の神殿","symbol":"building.columns.fill","theme":"purple","boss":{"name":"パクリ大王","emoji":"🦹","taunt":"そのアイデア、まるごといただいていくぞ！"},"stages":[{"id":"law-1","title":"知的財産権と特許法","summary":"4つの産業財産権の全体像と、特許の要件・実施権・期間を押さえよう。","cards":[{"title":"産業財産権","body":"特許権・実用新案権・意匠権・商標権の4つ。保護対象はそれぞれ発明・考案・意匠（デザイン）・商標（マーク）。著作権も知的財産権だが、産業財産権には含まれない。","formula":null},{"title":"発明とは","body":"自然法則を利用した技術的思想の創作のうち高度のもの。商売の方法などの人為的な取決め、自然法則そのもの、技能（変化球の投げ方など）、単なる情報の提示、絵画などの美的創作物、天然物の単なる発見は発明にあたらない。","formula":null},{"title":"特許の登録要件","body":"①産業上の利用可能性 ②新規性（まだ知られていない）③進歩性（その分野の専門家が容易に思いつかない）④先願（同じ発明なら最初に出願した人に与える＝先願主義）。","formula":null},{"title":"専用実施権と通常実施権","body":"専用実施権は、決めた範囲で特許発明を独占的に使える権利。その範囲では特許権者自身も実施できない。通常実施権は独占性がなく、特許権者も実施できる。","formula":null},{"title":"特許権の存続期間","body":"特許権は登録によって発生し、出願日から20年で終わる（一定の場合は延長できる）。","formula":"特許権：出願日から20年"}],"questions":[{"id":"law-1-01","type":"choice","prompt":"特許法で保護される「発明」に該当するものは？","options":["燃費を向上させる新しいエンジン制御技術","新しい商売の方法","野球の変化球の投げ方","万有引力の法則"],"answer":0,"explanation":"商売の方法は人為的な取決め、変化球は技能、万有引力は自然法則そのものなので発明にあたらない。"},{"id":"law-1-02","type":"choice","prompt":"特許権の存続期間は？","options":["出願日から20年","登録日から20年","出願日から10年","出願日から25年"],"answer":0,"explanation":"特許権は出願日から20年。登録で発生するが、期間は出願日から数える点に注意。"},{"id":"law-1-03","type":"tf","prompt":"専用実施権を設定すると、設定した範囲内では特許権者と専用実施権者の両方が特許発明を実施できる。","answer":false,"explanation":"専用実施権は独占排他的な権利。設定した範囲内では、特許権者であっても実施できない。"},{"id":"law-1-04","type":"choice","prompt":"同じ発明について複数の出願があった場合、最初に出願した人に特許を与える考え方は？","options":["先願主義","先発明主義","無審査主義","属地主義"],"answer":0,"explanation":"日本は先願主義。発明した時期ではなく、出願した時期の早さで決まる。"},{"id":"law-1-05","type":"choice","prompt":"特許の登録要件に含まれないものは？","options":["創作性","新規性","進歩性","産業上の利用可能性"],"answer":0,"explanation":"創作性は意匠の登録要件。特許は新規性・進歩性・産業上の利用可能性・先願が必要。"},{"id":"law-1-06","type":"tf","prompt":"公知の技術を寄せ集めただけのものは、進歩性がないとして特許を受けられない。","answer":true,"explanation":"その分野の通常の知識を持つ人が容易に思いつくものは進歩性がない。他の技術へ転用しただけのものも同様。"},{"id":"law-1-07","type":"choice","prompt":"産業財産権に含まれないものは？","options":["著作権","特許権","意匠権","商標権"],"answer":0,"explanation":"著作権は知的財産権のひとつだが、産業財産権（特許・実用新案・意匠・商標）には含まれない。"}]},{"id":"law-2","title":"実用新案・意匠・商標","summary":"特許との違いを中心に、3つの権利の特徴と期間を比べよう。","cards":[{"title":"実用新案権","body":"考案（物品の形状・構造・組み合わせに関する技術的思想の創作。高度でなくてよい小発明）を保護する。方法やプログラムは対象外。無審査で登録され、権利を行使するときは実用新案技術評価書を示して警告する必要がある。","formula":"実用新案権：出願日から10年"},{"title":"意匠権","body":"物品や建築物の形状・模様・色彩、画像など、見た目の美しさ（デザイン）を保護する。要件は工業上の利用可能性・新規性・創作性。登録した意匠に類似する意匠にも効力が及ぶ。","formula":"意匠権：出願日から25年"},{"title":"意匠の特別な制度","body":"部分意匠（ドアノブなど物品の一部分）、組物意匠（ナイフ・フォーク・スプーンのセットなど統一感ある組み合わせ）、関連意匠（本意匠のバリエーション）、秘密意匠（登録日から最長3年間、公開せず秘密にできる）。","formula":null},{"title":"商標権","body":"商品やサービスの名前・マーク（文字・図形・立体・色彩・音など）を保護する。他社の商品と区別できる識別力が必要で、普通名称やありふれた名字だけのものは原則登録できない。類似範囲での他者の使用を禁止できる（禁止権）。","formula":"商標権：設定登録日から10年（何度でも更新可能）"},{"title":"商標の制度","body":"不使用取消審判：継続して3年以上日本国内で使われていない登録商標は、誰でもいつでも取消しを請求できる。地域団体商標：地域名＋商品名の商標（例：松阪牛、有田みかん）を地域ブランドとして登録できる。","formula":null}],"questions":[{"id":"law-2-01","type":"tf","prompt":"実用新案権の存続期間は、実用新案登録の日から10年で終了する。","answer":false,"explanation":"実用新案権は「出願の日」から10年。登録日から10年なのは商標権。"},{"id":"law-2-02","type":"choice","prompt":"意匠権の存続期間は？","options":["出願日から25年","出願日から20年","登録日から10年（更新可）","出願日から10年"],"answer":0,"explanation":"特許20年、実用新案10年、意匠25年（いずれも出願日から）、商標は登録日から10年で更新可能。"},{"id":"law-2-03","type":"choice","prompt":"何度でも更新できる産業財産権は？","options":["商標権","特許権","実用新案権","意匠権"],"answer":0,"explanation":"商標は使い続けることで信用が蓄積するため、更新登録すれば何度でも延ばせる。"},{"id":"law-2-04","type":"choice","prompt":"意匠を、登録日から最長3年間公開せず秘密にしておける制度は？","options":["秘密意匠制度","関連意匠制度","部分意匠制度","組物意匠制度"],"answer":0,"explanation":"登録された意匠は通常公開されるが、秘密意匠にすれば発売前の模倣リスクを防げる。"},{"id":"law-2-05","type":"tf","prompt":"実用新案権は無審査で登録されるため、権利を行使するときは実用新案技術評価書を提示して警告する必要がある。","answer":true,"explanation":"無審査なので権利が有効かどうかがわからない。特許庁の審査官による評価書で有効性を示す。"},{"id":"law-2-06","type":"choice","prompt":"継続して3年以上日本国内で使われていない登録商標について、請求できるのは？","options":["不使用取消審判","無効審判","拒絶査定不服審判","訂正審判"],"answer":0,"explanation":"使われていない商標を取り消して、他の人が使えるようにする制度。いつでも誰でも請求できる。"},{"id":"law-2-07","type":"choice","prompt":"「有田みかん」「松阪牛」のような、地域名と商品名からなる商標を保護する制度は？","options":["地域団体商標登録制度","関連意匠制度","専用実施権","実用新案技術評価書"],"answer":0,"explanation":"地域名＋商品名だけの商標は原則登録できないが、一定範囲で有名になったものは地域団体商標として登録できる。"},{"id":"law-2-08","type":"tf","prompt":"意匠権の効力は、登録意匠と同一の意匠にのみ及び、類似する意匠には及ばない。","answer":false,"explanation":"意匠権は登録意匠に類似する意匠にまで効力が及ぶ。特許権や実用新案権にはない特徴。"}]},{"id":"law-3","title":"会社の設立と機関","summary":"株式会社のつくり方と、株主総会・取締役・監査役などの機関を整理しよう。","cards":[{"title":"個人事業と法人","body":"個人事業は手続きが簡単だが、所得が多いほど税率面で不利。法人は設立の手間がかかるが、信用力や税率面で有利。税務署へは、個人は開業から1か月以内に開業届、法人は設立から2か月以内に法人設立届出書を出す。","formula":null},{"title":"間接有限責任","body":"株式会社の株主は、出資した額を限度に（有限）、会社を通じてのみ（間接）責任を負う。リスクが限られるので、多くの人から資金を集めやすい。","formula":null},{"title":"株式会社の設立の流れ","body":"定款（会社の根本規則＝会社の憲法）の作成 → 株式の引受け・出資の履行 → 設立時役員等の選任（機関設計）→ 設立登記。","formula":null},{"title":"株主総会と取締役","body":"すべての株式会社に必要なのは株主総会と取締役（1人以上）だけ。株主総会は最高意思決定機関で、原則1株1議決権。取締役の任期は原則2年で、善管注意義務・忠実義務、競業避止義務、利益相反取引の規制などがある。","formula":null},{"title":"その他の機関","body":"取締役会（取締役3人以上）、監査役（業務監査と会計監査、任期は原則4年）、監査役会（監査役3人以上、半数以上が社外）、会計監査人（公認会計士・監査法人）、会計参与（公認会計士・税理士など。取締役と共同で計算書類を作成）。","formula":null}],"questions":[{"id":"law-3-01","type":"choice","prompt":"すべての株式会社に必ず設置しなければならない機関の組み合わせは？","options":["株主総会と取締役","株主総会と取締役会","取締役と監査役","取締役会と監査役会"],"answer":0,"explanation":"絶対的必要機関は株主総会と取締役だけ。取締役会や監査役などは定款で定めて任意に置く。"},{"id":"law-3-02","type":"choice","prompt":"監査役の任期（原則）は？","options":["選任後4年以内に終わる最終の事業年度の定時株主総会まで","同じく2年以内","同じく1年以内","任期の定めはない"],"answer":0,"explanation":"監査役の任期は原則4年。取締役は原則2年なので区別して覚える。"},{"id":"law-3-03","type":"tf","prompt":"監査役の任期は、定款で定めれば選任後2年以内に短縮できる。","answer":false,"explanation":"監査役の任期は原則4年で、定款で短縮することはできない（監査役の独立性を守るため）。"},{"id":"law-3-04","type":"order","prompt":"株式会社の設立手続きを順に並べよ。","items":["定款の作成","株式の引受け・出資の履行","設立時役員等の選任（機関設計）","設立登記"],"explanation":"まず会社の根本規則である定款をつくり、財産を確保し、運営する役員を決め、最後に登記して完了。"},{"id":"law-3-05","type":"choice","prompt":"会計監査人になれるのは？","options":["公認会計士または監査法人","税理士または税理士法人","弁護士","中小企業診断士"],"answer":0,"explanation":"会計に関する高い専門性が必要なため、公認会計士または監査法人に限られる。会計参与は税理士もなれる。"},{"id":"law-3-06","type":"choice","prompt":"株式会社の株主が負う責任は？","options":["間接有限責任","直接無限責任","直接有限責任","間接無限責任"],"answer":0,"explanation":"出資額が限度（有限）で、債権者に直接払う義務はない（間接）。"},{"id":"law-3-07","type":"tf","prompt":"取締役会を設置する場合、取締役は3人以上必要である。","answer":true,"explanation":"取締役会は3人以上の取締役で構成され、代表取締役の選任など重要な業務の意思決定を行う。"},{"id":"law-3-08","type":"tf","prompt":"会計参与は、取締役と共同して計算書類を作成する機関で、税理士もなることができる。","answer":true,"explanation":"会計参与の資格は公認会計士（監査法人）または税理士（税理士法人）。"}]},{"id":"law-4","title":"組織再編","summary":"事業譲渡・合併・株式交換／移転・会社分割の違いを図でイメージしよう。","cards":[{"title":"事業譲渡","body":"工場や得意先、ノウハウなど組織化された事業をまとめて売買する契約。譲った会社は原則として、同一および隣接の市町村で20年間、同じ事業をしてはならない（競業避止義務）。厳密には会社法上の組織再編ではない。","formula":null},{"title":"合併","body":"吸収合併：1社が存続し、消滅する会社の権利義務をすべて引き継ぐ。新設合併：全社が消滅し、新しく設立する会社が引き継ぐ。消滅会社の株主は、存続会社（新設会社）の株式を受け取る。","formula":null},{"title":"株式交換と株式移転","body":"どちらも100％の完全親子会社をつくる手続き。株式交換は既存の会社が親会社になる。株式移転は新しく設立した会社が親会社になり、持株会社（ホールディングス）の設立によく使われる。","formula":null},{"title":"会社分割","body":"事業の全部または一部を切り出して他の会社に引き継がせる。吸収分割は既存の会社へ、新設分割は新しく設立する会社へ承継させる。","formula":null},{"title":"持分会社","body":"株式会社以外の会社である合名会社・合資会社・合同会社。出資者（社員）が原則として経営に参加し、定款で自由に機関設計できる範囲が広い。","formula":null}],"questions":[{"id":"law-4-01","type":"choice","prompt":"既存の2社の株主が新設会社の株主になり、2社がその新設会社の完全子会社になる手続きは？","options":["株式移転","株式交換","新設合併","新設分割"],"answer":0,"explanation":"新しく設立した会社を親会社にするのが株式移転。持株会社をつくるときによく使われる。"},{"id":"law-4-02","type":"choice","prompt":"1社が存続し、他の会社が解散してその会社に吸収される合併は？","options":["吸収合併","新設合併","吸収分割","事業譲渡"],"answer":0,"explanation":"吸収合併では、消滅会社の権利義務のすべてを存続会社が引き継ぐ。"},{"id":"law-4-03","type":"tf","prompt":"事業譲渡をした会社は、原則として同一および隣接の市町村で20年間、同じ事業を行えない。","answer":true,"explanation":"譲ったノウハウを使って同じ事業を続けると、譲り受けた会社の利益を害するため、競業避止義務が定められている。"},{"id":"law-4-04","type":"choice","prompt":"事業の一部を切り出して、新たに設立する会社に承継させる手法は？","options":["新設分割","吸収分割","株式交換","新設合併"],"answer":0,"explanation":"新設分割では、分割した会社と新設会社が親子会社になる。既存の会社に承継させるのが吸収分割。"},{"id":"law-4-05","type":"choice","prompt":"持分会社に含まれないものは？","options":["株式会社","合名会社","合資会社","合同会社"],"answer":0,"explanation":"持分会社は合名・合資・合同会社の3つ。株式会社とは別の分類。"},{"id":"law-4-06","type":"tf","prompt":"事業譲渡は「事業を目的物とした売買契約」であり、厳密には会社法上の組織再編にはあたらない。","answer":true,"explanation":"ただし実務上は、合併や会社分割と並ぶ組織再編の手法として活用されている。"}]},{"id":"law-5","title":"民法と契約","summary":"民法の基本原則、債権と債務、主な典型契約を覚えよう。","cards":[{"title":"民法の4つの基本原則","body":"権利能力平等の原則（誰でも等しく権利を持てる）、所有権絶対の原則（国家でも所有権を侵せない）、契約自由の原則（誰とどんな契約をしても自由）、過失責任の原則（故意・過失がなければ賠償責任を負わない）。","formula":null},{"title":"民法の構成","body":"総則・物権・債権・親族・相続の5つ。総則〜債権を財産法、親族・相続を家族法という。診断士試験では物権・債権・相続から主に出題される。","formula":null},{"title":"債権と債務","body":"債権は、特定の人に一定の行為を請求できる権利。債務は、それに応じる義務。車の売買なら、売主は代金を請求する債権と車を渡す債務を持ち、買主はその逆を持つ。","formula":null},{"title":"財産の移転・利用の契約","body":"贈与（無償であげる）、売買、交換（物と物）。消費貸借（借りた物と同じ種類・量を返す。お金の貸し借り）、使用貸借（無償で借りて、その物自体を返す）、賃貸借（有償で借りる）。","formula":null},{"title":"役務の利用の契約","body":"雇用（労働に従事し報酬を受ける）、請負（仕事の完成に対して報酬を受ける）、委任（法律行為を任せる）、寄託（物の保管を任せる）。民法の典型契約は全部で13種類。","formula":null}],"questions":[{"id":"law-5-01","type":"choice","prompt":"友人から無償で本を借り、読み終わったらその本自体を返す契約は？","options":["使用貸借","賃貸借","消費貸借","寄託"],"answer":0,"explanation":"無償で借りて、その物を返すのが使用貸借。有償なら賃貸借、同じ種類・量の物で返すなら消費貸借。"},{"id":"law-5-02","type":"choice","prompt":"仕事の完成を約束し、その結果に対して報酬が支払われる契約は？","options":["請負","委任","雇用","寄託"],"answer":0,"explanation":"請負は「仕事の完成」が目的。雇用は労働すること自体、委任は法律行為を任せることが目的。"},{"id":"law-5-03","type":"tf","prompt":"お金を100万円借りた場合、借りたときと同じ番号の紙幣で返さなければならない。","answer":false,"explanation":"金銭消費貸借では、種類・品質・数量が同じ物で返せばよい。別の1万円札や5千円札でもかまわない。"},{"id":"law-5-04","type":"choice","prompt":"故意や過失がなければ、損害賠償責任を負わないという原則は？","options":["過失責任の原則","契約自由の原則","所有権絶対の原則","権利能力平等の原則"],"answer":0,"explanation":"過失責任主義ともいう。例外として、過失がなくても責任を負う無過失責任が定められている場合もある。"},{"id":"law-5-05","type":"tf","prompt":"請負人が仕事を完成しない間は、注文者はいつでも損害を賠償して契約を解除できる。","answer":true,"explanation":"注文者にとって不要になった仕事を続けさせる意味はないため、損害を賠償すれば解除できる。"},{"id":"law-5-06","type":"choice","prompt":"民法に定められている典型契約の数は？","options":["13種類","10種類","5種類","20種類"],"answer":0,"explanation":"本ステージの10種類に、組合・和解・終身定期金を加えた13種類。"},{"id":"law-5-07","type":"choice","prompt":"車を100万円で売る売買契約で、売主が持つ「債権」は？","options":["買主に代金の支払いを請求する権利","買主に車を引き渡す義務","売主に車を渡すよう請求する権利","売主に代金を支払う義務"],"answer":0,"explanation":"売主は「代金を払って」と言える債権と、「車を渡す」債務を持つ。"}]},{"id":"law-6","title":"保証・債務不履行・不法行為","summary":"連帯保証の怖さと、契約がうまくいかなかったときのルールを学ぼう。","cards":[{"title":"保証","body":"主債務者が払わないときに、保証人が代わりに履行する制度。主債務が消えれば保証債務も消える。保証契約は書面（メールなどの電磁的記録を含む）でしなければ無効。","formula":null},{"title":"連帯保証","body":"ふつうの保証人にある権利がない。催告の抗弁権がない（「先に主債務者に請求して」と言えない）。検索の抗弁権がない（主債務者に財産があっても払わされる）。分別の利益がない（保証人が複数いても全額を請求されうる）。","formula":null},{"title":"債権・債務が消える原因","body":"弁済（借りたお金を返すなど）、代物弁済（お金の代わりに物で返す）、相殺（お互いの債務を対当額で消し合う。AがBに100万円、BがAに40万円の債務なら、残りはAの60万円）。","formula":null},{"title":"債務不履行","body":"約束どおりに履行しないこと。損害賠償を請求するには債務者に帰責事由（責任）が必要で、債務者は帰責事由がないことを証明すれば免れる。一方、契約の解除には債務者の帰責事由は不要。","formula":null},{"title":"不法行為と不当利得","body":"不法行為：故意・過失で他人の権利を侵害し損害を与えること。不当利得：正当な理由なく利益を得ること。善意（事情を知らない）の受益者は今残っている利益を返し、悪意（事情を知っている）の受益者は利息を付けて全額を返す。","formula":null}],"questions":[{"id":"law-6-01","type":"tf","prompt":"保証契約は、口頭で合意すれば有効に成立する。","answer":false,"explanation":"すべての保証契約は、書面（電磁的記録を含む）でしなければ無効。口頭の約束では成立しない。"},{"id":"law-6-02","type":"choice","prompt":"連帯保証人に認められていないものは？","options":["催告の抗弁権・検索の抗弁権・分別の利益のすべて","催告の抗弁権だけ","検索の抗弁権だけ","分別の利益だけ"],"answer":0,"explanation":"連帯保証人には3つとも認められない。そのぶん債権者にとっては回収しやすく、連帯保証人の負担は重い。"},{"id":"law-6-03","type":"choice","prompt":"AはBから100万円を借り、BはAから40万円を借りている。相殺すると、AがBに負う債務は？","options":["60万円","140万円","40万円","0円"],"answer":0,"explanation":"対当額の40万円分をお互いに消し合うので、Aの債務は100−40＝60万円残る。"},{"id":"law-6-04","type":"tf","prompt":"債務不履行を理由に契約を解除するには、債務者の帰責事由が必要である。","answer":false,"explanation":"解除には債務者の帰責事由は不要。帰責事由が必要なのは損害賠償の請求。"},{"id":"law-6-05","type":"choice","prompt":"自然災害で交通が途絶し、売主は商品を納品できなかった（売主に帰責事由なし）。買主ができることは？","options":["契約の解除はできるが、損害賠償は請求できない","損害賠償は請求できるが、契約の解除はできない","契約の解除も損害賠償の請求もできる","どちらもできない"],"answer":0,"explanation":"帰責事由がないので損害賠償は免れるが、解除には帰責事由が不要なので契約は解除できる。"},{"id":"law-6-06","type":"choice","prompt":"法律用語の「善意」の意味は？","options":["ある事情・事実を知らないこと","相手のためを思って行動すること","過失がないこと","故意がないこと"],"answer":0,"explanation":"日常語とは違い、善意＝知らない、悪意＝知っている、という意味。"},{"id":"law-6-07","type":"tf","prompt":"不当利得について悪意の受益者は、受けた利益に利息を付けて返還しなければならない。","answer":true,"explanation":"事情を知っていた受益者は、利益が残っていなくても全部に利息を付けて返し、損害があれば賠償もする。"}]}]},{"id":"it","order":6,"title":"経営情報システム","shortTitle":"情報システム","worldName":"電脳の塔","symbol":"desktopcomputer","theme":"indigo","boss":{"name":"ウイルス将軍","emoji":"👾","taunt":"ファイアウォールなど紙切れ同然よ！"},"stages":[{"id":"it-1","title":"ハードウェア","summary":"コンピュータの5大装置とCPUのはたらきを理解しよう。","cards":[{"title":"ハードウェアとは","body":"コンピュータを構成する電子回路や周辺機器など、機械そのもの。ソフトウェアの命令に従って実際に処理を行う部分。","formula":null},{"title":"コンピュータの5大装置","body":"入力装置（キーボード・マウス・タッチパネル・スキャナ）、出力装置（ディスプレイ・プリンタ・スピーカ）、記憶装置（主記憶＝メモリ、補助記憶＝SSD・ハードディスク）、演算装置、制御装置。","formula":null},{"title":"CPU（中央演算処理装置）","body":"制御装置と演算装置をまとめた処理装置。プログラムの命令を主記憶装置から読み込み、解読・実行して、結果を主記憶装置に書き込む。CPUが直接やり取りするのは主記憶装置で、補助記憶装置ではない。","formula":"CPU ＝ 制御装置 ＋ 演算装置"},{"title":"データの流れ","body":"入力装置や補助記憶装置から主記憶装置にデータを読み込む → CPUが処理して結果を主記憶装置に書き込む → 結果を出力装置に出したり、補助記憶装置に保存したりする。","formula":null}],"questions":[{"id":"it-1-01","type":"tf","prompt":"演算装置は、制御装置の指示で演算結果を補助記憶装置に直接記憶させる。","answer":false,"explanation":"CPU（制御装置＋演算装置）がアクセスするのは主記憶装置。補助記憶装置への保存は主記憶装置を経由する。"},{"id":"it-1-02","type":"choice","prompt":"CPUを構成する装置の組み合わせは？","options":["制御装置と演算装置","記憶装置と演算装置","入力装置と出力装置","制御装置と記憶装置"],"answer":0,"explanation":"制御装置と演算装置をまとめて処理装置（CPU）と呼ぶ。"},{"id":"it-1-03","type":"choice","prompt":"入力装置に該当するものは？","options":["タッチパネル","プリンタ","ディスプレイ","スピーカ"],"answer":0,"explanation":"タッチパネルは入力装置。プリンタ・ディスプレイ・スピーカは出力装置。"},{"id":"it-1-04","type":"choice","prompt":"主記憶装置にあたるものは？","options":["メモリ","SSD","ハードディスク","光ディスク"],"answer":0,"explanation":"主記憶装置はメモリ。SSD・ハードディスク・光ディスクは補助記憶装置。"},{"id":"it-1-05","type":"tf","prompt":"プログラムとは、コンピュータに動作を指示する命令の集まりである。","answer":true,"explanation":"足し算をせよ、といった命令の集まりがプログラム。プログラムとデータをまとめてソフトウェアと呼ぶこともある。"},{"id":"it-1-06","type":"order","prompt":"CPUがプログラムを処理する流れを順に並べよ。","items":["主記憶装置から命令を読み込む","命令を解読する","命令を実行する","結果を主記憶装置に書き込む"],"explanation":"読込 → 解読 → 実行 → 結果の格納、を繰り返してプログラムを処理する。"}]},{"id":"it-2","title":"ソフトウェアとOS","summary":"OS・ミドルウェア・アプリの関係と、電源を入れてから起動するまでを学ぼう。","cards":[{"title":"ソフトウェアの種類","body":"OS（基本ソフトウェア）、アプリケーション（ワープロなどの応用ソフトウェア）、その中間に位置するミドルウェアがある。","formula":null},{"title":"主なOS","body":"Windows（マイクロソフト）、UNIX（AT&Tベル研究所）、Linux（ソースコードが公開され、UNIXと互換）、macOS・iOS（アップル）、Android（Google、ソースコード公開）。","formula":null},{"title":"起動のしくみ","body":"電源を入れると、まずROMにあるBIOSが起動し、メモリや周辺装置の接続を確認する。次に補助記憶装置にあるOSを主記憶装置に読み込み、使える状態になる。ROMは電源を切っても消えない不揮発性の記憶素子。","formula":null},{"title":"OSの機能","body":"ジョブ管理、タスク管理（CPUの有効活用）、記憶管理（主記憶の割り当て、仮想記憶）、入出力管理、ユーザ管理（マルチユーザ）、セキュリティ管理など、コンピュータの資源を効率よく制御する。","formula":null},{"title":"仮想記憶","body":"主記憶装置の容量以上の作業領域が必要なとき、補助記憶装置を使って仮想的に主記憶の作業領域を増やす方式。","formula":null}],"questions":[{"id":"it-2-01","type":"tf","prompt":"OSに先立って起動し、ディスプレイやキーボードを使える状態にするプログラムをBIOSという。","answer":true,"explanation":"BIOS（Basic Input/Output System）は周辺装置の基本的な動作を制御するプログラム。"},{"id":"it-2-02","type":"tf","prompt":"ハードウェアの基本的な制御を行うため機器に組み込まれたソフトウェアを、ミドルウェアという。","answer":false,"explanation":"ミドルウェアは、OS（基本ソフト）とアプリケーション（応用ソフト）の中間に位置するソフトウェア。"},{"id":"it-2-03","type":"choice","prompt":"主記憶の容量が足りないとき、補助記憶装置を使って作業領域を仮想的に増やす方式は？","options":["仮想記憶方式","マルチタスク","シングルサインオン","分散処理"],"answer":0,"explanation":"OSの記憶管理機能のひとつ。"},{"id":"it-2-04","type":"choice","prompt":"ソースコードが公開されており、UNIXと互換性があるOSは？","options":["Linux","Windows","iOS","macOS"],"answer":0,"explanation":"Linuxは中核部分がフリーで配布され、ソースコードが公開されている。"},{"id":"it-2-05","type":"order","prompt":"電源を入れてからの内部動作を順に並べよ。","items":["BIOSが起動する","メモリや周辺装置を確認する","OSを主記憶装置に読み込む","OSがメモリなどを管理する"],"explanation":"CPUはまずBIOSを起動し、周辺装置を確認したあと、補助記憶装置のOSを主記憶装置に読み込む。"},{"id":"it-2-06","type":"choice","prompt":"1台のコンピュータで複数のアプリケーションを同時に起動し、並行して実行できることを何という？","options":["マルチタスク","マルチユーザ","マルチウィンドウ","仮想記憶"],"answer":0,"explanation":"マルチユーザは1台を複数のユーザで共有すること、マルチウィンドウは複数のソフトを画面に同時に表示すること。"},{"id":"it-2-07","type":"tf","prompt":"ROMは、電源を切るとデータが消えてしまう揮発性の記憶素子である。","answer":false,"explanation":"ROMは電源を切ってもデータが消えない不揮発性の記憶素子。現在は書き換え可能なROMが主流。"}]},{"id":"it-3","title":"暗号化","summary":"セキュリティ3大対策と、共通鍵・公開鍵暗号の違いをマスターしよう。","cards":[{"title":"セキュリティの3大対策","body":"暗号化（盗み見られても内容を解読できないようにする）、認証（利用者・サーバ・データが正しいか確かめる）、アクセスコントロール（許可された人だけがアクセスできるようにする）。バランスよく組み合わせる。","formula":null},{"title":"共通鍵暗号方式","body":"暗号化と復号（元に戻すこと）に同じ鍵を使う。処理は速いが、通信相手ごとに別の鍵が必要で、鍵の管理が複雑。代表的なアルゴリズムはDES・AES。秘密鍵暗号方式ともいう。","formula":null},{"title":"公開鍵暗号方式","body":"暗号化と復号で別々の鍵を使う。送信者は受信者の公開鍵で暗号化し、受信者は自分だけが持つ秘密鍵で復号する。鍵の管理は簡単だが、処理が遅い。代表的なアルゴリズムはRSA。","formula":"受信者の公開鍵で暗号化 → 受信者の秘密鍵で復号"},{"title":"ハイブリッド方式","body":"共通鍵そのものを公開鍵暗号で安全に送り、その後のデータは高速な共通鍵暗号でやり取りする。両方の長所を組み合わせた方法。","formula":null}],"questions":[{"id":"it-3-01","type":"choice","prompt":"公開鍵暗号方式で、送信者がデータを暗号化するときに使う鍵は？","options":["受信者の公開鍵","受信者の秘密鍵","送信者の秘密鍵","送信者と受信者の共通鍵"],"answer":0,"explanation":"受信者の公開鍵で暗号化すれば、ペアとなる秘密鍵を持つ受信者しか復号できない。"},{"id":"it-3-02","type":"tf","prompt":"共通鍵暗号方式は、公開鍵暗号方式に比べて暗号化・復号の処理に時間がかかる。","answer":false,"explanation":"逆。共通鍵暗号方式は処理が速く、公開鍵暗号方式は処理が膨大で遅い。"},{"id":"it-3-03","type":"choice","prompt":"共通鍵暗号方式の代表的なアルゴリズムは？","options":["AES","RSA","SSL","IDS"],"answer":0,"explanation":"共通鍵はDES・AES、公開鍵はRSAが代表例。"},{"id":"it-3-04","type":"choice","prompt":"公開鍵暗号方式の特徴として正しいものは？","options":["通信相手ごとに個別の暗号鍵を持つ必要がない","暗号化と復号に同じ鍵を使う","処理速度が非常に速い","代表的なアルゴリズムはDESである"],"answer":0,"explanation":"公開鍵は誰に知られてもよいので、相手ごとに鍵を用意する必要がなく、鍵管理が簡単。"},{"id":"it-3-05","type":"tf","prompt":"ハイブリッド方式では、共通鍵を公開鍵暗号方式で送ることで、初めての相手とも共通鍵暗号で通信できる。","answer":true,"explanation":"鍵の受け渡しの安全性（公開鍵）と、処理の速さ（共通鍵）を両立できる。"},{"id":"it-3-06","type":"choice","prompt":"暗号化されたデータを元の読める状態に戻すことを何という？","options":["復号","解凍","符号化","圧縮"],"answer":0,"explanation":"暗号化の反対が復号。"},{"id":"it-3-07","type":"choice","prompt":"セキュリティの3大対策に含まれないものは？","options":["バックアップ","暗号化","認証","アクセスコントロール"],"answer":0,"explanation":"本書で扱う3大対策は暗号化・認証・アクセスコントロール。"}]},{"id":"it-4","title":"認証とアクセスコントロール","summary":"本人確認の方法と、不正アクセスを防ぐしくみを学ぼう。","cards":[{"title":"ユーザ認証","body":"ワンタイムパスワード（1回限りの使い捨て。漏れても次回は使えない）、シングルサインオン（1度の認証で許可された全システムを使える）、バイオメトリクス（指紋・声紋・顔など身体的特徴を使う生体認証）。","formula":null},{"title":"サーバ認証とSSL","body":"通信先のサーバが正当な運営者かを確認する。SSLは共通鍵・公開鍵暗号やデジタル署名を組み合わせ、サーバ認証とデータの暗号化を行うプロトコル。ネットショッピングなどで使われる。","formula":null},{"title":"メッセージ認証とハッシュ関数","body":"データが改ざんされていないかを確認する。ハッシュ関数は元のデータから固定長の値（ハッシュ値）を作る。値から元のデータに戻せない（一方向性）、元が少しでも違うと値が大きく変わる、という特徴がある。","formula":null},{"title":"ファイアウォールとDMZ","body":"ファイアウォールは、社内LANとインターネットの間で不正なアクセスを検出・遮断する。DMZ（非武装地帯）は外部と内部の中間に置く区域で、Webサーバやメールサーバなど公開が必要なサーバを置く。","formula":null},{"title":"IDS（侵入検知システム）","body":"ファイアウォールで防ぎきれない不正アクセスを監視・検知し、管理者に知らせる。回線上を監視するネットワーク型と、コンピュータ内部を監視するホスト型がある。ファイアウォールと併用するのが望ましい。","formula":null}],"questions":[{"id":"it-4-01","type":"tf","prompt":"生体認証では、IDとパスワードに加えてセキュリティトークンによって利用者を認証する。","answer":false,"explanation":"生体認証（バイオメトリクス）は、指紋・声紋・顔・署名の動作など、その人特有の身体的特徴を使う。"},{"id":"it-4-02","type":"choice","prompt":"一度の認証で、アクセスを許可されたすべての機能を利用できるしくみは？","options":["シングルサインオン","ワンタイムパスワード","バイオメトリクス","デジタル署名"],"answer":0,"explanation":"アプリごとにログインする手間が省け、利便性が上がる。"},{"id":"it-4-03","type":"choice","prompt":"ネットワークへの不正侵入を監視し、検知すると管理者に通知するシステムは？","options":["IDS","DMZ","SSL","SaaS"],"answer":0,"explanation":"IDS（Intrusion Detection System）は侵入検知システム。"},{"id":"it-4-04","type":"choice","prompt":"公開Webサーバなどを置くための、外部ネットワークと内部ネットワークの中間にある区域は？","options":["DMZ","LAN","IDS","VPN"],"answer":0,"explanation":"公開サーバが攻撃されても、内部ネットワークにまで被害が及びにくい。"},{"id":"it-4-05","type":"tf","prompt":"ハッシュ値（メッセージダイジェスト）から、元の文章を容易に復元できる。","answer":false,"explanation":"ハッシュ関数には一方向性があり、ハッシュ値から元の文章に戻すのは極めて難しい。"},{"id":"it-4-06","type":"choice","prompt":"ワンタイムパスワードの特徴として正しいものは？","options":["パスワードが漏れても次回以降のアクセスには使えない","一度ログインすればすべてのシステムを使える","身体的な特徴で本人を確認する","同じパスワードを繰り返し安全に使える"],"answer":0,"explanation":"1回限りの使い捨てなので、金融機関の送金など高い機密性が求められる場面で広く使われる。"},{"id":"it-4-07","type":"choice","prompt":"「相手が正当か」と「情報が改ざんされていないか」を確かめる、電子文書のための認証技術は？","options":["デジタル署名","ファイアウォール","仮想記憶","シングルサインオン"],"answer":0,"explanation":"紙の契約書のサインや印鑑にあたるのがデジタル署名。"}]},{"id":"it-5","title":"DX（デジタルトランスフォーメーション）","summary":"IT化とDXの違い、DXに至る3つのステップを押さえよう。","cards":[{"title":"DXとは","body":"デジタル技術を使って、ビジネスや働き方を根本から変えること。紙の伝票をExcelに入力するような単なるIT化とは違う。","formula":null},{"title":"中小企業にDXが必要な理由","body":"顧客の行動の変化（ネットやSNSで検索・比較し、口コミを見てから買う）と、人手不足（単純作業を自動化し、人は創造的な仕事に集中する必要がある）。","formula":null},{"title":"DX実現の3ステップ","body":"Step1 デジタイゼーション：アナログをデジタルに（紙の帳簿を表計算ソフトへ）。Step2 デジタライゼーション：業務プロセスのデジタル化（受発注のシステム化）。Step3 デジタルトランスフォーメーション：ビジネスモデルの変革（集めたデータを他社に販売する）。","formula":"デジタイゼーション → デジタライゼーション → DX"}],"questions":[{"id":"it-5-01","type":"order","prompt":"DX実現のステップを順に並べよ。","items":["デジタイゼーション","デジタライゼーション","デジタルトランスフォーメーション"],"explanation":"アナログのデジタル化 → 業務プロセスのデジタル化 → ビジネスモデルの変革、の順に進む。"},{"id":"it-5-02","type":"choice","prompt":"紙の帳簿を表計算ソフトへの入力に切り替えた段階は？","options":["デジタイゼーション","デジタライゼーション","デジタルトランスフォーメーション","リエンジニアリング"],"answer":0,"explanation":"アナログからデジタルへの置き換え（デジタル化・IT化）がデジタイゼーション。"},{"id":"it-5-03","type":"choice","prompt":"受発注をシステム化して、業務プロセス全体をデジタル化した段階は？","options":["デジタライゼーション","デジタイゼーション","デジタルトランスフォーメーション","アウトソーシング"],"answer":0,"explanation":"個々の作業ではなく、業務の流れそのものをデジタル化するのがデジタライゼーション。"},{"id":"it-5-04","type":"tf","prompt":"製造業が、工場で集めたデータを他社に販売する事業を始めるのは、DXの例といえる。","answer":true,"explanation":"製造業からデータ販売業へと、ビジネスモデルそのものを変えているのでDXにあたる。"},{"id":"it-5-05","type":"tf","prompt":"DXとは、紙の業務をパソコンに置き換えるIT化のことである。","answer":false,"explanation":"それはデジタイゼーション（IT化）。DXはデジタル技術でビジネスや働き方を根本から変えること。"},{"id":"it-5-06","type":"choice","prompt":"中小企業にDXが必要とされる背景として、本単元で挙げたものは？","options":["顧客行動の変化と人手不足","人口の増加と需要の過多","金利の上昇と円高","補助金の廃止と規制強化"],"answer":0,"explanation":"ネットで比較してから買う顧客が増え、人手も不足している。自動化や遠隔でも回る仕組みが求められている。"}]},{"id":"it-6","title":"クラウドコンピューティング","summary":"クラウドのしくみとメリット、SaaS・PaaS・IaaSの違いを学ぼう。","cards":[{"title":"クラウドコンピューティング","body":"インターネット上（雲の向こう）にあるソフトウェアやサービスを、パソコンやスマホなど端末を問わずに利用するしくみ。月額などで払うサブスクリプション型が多い。","formula":null},{"title":"利用者のメリット","body":"端末や場所を問わず使える。ソフトの開発や一括購入が不要で初期投資を抑えられる。利用量に合わせて柔軟にサービスを変更できる。","formula":null},{"title":"クラウドを支える3つの技術","body":"仮想化技術（物理的な構成に依存せずに使える）、分散技術（複数のコンピュータを連携させ1つのシステムとして動かす）、セキュリティ技術（不特定多数がいるネットワークで安全にやり取りする）。","formula":null},{"title":"SaaS・PaaS・IaaS","body":"SaaS：アプリケーション（ソフトウェア）まで提供。PaaS：アプリを動かす基盤（OS・ミドルウェア）まで提供。IaaS：ハードウェアやネットワークなどのインフラを提供。","formula":"事業者が提供する範囲：SaaS ＞ PaaS ＞ IaaS"},{"title":"パブリック・プライベート・ハイブリッド","body":"パブリッククラウドは業界を問わず企業や個人に開かれた環境。プライベートクラウドは企業が自社専用に構築し、社内の部署やグループ会社に提供する環境。両者を併用するのがハイブリッドクラウド。","formula":null}],"questions":[{"id":"it-6-01","type":"choice","prompt":"アプリケーション（ソフトウェア）までをサービスとして提供するクラウドは？","options":["SaaS","PaaS","IaaS","DaaS"],"answer":0,"explanation":"SaaS（Software as a Service）。Web上のメールや会計ソフトなどが代表例。"},{"id":"it-6-02","type":"choice","prompt":"OSやハードウェア、通信機器などのインフラを提供するクラウドは？","options":["IaaS","SaaS","PaaS","ASP"],"answer":0,"explanation":"IaaS（Infrastructure as a Service）。アプリを動かす基盤まで提供するのはPaaS。"},{"id":"it-6-03","type":"tf","prompt":"パブリッククラウドは、複数の利用者からなる単一組織の専用使用のために提供される。","answer":false,"explanation":"パブリッククラウドは業界・業種を問わず企業や個人に提供されるオープンな形態。専用使用はプライベートクラウド。"},{"id":"it-6-04","type":"choice","prompt":"複数のコンピュータを連携させ、1つのシステムとして動作させる、クラウドを支える技術は？","options":["分散技術","仮想化技術","暗号化技術","圧縮技術"],"answer":0,"explanation":"利用者からは1つのシステムに見えるが、実際は複数のサーバ上で動いている。"},{"id":"it-6-05","type":"tf","prompt":"クラウドコンピューティングは、ソフトウェアを一括購入するため初期投資が大きくなるのが欠点である。","answer":false,"explanation":"一括購入や開発が不要で、初期投資を抑えられるのがメリット。"},{"id":"it-6-06","type":"tf","prompt":"プライベートクラウドは、営利を目的としない利用者の専用使用のために提供される形態である。","answer":false,"explanation":"プライベートクラウドは企業が自社専用に構築する形態。営利か非営利かは問わない。"},{"id":"it-6-07","type":"choice","prompt":"パブリッククラウドとプライベートクラウドを併用する形態は？","options":["ハイブリッドクラウド","マルチテナント","オンプレミス","エッジコンピューティング"],"answer":0,"explanation":"用途に応じて使い分け、両方の利点を活かす。"}]}]},{"id":"sme","order":7,"title":"中小企業経営・中小企業政策","shortTitle":"中小企業経営・政策","worldName":"白書の港","symbol":"building.2.fill","theme":"pink","boss":{"name":"倒産クラーケン","emoji":"🐙","taunt":"資金繰りの渦に、会社ごと沈めてやろう…！"},"stages":[{"id":"sme-1","title":"中小企業の定義","summary":"業種ごとの資本金・従業員数の基準を、確実に覚えよう。","cards":[{"title":"中小企業基本法の定義","body":"製造業・建設業・運輸業その他：資本金3億円以下 または 従業員300人以下。卸売業：1億円以下 または 100人以下。小売業・飲食店：5千万円以下 または 50人以下。サービス業：5千万円以下 または 100人以下。","formula":"製造業等 3億/300人　卸売 1億/100人\n小売・飲食 5千万/50人　サービス 5千万/100人"},{"title":"「または」がポイント","body":"資本金か従業員数のどちらか一方の条件を満たせば、中小企業者になる。両方を満たす必要はない。","formula":null},{"title":"小規模企業者","body":"常時使用する従業員が20人以下（商業〈卸売業・小売業・飲食店〉とサービス業は5人以下）の事業者。資本金の基準はなく、従業員数だけで判断する。","formula":"小規模企業者：20人以下（商業・サービス業は5人以下）"},{"title":"常時使用する従業員","body":"労働基準法でいう「あらかじめ解雇の予告を必要とする者」を指す。会社役員や個人事業主は含まない。パートや派遣社員などは個別に判断する。","formula":null}],"questions":[{"id":"sme-1-01","type":"choice","prompt":"中小企業基本法で、小売業の中小企業の範囲は？","options":["資本金5千万円以下または従業員50人以下","資本金5千万円以下または従業員100人以下","資本金1億円以下または従業員100人以下","資本金3億円以下または従業員300人以下"],"answer":0,"explanation":"小売業・飲食店は5千万円・50人。サービス業は5千万円・100人、卸売業は1億円・100人。"},{"id":"sme-1-02","type":"tf","prompt":"従業員数150人、資本金6千万円のサービス業は、中小企業に該当する。","answer":false,"explanation":"サービス業の基準は資本金5千万円以下または従業員100人以下。どちらも満たさないので該当しない。"},{"id":"sme-1-03","type":"choice","prompt":"資本金2億円、従業員500人の製造業は、中小企業に該当する？","options":["該当する（資本金の基準を満たしている）","該当しない（従業員数が基準を超えている）","該当しない（両方の基準を満たす必要がある）","該当しない（製造業は資本金1億円以下が条件）"],"answer":0,"explanation":"製造業は資本金3億円以下または従業員300人以下。「または」なので資本金の基準だけで中小企業になる。"},{"id":"sme-1-04","type":"choice","prompt":"商業・サービス業における小規模企業者の従業員基準は？","options":["5人以下","20人以下","10人以下","50人以下"],"answer":0,"explanation":"小規模企業者は20人以下、ただし商業（卸売・小売・飲食）とサービス業は5人以下。"},{"id":"sme-1-05","type":"tf","prompt":"小規模企業者かどうかは、資本金と従業員数の両方の基準で判断する。","answer":false,"explanation":"小規模企業者は従業員数だけで判断し、資本金の基準はない。"},{"id":"sme-1-06","type":"choice","prompt":"中小企業基本法で、卸売業の中小企業の範囲は？","options":["資本金1億円以下または従業員100人以下","資本金5千万円以下または従業員50人以下","資本金3億円以下または従業員300人以下","資本金1億円以下または従業員50人以下"],"answer":0,"explanation":"卸売業は1億円・100人。"},{"id":"sme-1-07","type":"tf","prompt":"会社役員は「常時使用する従業員」に含まれない。","answer":true,"explanation":"会社役員や個人事業主は、あらかじめ解雇の予告を必要とする者ではないため、従業員に含まれない。"}]},{"id":"sme-2","title":"中小企業の特徴","summary":"大企業と比べた中小企業の特徴、強みと弱みをつかもう。","cards":[{"title":"定性的な特徴","body":"①所有と経営の非分離（株主＝経営者）②資金調達の非公開性（証券市場から調達しにくい）③事業活動の地域性 ④下請の部品加工や地場産業に多い ⑤経営者・従業者の役割が大きい ⑥疑似資本の存在。","formula":null},{"title":"疑似資本","body":"金融機関からの借入金なのに、継続的な借換えなどで実質的に返済の必要がなく、資本のような性格を持つ資金。中小企業の自己資本を補っているといわれる。","formula":null},{"title":"中小企業の強み","body":"①意思決定の迅速性：オーナー経営者が多く、他からの制約が少ないので大胆・迅速に決められる。②コミュニケーションの緊密性：規模が小さく、トップと従業員の距離が近い。","formula":null},{"title":"中小企業の弱み","body":"経営資源の質・量が不十分。借入れが難しく相対的に金利が高い、人材の確保が難しい、情報が遅れがち、など。","formula":null}],"questions":[{"id":"sme-2-01","type":"choice","prompt":"借入金でありながら、継続的な借換えにより中小企業にとって事実上資本の性格を持つ資金を何という？","options":["疑似資本","自己資本","内部留保","劣後ローン"],"answer":0,"explanation":"本来は負債なのに自己資本のような性格を持つので「疑似」資本と呼ばれる。"},{"id":"sme-2-02","type":"tf","prompt":"中小企業では、株式会社であっても少数の株主が経営者を兼ねていることが多い。","answer":true,"explanation":"これが「所有と経営の非分離」。大企業では株主と経営者が分かれていることが多い。"},{"id":"sme-2-03","type":"choice","prompt":"中小企業の強みとして挙げられるものは？","options":["意思決定の迅速性","豊富な経営資源","証券市場からの資金調達力","全国的な販売網"],"answer":0,"explanation":"強みは意思決定の迅速性と、社内コミュニケーションの緊密性。"},{"id":"sme-2-04","type":"choice","prompt":"中小企業の弱みとして適切なものは？","options":["経営資源の質・量が不十分","社内のコミュニケーションが希薄","意思決定が遅い","地域とのつながりが弱い"],"answer":0,"explanation":"資金・人材・情報などの経営資源が不足しがちなのが最大の弱み。"},{"id":"sme-2-05","type":"tf","prompt":"中小企業の大半は、証券市場から容易に資金を調達できる。","answer":false,"explanation":"多くの中小企業は上場基準を満たさず、証券市場からの資金調達は難しい（資金調達の非公開性）。"},{"id":"sme-2-06","type":"tf","prompt":"中小企業では、従業者が特定の業務に専門化するよりも、周辺・関連業務も担当して役割の範囲が広い傾向がある。","answer":true,"explanation":"経営者の裁量が大きく、従業者も幅広い役割を担うのが中小企業の特徴のひとつ。"}]},{"id":"sme-3","title":"白書で見る中小企業","summary":"企業数・従業者数・売上高・付加価値額の「基本の数字」を押さえよう。","cards":[{"title":"企業数","body":"中小企業は約340万者で、国内企業全体の99.7％。そのうち小規模企業が全体の84.5％を占める。中小企業の数が多い業種は ①小売業 ②建設業 ③宿泊業・飲食サービス業。","formula":"中小企業 99.7％（うち小規模企業 84.5％）"},{"title":"従業者数","body":"中小企業で働く人は約3,300万人で全体の約7割（69.7％）。小規模企業は約2割（20.5％）。中小企業の従業者が多い業種は ①製造業 ②小売業 ③宿泊業・飲食サービス業。小規模企業では ①建設業 ②製造業 ③小売業。","formula":"中小企業 69.7％　小規模企業 20.5％"},{"title":"売上高と付加価値額","body":"中小企業の売上高は約680兆円で全体の47.3％（小規模企業は10.5％）。付加価値額は約140兆円で56.0％（小規模企業は14.5％）。売上高の多い業種は ①卸売業 ②製造業 ③建設業、付加価値額は ①製造業 ②建設業 ③卸売業。","formula":"売上高 47.3％　付加価値額 56.0％"},{"title":"業種の順位のコツ","body":"小規模企業は、従業者数・売上高・付加価値額のどれも建設業がトップ。従業者数・売上高・付加価値額について、その業種全体に占める中小企業の割合（構成比）が最も高いのは医療・福祉。","formula":null},{"title":"中小企業白書","body":"中小企業基本法第11条に基づき、政府が毎年国会に提出する年次報告書。中小企業の動向と、政府が講じた施策をまとめている。中小企業の「健康診断書」ともいえる。","formula":null}],"questions":[{"id":"sme-3-01","type":"choice","prompt":"国内の企業数に占める中小企業の割合は？","options":["99.7％","84.5％","69.7％","47.3％"],"answer":0,"explanation":"中小企業は約340万者で99.7％。84.5％は小規模企業の割合、69.7％は従業者数、47.3％は売上高の割合。"},{"id":"sme-3-02","type":"choice","prompt":"国内の企業数に占める小規模企業の割合は？","options":["約8割強（84.5％）","約5割","約2割","約99％"],"answer":0,"explanation":"企業数では小規模企業が約8割強。従業者数では約2割なので、混同しないように。"},{"id":"sme-3-03","type":"choice","prompt":"中小企業で働く従業者が全体に占める割合は？","options":["約7割（69.7％）","約5割","約3割","約9割"],"answer":0,"explanation":"中小企業の従業者は約3,300万人で約7割。小規模企業は約2割（20.5％）。"},{"id":"sme-3-04","type":"choice","prompt":"中小企業の企業数が最も多い業種は？","options":["小売業","建設業","製造業","卸売業"],"answer":0,"explanation":"企業数は ①小売業 ②建設業 ③宿泊業・飲食サービス業 の順。"},{"id":"sme-3-05","type":"tf","prompt":"小規模企業の売上高を業種別に比べると、建設業が最も多い。","answer":true,"explanation":"小規模企業の売上高は ①建設業 ②製造業 ③卸売業。小規模企業は従業者数・付加価値額でも建設業がトップ。"},{"id":"sme-3-06","type":"choice","prompt":"中小企業の従業者数が最も多い業種は？","options":["製造業","小売業","建設業","宿泊業・飲食サービス業"],"answer":0,"explanation":"中小企業の従業者数は ①製造業 ②小売業 ③宿泊業・飲食サービス業 の順。"},{"id":"sme-3-07","type":"tf","prompt":"中小企業白書は、中小企業基本法に基づいて政府が毎年国会に提出する年次報告である。","answer":true,"explanation":"中小企業基本法第11条に基づく。中小企業の動向と、講じた施策を報告する。"},{"id":"sme-3-08","type":"choice","prompt":"全体の付加価値額に占める中小企業の割合は？","options":["56.0％","47.3％","69.7％","14.5％"],"answer":0,"explanation":"付加価値額は約140兆円で56.0％。売上高（47.3％）よりも割合が高い。"}]},{"id":"sme-4","title":"中小企業基本法","summary":"中小企業政策の「憲法」の理念・方針・政府の役割を押さえよう。","cards":[{"title":"中小企業基本法とは","body":"中小企業政策の憲法ともいえる法律。基本理念・基本方針や国・地方公共団体の責務などを定め、国民経済の健全な発展と国民生活の向上を目指す。","formula":null},{"title":"中小企業に期待される4つの役割","body":"①新たな産業の創出 ②就業の機会の増大 ③市場における競争の促進 ④地域における経済の活性化。国は、独立した中小企業の自主的な努力を前提に「多様で活力ある成長発展」を支える。","formula":null},{"title":"4つの基本方針（第5条）","body":"①経営の革新および創業の促進 ②経営基盤の強化 ③経済的社会的環境の変化への適応の円滑化（セーフティネット）④資金の供給の円滑化および自己資本の充実（①〜③の土台）。","formula":null},{"title":"小規模企業の意義","body":"2013年の改正で、小規模企業が地域の特色を活かした事業で「地域における経済の安定並びに地域住民の生活の向上及び交流の促進」に寄与し、将来の経済・社会の発展にも寄与する、という意義が基本理念に加わった。","formula":null},{"title":"政府の役割と用語","body":"政府は法制上・財政上・金融上の措置（第9条）、定期的な実態調査（第10条）、年次報告＝中小企業白書（第11条）を行う。「経営の革新」は新商品・新しい販売方式の導入などで経営を相当程度向上させること。「創造的な事業活動」は著しく新しい技術などを使うベンチャー的な事業活動。","formula":null}],"questions":[{"id":"sme-4-01","type":"choice","prompt":"中小企業基本法の基本方針として不適切なものは？","options":["地域における多様な需要に応じた事業活動の活性化を図ること","経営の革新および創業の促進を図ること","経済的社会的環境の変化への適応の円滑化を図ること","中小企業の経営基盤の強化を図ること"],"answer":0,"explanation":"第5条の基本方針に、地域の多様な需要に応じた事業活動の活性化という項目はない。"},{"id":"sme-4-02","type":"choice","prompt":"中小企業基本法が中小企業に期待する役割に含まれないものは？","options":["大企業との取引の拡大","新たな産業の創出","就業の機会の増大","地域における経済の活性化"],"answer":0,"explanation":"4つの役割は、新たな産業の創出・就業機会の増大・市場競争の促進・地域経済の活性化。"},{"id":"sme-4-03","type":"choice","prompt":"基本理念で、小規模企業は「地域における経済の安定並びに（　）に寄与する」とされている。空欄に入るのは？","options":["地域住民の生活の向上及び交流の促進","活力ある経済と豊かな国民生活","雇用基盤の維持","社会の変革"],"answer":0,"explanation":"小規模企業について問われたら「地域」という観点で選ぶのがコツ。"},{"id":"sme-4-04","type":"tf","prompt":"政府は毎年、中小企業の動向と講じた施策に関する報告を国会に提出しなければならない。","answer":true,"explanation":"第11条の年次報告。これが中小企業白書。"},{"id":"sme-4-05","type":"choice","prompt":"著しい新規性のある技術や創造的な経営管理手法を活用した、ベンチャー的な事業活動を表す用語は？","options":["創造的な事業活動","経営の革新","経営資源","事業の持続的発展"],"answer":0,"explanation":"経営の革新や創業のうち、特に新規性が高いものが創造的な事業活動。"},{"id":"sme-4-06","type":"tf","prompt":"基本方針のうち「資金の供給の円滑化および自己資本の充実」は、他の3つの方針の土台として位置づけられている。","answer":true,"explanation":"資金面の支えがあってこそ、経営革新・経営基盤強化・環境変化への適応が進められる。"}]},{"id":"sme-5","title":"小規模基本法と支援機関","summary":"小規模企業に焦点をあてた法律と、中小企業を支える支援機関を知ろう。","cards":[{"title":"小規模基本法（小規模企業振興基本法）","body":"2014年に成立。小規模企業について、中小企業基本法の「成長発展」だけでなく、技術・ノウハウの向上や安定的な雇用の維持を含む「事業の持続的発展」を位置づけた。小企業者（おおむね従業員5人以下）も対象に含む。","formula":null},{"title":"小規模企業振興基本計画","body":"政府が5年間の基本計画を定め、おおむね5年ごとに見直す。4つの目標と15の重点施策からなる。小規模基本法の基本方針も、中小企業基本法と同じく4つ。","formula":null},{"title":"中小企業支援法","body":"2000年に旧中小企業指導法から改正された法律で、中小企業診断士制度の根拠になっている。","formula":null},{"title":"主な支援機関","body":"都道府県等中小企業支援センター（都道府県・政令指定都市の支援事業の中心）。中小企業基盤整備機構（中小機構）：中小企業大学校、小規模企業共済、経営セーフティ共済、J-Net21、よろず支援拠点の本部機能などを担う独立行政法人。","formula":null},{"title":"商工会・商工会議所","body":"商工業の改善発達を図る地域の総合経済団体。商工会は主に町村地域に約1,600か所、商工会議所は主に市の地域に約500か所ある。","formula":null}],"questions":[{"id":"sme-5-01","type":"tf","prompt":"小規模基本法では、政府はおおむね5年ごとに基本計画を変更するものとされている。","answer":true,"explanation":"5年間の基本計画を定めることで、政策の継続性・一貫性を担保している。"},{"id":"sme-5-02","type":"choice","prompt":"中小企業診断士制度の根拠となっている法律は？","options":["中小企業支援法","中小企業基本法","小規模基本法","会社法"],"answer":0,"explanation":"中小企業支援法は、1999年の中小企業基本法改正に合わせて2000年に旧中小企業指導法から改正された。"},{"id":"sme-5-03","type":"choice","prompt":"小規模基本法が、小規模企業について新たに位置づけた考え方は？","options":["事業の持続的発展","大企業への成長","海外展開の促進","株式上場の支援"],"answer":0,"explanation":"成長発展だけでなく、雇用を維持しながら事業を続けていくこと自体を重視している。"},{"id":"sme-5-04","type":"choice","prompt":"主に町村地域に設置されている地域の総合経済団体は？","options":["商工会","商工会議所","中小企業支援センター","よろず支援拠点"],"answer":0,"explanation":"町村は商工会（約1,600か所）、市は商工会議所（約500か所）。"},{"id":"sme-5-05","type":"choice","prompt":"経営セーフティ共済の運営や、よろず支援拠点の本部機能を担う独立行政法人は？","options":["中小企業基盤整備機構","日本政策金融公庫","商工会議所","信用保証協会"],"answer":0,"explanation":"中小機構は全国9か所の地域本部と沖縄事務所で、さまざまな経営サポートを行っている。"},{"id":"sme-5-06","type":"tf","prompt":"小規模基本法でいう「小企業者」は、おおむね常時使用する従業員が20人以下の事業者である。","answer":false,"explanation":"小企業者は、おおむね従業員5人以下。20人以下は小規模企業者の基準（製造業など）。"},{"id":"sme-5-07","type":"tf","prompt":"中小企業基本法と小規模基本法の基本方針は、どちらも4つずつある。","answer":true,"explanation":"数は同じだが中身は違う。比較して覚えるのがおすすめ。"}]},{"id":"sme-6","title":"中小企業向け融資制度","summary":"セーフティネット貸付・起業家支援資金・マル経融資の対象と条件を覚えよう。","cards":[{"title":"セーフティネット貸付（経営環境変化対応資金）","body":"社会的・経済的な外部要因で一時的に売上が減るなど業況が悪化したが、中長期的には回復が見込まれる中小企業向けの融資。最近の売上高が5％以上減少している者などが対象。日本政策金融公庫が行う。","formula":null},{"title":"女性、若者／シニア起業家支援資金","body":"女性（年齢制限なし）、35歳未満の若者、55歳以上の高齢者で、新規開業しておおむね7年以内の者に、優遇金利で融資する。日本政策金融公庫が行う。","formula":"若者：35歳未満　シニア：55歳以上　開業後：おおむね7年以内"},{"title":"マル経融資（小規模事業者経営改善資金）","body":"小規模事業者向けの、無担保・無保証人・低利の融資。商工会・商工会議所の経営指導員が経営指導を行い、推薦したうえで日本政策金融公庫が貸し付ける。","formula":null},{"title":"マル経融資の主な要件","body":"従業員20人以下（商業・サービス業は5人以下。ただし宿泊業・娯楽業は20人以下）。経営指導員の経営指導を原則6か月以上受けている。税金を完納している。原則として同一地区で1年以上事業を行っている。限度額は2,000万円。","formula":"経営指導 6か月以上　同一地区 1年以上　限度額 2,000万円"}],"questions":[{"id":"sme-6-01","type":"choice","prompt":"マル経融資の特徴として正しいものは？","options":["無担保・無保証人・低利","有担保・保証人必要・低利","無担保・保証人必要・高利","大企業も利用できる"],"answer":0,"explanation":"マル経融資は小規模事業者向けの、無担保・無保証人で基準金利より低い融資制度。"},{"id":"sme-6-02","type":"choice","prompt":"マル経融資を受けるには、経営指導員の経営指導を原則どれくらい受けている必要がある？","options":["6か月以上","1か月以上","1年以上","3年以上"],"answer":0,"explanation":"経営指導は原則6か月以上。事業期間は同一地区で1年以上。数字の組み合わせを区別して覚える。"},{"id":"sme-6-03","type":"tf","prompt":"マル経融資の対象になるには、原則として同一の商工会等の地区内で1年以上事業を行っている必要がある。","answer":true,"explanation":"地域に根ざして事業を行っていることが条件のひとつ。"},{"id":"sme-6-04","type":"choice","prompt":"女性、若者／シニア起業家支援資金の「若者」「シニア」の年齢基準は？","options":["35歳未満・55歳以上","30歳未満・60歳以上","40歳未満・65歳以上","25歳未満・50歳以上"],"answer":0,"explanation":"女性は年齢制限なし、若者は35歳未満、シニアは55歳以上。新規開業しておおむね7年以内が対象。"},{"id":"sme-6-05","type":"choice","prompt":"セーフティネット貸付の対象として最も適切なものは？","options":["外的要因で一時的に業況が悪化したが、中長期的には回復が見込まれる企業","恒常的に赤字で、回復の見込みがない企業","まだ開業していない個人","上場を予定している大企業"],"answer":0,"explanation":"一時的な業況悪化を乗り越えるための資金。中長期的に回復・発展が見込まれることが前提。"},{"id":"sme-6-06","type":"choice","prompt":"セーフティネット貸付や女性、若者／シニア起業家支援資金を行っている機関は？","options":["日本政策金融公庫","中小企業基盤整備機構","商工会","日本銀行"],"answer":0,"explanation":"いずれも日本政策金融公庫の融資制度。マル経融資も最終的に公庫が貸し付ける。"},{"id":"sme-6-07","type":"tf","prompt":"マル経融資では、宿泊業・娯楽業は従業員5人以下でなければ対象にならない。","answer":false,"explanation":"商業・サービス業は5人以下だが、宿泊業・娯楽業は例外で20人以下が対象。"}]}]}]</script>

// claude.ai 上では、閲覧者ごとの非公開領域にも保存する
const inArtifact = !!(window.claude && typeof window.claude.use === 'function');
const cloud = { ref: null, dirty: false, busy: false, timer: 0 };
async function connectCloud() {
  if (!inArtifact) return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc(`data/users/${uid}/progress`);
    const snap = await ref.get();
    cloud.ref = ref;
    if (snap.exists) {
      const remote = normalize(snap.data());
      if ((remote.savedAt || 0) > (S.savedAt || 0) || bootSavedAt === 0) {
        S = remote;
        saveLocal();
        render();
      } else if ((S.savedAt || 0) > (remote.savedAt || 0)) {
        queueCloud();
      }
    } else if (S.savedAt) {
      queueCloud();
    }
    renderSyncStatus();
  } catch (e) {
    cloud.ref = null;
  }
}
function queueCloud() {
  if (!cloud.ref) return;
  cloud.dirty = true;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(flushCloud, 1500);
}
async function flushCloud() {
  if (!cloud.ref || cloud.busy || !cloud.dirty) return;
  cloud.busy = true;
  cloud.dirty = false;
  try {
    await cloud.ref.set(JSON.parse(JSON.stringify(S)));
  } catch (e) {
    if (e && e.code === 'unavailable') {
      cloud.dirty = true;
      setTimeout(flushCloud, 2500 + Math.random() * 2500);
    } else {
      cloud.ref = null;
    }
  } finally {
    cloud.busy = false;
    if (cloud.dirty && cloud.ref) queueCloud();
    renderSyncStatus();
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushCloud(); });

  for (let i = 0; i < times; i++) {
    const own = S.items[id];
    if (own.lv >= maxLv(id)) break;
    const cost = enhanceCost(id);
    if (S.gold < cost) break;
    S.gold -= cost; r.spent += cost;
    const roll = Math.random();
    let up = 1;
    if (roll < 0.03) { up = 3; r.super++; } else if (roll < 0.15) { up = 2; r.great++; }
    own.lv = Math.min(maxLv(id), own.lv + up);
    r.done++;

  r.after = S.items[id].lv;
  persist();
  return r;
}

const COST_1 = 150, COST_10 = 1500, PITY = 60;
const RATE_TABLE = [['UR', 0.5], ['SSR', 4.5], ['SR', 13], ['R', 32], ['N', 50]];
function rollRarity(minRank) {
  const allowed = RATE_TABLE.filter(([r]) => RANK[r] >= minRank);
  let x = Math.random() * allowed.reduce((n, [, p]) => n + p, 0);
  for (const [r, p] of allowed) { if (x < p) return r; x -= p; }
  return allowed[allowed.length - 1][0];
}
const pickupFor = (d = new Date()) => { const pool = ITEMS.filter((i) => i.rarity === 'SSR'); return pool[hashSeed('pickup' + dayKey(d)) % pool.length]; };
function rollItem(rarity) {
  if (rarity === 'SSR' && Math.random() < 0.5) return pickupFor();

  return pool[Math.floor(Math.random() * pool.length)];
}
function grantItem(item) {

  own.got = (own.got || 1) + 1;

function summon(n, pay) {

  else { if (S.tickets < n) return null; S.tickets -= n; }

    if (RANK[rarity] >= 3) S.pity = 0; else S.pity++;

}

function sfx(kind) {
  if (!S.sound) return;
  try {
    if ('audioSession' in navigator) navigator.audioSession.type = 'ambient';
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const tunes = {
      good: [[659, 0, .12], [988, .08, .18]],
      bad: [[196, 0, .16], [165, .1, .22]],
      win: [[523, 0, .14], [659, .1, .14], [784, .2, .14], [1047, .3, .3]],
      hit: [[330, 0, .08], [220, .05, .1]],
      coin: [[1319, 0, .08], [1760, .06, .14]],
      rare: [[784, 0, .14], [988, .12, .14], [1175, .24, .14], [1568, .36, .4]],
      up: [[523, 0, .08], [784, .07, .12]],
    }[kind] || [];
    const t0 = audio.currentTime;
    for (const [freq, at, len] of tunes) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = kind === 'bad' ? 'triangle' : 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0 + at);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + at + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + len);
      o.connect(g).connect(audio.destination);
      o.start(t0 + at);
      o.stop(t0 + at + len + 0.02);
    }
  } catch (e) { /* 音が出せない環境 */ }
}

function present(quiz, q) {
  quiz.current = q;
  quiz.turn++;
  quiz.feedback = null;
  quiz.phase = 'answering';
  quiz.picked = [];
  quiz.removed = [];
  if (q.type === 'choice') quiz.choiceOrder = shuffle(q.options.map((_, i) => i));
  if (q.type === 'order') {
    let s = shuffle(q.items);
    while (q.items.length > 1 && s.every((x, i) => x === q.items[i])) s = shuffle(q.items);
    quiz.shuffled = s;
  }
}
function useHint(quiz) {
  const q = quiz.current;
  if (quiz.hints <= 0 || q.type !== 'choice' || quiz.removed.length || quiz.phase !== 'answering') return;
  const wrong = shuffle(q.options.map((_, i) => i).filter((i) => i !== q.answer));
  quiz.removed = wrong.slice(0, Math.min(2, q.options.length - 2));
  quiz.hints--;

  switch (quiz.mode) {

      if (quiz.hearts === 0) return { kind: 'stageFailed' };
      if (!quiz.queue.length) return { kind: 'stageCleared', stars: Math.max(1, 3 - (quiz.maxHearts - quiz.hearts)) };
      break;
    case 'boss':
      if (quiz.bossHP === 0) return { kind: 'bossDefeated' };
      if (quiz.playerHP === 0) return { kind: 'bossLost' };
      break;
    case 'daily': if (!quiz.queue.length) return { kind: 'dailyDone' }; break;
    case 'review': if (!quiz.queue.length) return { kind: 'reviewDone' }; break;

function submit(quiz, answer) {
  if (quiz.phase !== 'answering') return;
  const q = quiz.current, ok = isCorrect(q, answer), now = new Date(), st = quiz.stats;
  const fb = { answer, ok, xp: 0, gold: 0, critical: false, dmg: 0, shielded: false, taken: 0 };
  quiz.answered++;
  if (ok) {
    quiz.correct++;
    quiz.combo++;
    quiz.maxCombo = Math.max(quiz.maxCombo, quiz.combo);

    fb.xp = Math.round(baseXP * (1 + st.xp / 100));
    const baseGold = quiz.mode === 'time' ? 5 : quiz.mode === 'daily' ? 20 : 10;
    fb.gold = Math.round(baseGold * (1 + st.gold / 100));
    S.gold += fb.gold;
    quiz.gold += fb.gold;
    bumpMission('correct');

      fb.critical = Math.random() * 100 < st.crit;
      const mult = 1 + Math.min(quiz.combo - 1, 10) * 0.1;

      quiz.bossHP = Math.max(0, quiz.bossHP - fb.dmg);
    }
  } else {
    quiz.wrong++;
    quiz.combo = 0;
    if (quiz.shields > 0) { quiz.shields--; fb.shielded = true; }
    else if (quiz.mode === 'stage') quiz.hearts = Math.max(0, quiz.hearts - 1);
    else if (quiz.mode === 'boss') {
      fb.taken = Math.round(quiz.bossAtk * (0.9 + Math.random() * 0.2));
      quiz.playerHP = Math.max(0, quiz.playerHP - fb.taken);
    }
    if (quiz.mode === 'stage') quiz.queue.push(q);
  }
  recordAnswer(q, ok, quiz.mode === 'review', now);
  recordCombo(quiz.maxCombo);
  if (fb.xp) { addXP(fb.xp, now); quiz.xp += fb.xp; }
  quiz.feedback = fb;
  quiz.phase = 'feedback';
  sfx(ok ? (fb.critical ? 'hit' : 'good') : 'bad');
  if (quiz.mode === 'time') {
    setTimeout(() => { if (ui.quiz === quiz && quiz.phase === 'feedback') { next(quiz); renderQuiz(); } }, 450);
  }
}
function next(quiz) {
  if (quiz.phase !== 'feedback') return;
  const outcome = pendingOutcome(quiz);
  if (outcome) return finish(quiz, outcome);
  if (!quiz.queue.length) quiz.queue = shuffle(quiz.pool);
  if (!quiz.queue.length) return finish(quiz, { kind: 'dailyDone' });
  present(quiz, quiz.queue.shift());
}
function finish(quiz, outcome) {
  if (quiz.phase === 'finished') return;
  stopTimer();
  const now = new Date(), st = quiz.stats, gm = 1 + st.gold / 100;
  let bonusXP = 0, first = false, record = false, chest = null;
  const notes = [], drops = [], loot = { gold: 0, gems: 0, tickets: 0 };
  switch (outcome.kind) {
    case 'stageCleared': {
      const r = completeStage(quiz.arg, outcome.stars);
      bonusXP += 20; notes.push('クリアボーナス +20 XP');
      if (r.first) { bonusXP += 20; notes.push('初クリアボーナス +20 XP'); first = true; loot.gems += 50; }
      if (outcome.stars === 3) { bonusXP += 20; notes.push('ノーミスボーナス +20 XP'); if (r.prev < 3) loot.gems += 30; }
      record = !r.first && outcome.stars > r.prev;
      loot.gold += Math.round((100 + 50 * outcome.stars) * gm);
      chest = rollChest(r.first || outcome.stars === 3 ? 1 : 0, st.luck);
      bumpMission('clears');
      break;
    }
    case 'stageFailed':
      loot.gold += Math.round(30 * gm);
      break;
    case 'bossDefeated': {
      first = defeatBoss(quiz.arg);
      S.bossLevels[quiz.arg] = Math.min(99, quiz.bossLv + 1);
      bonusXP += first ? 100 : 30;
      notes.push(first ? '初撃破ボーナス +100 XP' : '撃破ボーナス +30 XP');
      loot.gold += Math.round(400 * quiz.bossLv * gm);
      loot.gems += first ? 300 : 50;
      chest = rollChest(2, st.luck);
      const boost = 1 + st.luck / 100, roll = Math.random() * 100;
      const dropR = roll < 0.5 * boost ? 'UR' : roll < 5 * boost ? 'SSR' : roll < 25 * boost ? 'SR' : null;
      if (dropR) { const pool = ITEMS.filter((i) => i.rarity === dropR); drops.push({ rarity: dropR, ...grantItem(pool[Math.floor(Math.random() * pool.length)]) }); }
      bumpMission('boss');
      break;
    }
    case 'bossLost':
      loot.gold += Math.round(100 * quiz.bossLv * gm);
      bumpMission('boss');
      break;
    case 'dailyDone':
      if (completeDaily(now)) { bonusXP += 30; notes.push('本日のデイリー達成 +30 XP'); loot.gems += 100; chest = rollChest(1, st.luck); }
      break;
    case 'reviewDone':
      bonusXP += 10; notes.push('復習完了ボーナス +10 XP');
      loot.gold += Math.round(200 * gm);
      break;
    case 'timeUp':
      if (recordTimeAttack(outcome.score)) { record = true; bonusXP += 20; notes.push('自己ベスト更新 +20 XP'); loot.gems += 30; }
      break;
  }
  if (bonusXP) { addXP(bonusXP, now); quiz.xp += bonusXP; }
  const levelAfter = levelStatus(S.xp).level;
  if (levelAfter > quiz.levelBefore) loot.gems += 100 * (levelAfter - quiz.levelBefore);
  const badges = evaluateBadges(now);
  const badgeGems = 100 * badges.length;
  if (chest) S.chests++;
  applyLoot(loot);
  if (chest) applyLoot(chest);
  persist();
  quiz.summary = {
    outcome, xp: quiz.xp, correct: quiz.correct, answered: quiz.answered, maxCombo: quiz.maxCombo,
    levelBefore: quiz.levelBefore, levelAfter, badges, first, record, notes, chest, drops,
    gold: quiz.gold + loot.gold, gems: loot.gems + badgeGems, tickets: loot.tickets,
  };
  quiz.phase = 'finished';
  quiz.feedback = null;
  const success = !['stageFailed', 'bossLost'].includes(outcome.kind);
  if (success) { sfx('win'); confetti(); }
}

// time attack timer
let timer = 0;
function startTimer(quiz) {
  stopTimer();
  quiz.startedAt = performance.now();
  timer = setInterval(() => {
    if (ui.quiz !== quiz || quiz.phase === 'finished') return stopTimer();
    quiz.remaining = Math.max(0, quiz.timeLimit - (performance.now() - quiz.startedAt) / 1000);
    const bar = $('#ta-bar'), sec = $('#ta-sec');
    if (bar) { bar.style.width = `${(quiz.remaining / quiz.timeLimit) * 100}%`; bar.parentElement.style.setProperty('--c', quiz.remaining < 10 ? 'var(--bad)' : themeVar(quiz.theme)); }
    if (sec) { sec.textContent = `${Math.ceil(quiz.remaining)}秒`; sec.classList.toggle('warn', quiz.remaining < 10); }
    if (quiz.remaining <= 0) { finish(quiz, { kind: 'timeUp', score: quiz.correct }); renderQuiz(); }
  }, 100);
}
function stopTimer() { clearInterval(timer); timer = 0; }

function collectionGrid() {
  const q = ui.query.trim().toLowerCase();
  const out = [];
  for (const s of SUBJECTS) {
    const cards = s.stages.flatMap((st) => st.cards).filter((c) => !q || (cardUnlocked(c) && (c.title + c.body).toLowerCase().includes(q)));
    if (!cards.length) continue;
    const all = s.stages.flatMap((st) => st.cards);
    out.push(`
    <section style="display:grid;gap:10px;--c:${themeVar(s.theme)}">
      <div class="subject-row">${icon(s.icon)}${esc(s.title)}<small class="num">${all.filter(cardUnlocked).length}/${all.length}</small></div>
      <div class="cards">${cards.map((c) => cardUnlocked(c)
        ? `<button class="lcard" data-act="card" data-id="${c.id}"><b>${esc(c.title)}</b><small>${esc(c.body)}</small></button>`
        : `<button class="lcard locked" disabled aria-label="未登録のカード">${icon('lock')}<b>？？？</b></button>`).join('')}</div>
    </section>`);
  }
  return out.join('') || '<p class="note" style="text-align:center">見つかりませんでした</p>';
}
