<title>診断士クエスト</title>

<style>
:root {
  --paper: #F4F3FA;
  --surface: #FFFFFF;
  --surface-2: #ECEAF6;
  --ink: #1D1B33;
  --muted: #6B6887;
  --faint: #A9A6C2;
  --line: #E2E0EE;
  --track: #E6E4F0;
  --accent: #5B4BDB;
  --gold: #F5B301;
  --good: #22A35A;
  --good-soft: #E2F4E9;
  --bad: #E5484D;
  --bad-soft: #FCE7E8;
  --flame: #FF7A1A;
  --heart: #F2445B;
  --shadow: 0 1px 2px rgba(29, 27, 51, .06), 0 8px 22px rgba(29, 27, 51, .07);
  --w-orange: #F7852B;
  --w-green: #23A862;
  --w-blue: #3478F0;
  --w-teal: #0F9CA4;
  --w-purple: #9356E4;
  --w-indigo: #5553D8;
  --w-pink: #E9477A;
  --w-gold: #F2A516;
  --r-n: #8E94A6;
  --r-r: #3E8EF0;
  --r-sr: #A45BF0;
  --r-ssr: #EFA300;
  --r-ur: #FF4F9A;
  --rainbow: linear-gradient(135deg, #FF5F6D, #FFC371, #47E5BC, #5B8CFF, #C86DD7);
  --night: #160F33;
  --display: "Dela Gothic One", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #13122A;
    --surface: #1E1C38;
    --surface-2: #282647;
    --ink: #F1F0FA;
    --muted: #A3A0C2;
    --faint: #6E6B8E;
    --line: #302D52;
    --track: #2F2C50;
    --accent: #8C7BFF;
    --good-soft: #163726;
    --bad-soft: #43191C;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #13122A;
  --surface: #1E1C38;
  --surface-2: #282647;
  --ink: #F1F0FA;
  --muted: #A3A0C2;
  --faint: #6E6B8E;
  --line: #302D52;
  --track: #2F2C50;
  --accent: #8C7BFF;
  --good-soft: #163726;
  --bad-soft: #43191C;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body {
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-appearance: none; appearance: none; }
button:disabled { cursor: default; opacity: 1; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.ic { width: 1em; height: 1em; flex: none; display: inline-block; vertical-align: -0.14em; }

/* ---------- app shell ---------- */
#app { max-width: 560px; margin: 0 auto; min-height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 8px;
  height: 52px; padding-inline: 16px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.topbar h1 { font-size: 17px; font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .wordmark { font-family: var(--display); font-weight: 400; font-size: 17px; letter-spacing: .02em; }
.back { display: grid; place-items: center; width: 36px; height: 36px; margin-left: -8px; border-radius: 12px; font-size: 22px; color: var(--accent); flex: none; }
.wallet { display: flex; gap: 5px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 2px; height: 28px; padding: 0 8px; border-radius: 99px; background: var(--surface); box-shadow: var(--shadow); font-weight: 800; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
main#view { padding-inline: 16px; padding-block: 4px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
}
.tabbar .inner { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 560px; height: var(--tabbar-h); }
.tab { display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--faint); position: relative; }
.tab .ic { font-size: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab .count { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }
.tab .dot { position: absolute; top: 9px; left: calc(50% + 9px); width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }

/* ---------- shared pieces ---------- */
.card { background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.section-head { display: grid; gap: 2px; margin-top: 6px; }
.section-head h2 { font-size: 19px; font-weight: 800; }
.section-head p { font-size: 13px; color: var(--muted); }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.bar { display: block; position: relative; height: 12px; border-radius: 99px; background: var(--track); overflow: hidden; flex: 1; }
.bar > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--c, var(--good)); transition: width .45s cubic-bezier(.3, 1.3, .5, 1); }
.bar > i::after { content: ""; position: absolute; left: 6px; right: 6px; top: 18%; height: 28%; border-radius: 9px; background: rgba(255, 255, 255, .35); }
.bar.thin { height: 8px; }
.stars { display: inline-flex; gap: 2px; color: var(--track); }
.stars .on { color: var(--gold); }
.hearts { display: inline-flex; gap: 3px; font-size: 20px; align-items: center; }
.hearts .ic { color: var(--heart); transition: transform .25s; }
.hearts .off { color: var(--track); transform: scale(.85); }
.hearts .shield { color: var(--w-blue); font-size: 18px; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 800; color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 14%, transparent); }
.btn {
  --c: var(--accent);
  position: relative; display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 54px; padding: 10px 18px; border-radius: 16px;
  background: var(--c); color: #fff; font-weight: 800; font-size: 16px;
  box-shadow: 0 5px 0 color-mix(in srgb, var(--c) 68%, #000);
  transform: translateY(0); transition: transform .08s, box-shadow .08s;
  margin-bottom: 5px;
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 68%, #000); }
.btn.ghost { background: var(--surface); color: var(--c); box-shadow: 0 5px 0 var(--line), inset 0 0 0 2px var(--line); }
.btn.ghost:active:not(:disabled) { box-shadow: 0 1px 0 var(--line), inset 0 0 0 2px var(--line); }
.btn:disabled { --c: var(--faint); }
.btn.small { min-height: 42px; font-size: 14px; border-radius: 13px; padding: 6px 12px; }
.btn small { display: block; font-size: 11px; font-weight: 700; opacity: .9; }
.btn.stack { flex-direction: column; gap: 0; line-height: 1.3; }
.linkbtn { display: block; width: 100%; padding: 10px; text-align: center; font-weight: 800; color: var(--c, var(--muted)); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); display: grid; gap: 2px; min-width: 0; }
.tile .k { font-size: 12px; font-weight: 800; color: var(--c, var(--muted)); display: flex; align-items: center; gap: 5px; }
.tile .v { font-family: var(--display); font-size: 22px; line-height: 1.3; font-variant-numeric: tabular-nums; }
.formula { white-space: pre-line; font-weight: 700; font-size: 14px; line-height: 1.75; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--c) 12%, transparent); border-left: 4px solid var(--c); }
.card h3 { font-size: 15px; font-weight: 800; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

/* ---------- home ---------- */
.player { display: grid; gap: 14px; }
.player .row { display: flex; align-items: center; gap: 14px; }
.lv { width: 58px; height: 58px; border-radius: 50%; display: grid; place-content: center; text-align: center; color: #fff; background: radial-gradient(circle at 30% 25%, #7F72F0, var(--w-indigo) 70%); flex: none; }
.lv small { font-size: 10px; font-weight: 800; line-height: 1; }
.lv b { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1; }
.player .who { flex: 1; min-width: 0; display: grid; gap: 6px; }
.player .who h2 { font-size: 17px; font-weight: 800; }
.player .who p { font-size: 12px; color: var(--muted); }
.player .stats { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.player .divider { width: 1px; height: 36px; background: var(--line); }
.stat-inline { display: flex; align-items: center; gap: 8px; min-width: 0; }
.stat-inline b { font-family: var(--display); font-weight: 400; font-size: 19px; line-height: 1.2; display: block; }
.stat-inline small { font-size: 11px; color: var(--muted); display: block; white-space: nowrap; }
.flame { font-size: 28px; color: var(--flame); }
.flame.off { color: var(--track); }
.ring { width: 38px; height: 38px; flex: none; }
.ring circle { fill: none; stroke-width: 5; }
.ring .t { stroke: var(--track); }
.ring .p { stroke: var(--c, var(--good)); stroke-linecap: round; transition: stroke-dashoffset .6s; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode { --c: var(--w-gold); display: grid; align-content: space-between; gap: 18px; min-height: 108px; padding: 14px; border-radius: 20px; color: #fff; text-align: left; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 82%, #fff), var(--c)); box-shadow: 0 5px 0 color-mix(in srgb, var(--c) 68%, #000); margin-bottom: 5px; transition: transform .08s, box-shadow .08s; }
.mode:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 68%, #000); }
.mode .ic { font-size: 26px; }
.mode b { display: block; font-weight: 800; font-size: 16px; }
.mode small { font-size: 12px; font-weight: 700; opacity: .92; }
.missions { display: grid; gap: 12px; }
.mission { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; }
.mission .t { font-weight: 800; font-size: 14px; }
.mission .r { font-size: 12px; font-weight: 800; color: var(--muted); }
.mission .bar { grid-column: 1; }
.mission .act { grid-row: 1 / span 3; grid-column: 2; }
.claim { min-width: 84px; height: 36px; padding: 0 12px; border-radius: 12px; font-weight: 800; font-size: 13px; background: var(--surface-2); color: var(--faint); }
.claim.ready { background: var(--bad); color: #fff; box-shadow: 0 3px 0 #A5262B; animation: nudge 1.4s ease-in-out infinite; }
.claim.done { background: transparent; color: var(--good); }
@keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.world { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); transition: transform .1s; }
.world:active { transform: scale(.985); }
.world .icon { position: relative; width: 60px; height: 60px; border-radius: 17px; display: grid; place-items: center; font-size: 28px; color: #fff; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 78%, #fff), var(--c)); flex: none; }
.world .crown { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--gold); font-size: 15px; box-shadow: var(--shadow); }
.world .meta { flex: 1; min-width: 0; display: grid; gap: 4px; }
.world .eyebrow { color: var(--c); }
.world .h3 { display: block; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.world .foot { display: flex; gap: 10px; font-size: 12px; font-weight: 700; color: var(--muted); }
.world .foot .gold { color: var(--gold); display: inline-flex; align-items: center; gap: 3px; }
.chev { color: var(--faint); font-size: 16px; }

/* ---------- world map ---------- */
.banner { display: grid; gap: 4px; padding: 18px; border-radius: 22px; color: #fff; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 80%, #fff), var(--c) 60%, color-mix(in srgb, var(--c) 82%, #000)); }
.banner h2 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.25; }
.banner .eyebrow { display: flex; align-items: center; gap: 6px; opacity: .92; }
.banner .facts { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 6px; font-size: 13px; font-weight: 800; }
.banner .facts span { display: inline-flex; align-items: center; gap: 4px; }
.map { position: relative; }
.map svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.map .trail path { fill: none; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 0 17; vector-effect: non-scaling-stroke; }
.node { position: absolute; width: 140px; margin-left: -70px; display: grid; justify-items: center; gap: 6px; }
.node .disc { position: relative; width: 90px; height: 90px; display: grid; place-items: center; }
.node .disc > .dot { position: relative; width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 28px; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 78%, #fff), var(--c)); box-shadow: 0 5px 0 color-mix(in srgb, var(--c) 68%, #000); }
.node.locked .disc > .dot { background: var(--surface-2); color: var(--faint); box-shadow: 0 5px 0 var(--line); font-size: 22px; }
.node.next .disc::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 6px solid color-mix(in srgb, var(--c) 35%, transparent); animation: pulse 1.2s ease-in-out infinite alternate; }
.node .start { position: absolute; top: -10px; z-index: 1; padding: 1px 9px; border-radius: 99px; background: var(--surface); color: var(--c); font-size: 11px; font-weight: 800; letter-spacing: .06em; box-shadow: var(--shadow); }
.node .label { display: grid; justify-items: center; gap: 2px; padding: 3px 8px; border-radius: 8px; background: color-mix(in srgb, var(--paper) 92%, transparent); font-size: 12px; font-weight: 800; text-align: center; line-height: 1.35; }
.node.locked .label { color: var(--muted); }
.node .stars { font-size: 12px; }
.node.boss .disc { width: 104px; height: 104px; }
.node.boss .disc > .dot { width: 92px; height: 92px; font-size: 46px; font-family: var(--body); background: linear-gradient(180deg, #3F1D5B, #8A1C33); box-shadow: 0 6px 0 #4A0F1E; }
.node.boss.locked .disc > .dot { background: var(--surface-2); box-shadow: 0 6px 0 var(--line); filter: grayscale(1); }
.node.boss .crown { position: absolute; top: 0; right: 4px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--gold); box-shadow: var(--shadow); }
.node .boss-tag { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--bad); }
@keyframes pulse { from { transform: scale(.94); } to { transform: scale(1.08); } }

/* ---------- stage / lesson / boss ---------- */
.stage-head { display: grid; gap: 8px; }
.stage-head h2 { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.3; }
.stage-head p { color: var(--muted); }
.stage-head .stars { font-size: 22px; }
.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 10px; align-items: baseline; font-weight: 700; font-size: 14px; }
.list li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; transform: translateY(-2px); }
.rules { display: grid; gap: 8px; }
.rules div { display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
.rules .ic { color: var(--c); }
.pager { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -16px; }
.pager::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; scroll-snap-align: center; padding-inline: 16px; }
.page .card { display: grid; gap: 14px; padding: 22px 20px; border-radius: 24px; min-height: 360px; align-content: start; }
.page h2 { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.35; }
.page .body { font-size: 16px; line-height: 1.9; }
.page.finish .card { justify-items: center; text-align: center; align-content: center; }
.page.finish .big { font-size: 64px; color: var(--good); }
.pager-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pager-nav button { width: 48px; height: 44px; display: grid; place-items: center; border-radius: 14px; color: var(--c); font-size: 20px; }
.pager-nav button:disabled { color: var(--track); }
.dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.dots i { width: 7px; height: 7px; border-radius: 4px; background: var(--track); transition: width .25s, background .25s; }
.dots i.on { width: 18px; background: var(--c); }
.boss-hero { display: grid; justify-items: center; gap: 8px; text-align: center; padding-block: 24px; }
.boss-hero .face { font-size: 92px; line-height: 1.1; animation: float 2.6s ease-in-out infinite alternate; }
.boss-hero h2 { font-family: var(--display); font-weight: 400; font-size: 28px; }
.boss-hero q { color: var(--muted); font-weight: 700; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; text-align: center; }
.vs .side { display: grid; gap: 4px; }
.vs .side b { font-family: var(--display); font-weight: 400; font-size: 18px; }
.vs .side small { font-size: 12px; color: var(--muted); font-weight: 700; }
.vs .x { font-family: var(--display); color: var(--bad); }
@keyframes float { from { transform: translateY(-6px); } to { transform: translateY(6px); } }

/* ---------- items ---------- */
.item {
  --rc: var(--r-n);
  position: relative; aspect-ratio: 1; width: 100%; border-radius: 16px; display: grid; place-items: center;
  font-size: 34px; line-height: 1;
  background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--rc) 26%, var(--surface)), var(--surface) 78%);
  border: 2.5px solid var(--rc);
}
.item[data-r="R"] { --rc: var(--r-r); }
.item[data-r="SR"] { --rc: var(--r-sr); }
.item[data-r="SSR"] { --rc: var(--r-ssr); box-shadow: 0 0 12px color-mix(in srgb, var(--r-ssr) 45%, transparent); }
.item[data-r="UR"] { --rc: var(--r-ur); border-color: transparent; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--r-ur) 22%, var(--surface)), var(--surface) 78%) padding-box, var(--rainbow) border-box; box-shadow: 0 0 16px color-mix(in srgb, var(--r-ur) 45%, transparent); }
.item .rar { position: absolute; top: 4px; left: 6px; font-family: var(--display); font-size: 10px; color: var(--rc); }
.item .lvl { position: absolute; bottom: 4px; right: 6px; font-size: 10px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.item .lb { position: absolute; bottom: 6px; left: 6px; display: flex; gap: 1px; }
.item .lb i { width: 4px; height: 4px; border-radius: 50%; background: var(--track); }
.item .lb i.on { background: var(--rc); }
.item .new { position: absolute; top: -7px; right: -7px; padding: 1px 6px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 9.5px; font-weight: 800; }
.item .eq { position: absolute; top: 4px; right: 5px; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 10px; font-weight: 800; }
.item.unknown { --rc: var(--line); background: var(--surface-2); color: var(--faint); font-size: 22px; }
.item.unknown .rar { color: var(--faint); }
.inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 12px 10px; }
.inv button { display: grid; gap: 4px; }
.inv .name { font-size: 10.5px; font-weight: 700; line-height: 1.3; text-align: center; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.power { display: grid; gap: 12px; }
.power .big { display: flex; align-items: baseline; gap: 8px; }
.power .big b { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; }
.power .big span { font-weight: 800; color: var(--muted); font-size: 13px; }
.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.statgrid div { display: grid; gap: 0; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); }
.statgrid small { font-size: 10.5px; color: var(--muted); font-weight: 800; }
.statgrid b { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.slot-btn { display: grid; gap: 4px; justify-items: stretch; text-align: center; }
.slot-btn .label { font-size: 11px; font-weight: 800; color: var(--muted); }
.slot-btn .empty { aspect-ratio: 1; border-radius: 16px; border: 2.5px dashed var(--line); display: grid; place-items: center; color: var(--faint); font-size: 22px; }
.filters { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; height: 34px; padding: 0 14px; border-radius: 99px; background: var(--surface); box-shadow: var(--shadow); font-weight: 800; font-size: 13px; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.detail-head { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.detail-head .item { font-size: 48px; }
.detail-head h2 { font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.35; }
.detail-head .sub { font-size: 12px; font-weight: 800; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.rtag { font-family: var(--display); font-size: 12px; padding: 1px 8px; border-radius: 6px; color: #fff; background: var(--rc); }
.rtag[data-r="N"] { --rc: var(--r-n); }
.rtag[data-r="R"] { --rc: var(--r-r); }
.rtag[data-r="SR"] { --rc: var(--r-sr); }
.rtag[data-r="SSR"] { --rc: var(--r-ssr); }
.rtag[data-r="UR"] { background: var(--rainbow); }
.flavor { font-size: 13px; color: var(--muted); font-style: italic; }
.statrows { display: grid; gap: 6px; }
.statrows div { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.statrows .up { color: var(--good); }
.lbpips { display: inline-flex; gap: 3px; vertical-align: middle; }
.lbpips i { width: 10px; height: 10px; border-radius: 3px; background: var(--track); transform: rotate(45deg); }
.lbpips i.on { background: var(--gold); }
.enh-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.boom { text-align: center; font-family: var(--display); font-size: 22px; color: var(--flame); animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); }

/* ---------- gacha ---------- */
.altar {
  position: relative; overflow: hidden; border-radius: 24px; padding: 20px 18px; color: #fff; display: grid; gap: 14px;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 78% 12%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 58%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 22% 72%, #fff 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 55% 30%, #fff 50%, transparent 51%),
    radial-gradient(120% 90% at 50% 0%, #5438C9 0%, #2A1B6E 45%, var(--night) 100%);
}
.altar .eyebrow { color: #FFD66B; }
.altar h2 { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1.3; }
.pickup { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; padding: 12px; border-radius: 18px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14); }
.pickup .item { font-size: 42px; }
.pickup b { display: block; font-size: 16px; }
.pickup small { font-size: 12px; opacity: .85; }
.pity { display: grid; gap: 6px; font-size: 13px; font-weight: 800; }
.pity .bar { background: rgba(255, 255, 255, .18); }
.summon-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.summon-btns .wide { grid-column: 1 / -1; }
.sbtn { --c: #7B5CFF; display: grid; justify-items: center; gap: 1px; padding: 10px 8px; border-radius: 16px; color: #fff; background: linear-gradient(160deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c)); box-shadow: 0 5px 0 color-mix(in srgb, var(--c) 60%, #000); font-weight: 800; margin-bottom: 5px; transition: transform .08s, box-shadow .08s; }
.sbtn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 60%, #000); }
.sbtn b { font-size: 16px; }
.sbtn small { font-size: 12px; opacity: .92; }
.sbtn.gold { --c: #F29B00; }
.sbtn:disabled { --c: #5B5680; opacity: .7; }
.rates { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; }
.rates div { padding: 8px 4px; border-radius: 12px; background: var(--surface-2); display: grid; }
.rates b { font-family: var(--display); font-size: 13px; }
.rates small { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.summon { position: fixed; inset: 0; z-index: 80; overflow-y: auto; color: #fff; display: grid; gap: 16px; grid-template-rows: 1fr auto; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px); background: radial-gradient(circle at 50% 40%, #2E1F78, #0A0720 72%); }
.summon .stage { display: grid; place-items: center; align-content: center; gap: 22px; }
.orb-wrap { position: relative; width: 170px; height: 170px; animation: shake 0.35s ease-in-out infinite; }
.orb { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #fff 0%, var(--oc) 38%, color-mix(in srgb, var(--oc) 40%, transparent) 66%, transparent 72%); box-shadow: 0 0 70px 24px color-mix(in srgb, var(--oc) 70%, transparent); }
.orb.after { opacity: 0; animation: promote .5s 1.15s forwards; }
.orb.rainbow { background: radial-gradient(circle at 36% 30%, #fff 0%, transparent 40%), conic-gradient(#FF5F6D, #FFC371, #47E5BC, #5B8CFF, #C86DD7, #FF5F6D); box-shadow: 0 0 80px 30px rgba(255, 180, 220, .7); }
.summon .msg { font-family: var(--display); font-size: 20px; letter-spacing: .1em; }
.summon .hint { font-size: 12px; opacity: .7; }
@keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-2px, 1px); } 75% { transform: translate(2px, -1px); } }
@keyframes promote { from { opacity: 0; transform: scale(.7); } 60% { transform: scale(1.25); } to { opacity: 1; transform: scale(1); } }
.pulls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px 8px; width: 100%; max-width: 520px; }
.pulls.one { grid-template-columns: minmax(0, 180px); justify-content: center; }
.pull { display: grid; gap: 4px; justify-items: center; animation: flipin .5s cubic-bezier(.3, 1.4, .5, 1) backwards; animation-delay: var(--d); }
.pull .item { font-size: 30px; }
.pulls.one .item { font-size: 76px; }
.pull .item[data-r="SSR"], .pull .item[data-r="UR"] { animation: glow 1.4s ease-in-out infinite alternate; }
.pull .name { font-size: 10px; font-weight: 700; text-align: center; line-height: 1.3; opacity: .92; }
.pulls.one .name { font-size: 16px; }
.pull .note { font-size: 10px; font-weight: 800; color: #FFD66B; }
.pull .note.new { color: #FF7C9C; }
@keyframes flipin { from { transform: rotateY(90deg) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes glow { from { filter: drop-shadow(0 0 4px var(--rc)); } to { filter: drop-shadow(0 0 16px var(--rc)); } }
.summon .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 520px; justify-self: center; }

/* ---------- quiz ---------- */
.quiz { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: flex; justify-content: center; padding-top: env(safe-area-inset-top, 0px); }
.quiz .frame { width: 100%; max-width: 560px; height: 100%; display: flex; flex-direction: column; position: relative; }
.q-top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; color: var(--muted); font-size: 20px; flex: none; }
.boss-title { flex: 1; text-align: center; font-family: var(--display); color: var(--bad); letter-spacing: .06em; }
.ta-sec { font-family: var(--display); font-size: 16px; width: 48px; text-align: right; }
.ta-sec.warn { color: var(--bad); }
.ta-score { display: inline-flex; align-items: center; gap: 4px; font-family: var(--display); color: var(--good); }
.battle { margin: 0 16px 6px; display: grid; gap: 8px; }
.boss-card { display: flex; align-items: center; gap: 14px; background: var(--surface); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); position: relative; }
.boss-card .face { font-size: 48px; line-height: 1; }
.boss-card .face.hit { animation: hit .35s; }
.boss-card .meta, .me-card .meta { flex: 1; display: grid; gap: 5px; }
.boss-card .meta div, .me-card .meta div { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; }
.hp { font-size: 12px; font-variant-numeric: tabular-nums; }
.boss-card .hp { color: var(--bad); }
.me-card { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); position: relative; }
.me-card .me { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--w-indigo); color: #fff; font-family: var(--display); font-size: 12px; }
.me-card .hp { color: var(--good); }
.me-card.hurt { animation: hurt .4s; }
.me-card .shields { display: inline-flex; gap: 2px; color: var(--w-blue); }
@keyframes hurt { 0%, 100% { transform: translateX(0); background: var(--surface); } 30% { transform: translateX(-6px); background: var(--bad-soft); } 60% { transform: translateX(5px); } }
.dmg { position: absolute; left: 34px; top: 4px; z-index: 2; font-family: var(--display); font-size: 26px; color: #fff; -webkit-text-stroke: 1.5px #C0282D; paint-order: stroke fill; text-shadow: 0 2px 0 rgba(0, 0, 0, .25); pointer-events: none; animation: dmg 1s forwards; }
.dmg.crit { font-size: 32px; color: #FFE36B; -webkit-text-stroke-color: #B35C00; }
.dmg.taken { left: auto; right: 16px; font-size: 20px; color: #fff; -webkit-text-stroke-color: #7A1D24; }
@keyframes dmg { 0% { transform: translateY(12px) scale(.6); opacity: 0; } 18% { transform: translateY(-4px) scale(1.18); opacity: 1; } 70% { opacity: 1; } 100% { transform: translateY(-26px); opacity: 0; } }
.crit { position: absolute; top: -12px; right: 10px; padding: 3px 11px; border-radius: 99px; background: var(--flame); color: #fff; font-family: var(--display); font-size: 13px; transform: rotate(-6deg); animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes hit { 0%, 100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-14px) rotate(-7deg); } 40% { transform: translateX(12px) rotate(6deg); } 60% { transform: translateX(-8px) rotate(-4deg); } 80% { transform: translateX(5px) rotate(2deg); } }
@keyframes pop { from { transform: scale(.3) rotate(-6deg); opacity: 0; } to { transform: scale(1) rotate(-6deg); opacity: 1; } }
.q-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.q-body { display: grid; gap: 18px; padding: 12px 20px 32px; }
.q-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.combo { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-family: var(--display); font-size: 14px; color: var(--flame); animation: pop2 .3s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop2 { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.prompt { font-size: 19px; font-weight: 800; line-height: 1.7; }
.hintbtn { justify-self: start; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 99px; background: color-mix(in srgb, var(--gold) 18%, var(--surface)); color: var(--ink); font-weight: 800; font-size: 13px; box-shadow: var(--shadow); }
.hintbtn .ic { color: var(--gold); }
.choices { display: grid; gap: 12px; }
.choice { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 14px; border-radius: 16px; background: var(--surface); border: 2px solid var(--line); font-weight: 700; font-size: 16px; line-height: 1.5; transition: transform .1s, border-color .2s, background .2s; }
.choice:active:not(:disabled) { transform: scale(.98); }
.choice .key { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--line); font-family: var(--display); font-size: 14px; color: var(--muted); }
.choice .txt { flex: 1; }
.choice .mark { font-size: 22px; }
.choice.good { border-color: var(--good); background: var(--good-soft); }
.choice.good .key { border-color: var(--good); color: var(--good); }
.choice.good .mark { color: var(--good); }
.choice.bad { border-color: var(--bad); background: var(--bad-soft); }
.choice.bad .key { border-color: var(--bad); color: var(--bad); }
.choice.bad .mark { color: var(--bad); }
.choice.dim, .choice.gone { color: var(--muted); border-color: var(--surface-2); }
.choice.dim .key, .choice.gone .key { color: var(--faint); border-color: var(--surface-2); }
.choice.gone { opacity: .45; text-decoration: line-through; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tf button { position: relative; display: grid; justify-items: center; gap: 8px; padding: 26px 8px 20px; border-radius: 20px; background: var(--surface); border: 2px solid color-mix(in srgb, var(--c) 35%, transparent); font-weight: 800; font-size: 17px; transition: transform .1s; }
.tf button:active:not(:disabled) { transform: scale(.97); }
.tf .sym { font-size: 48px; color: var(--c); }
.tf .good { border: 3px solid var(--good); background: var(--good-soft); }
.tf .bad { border: 3px solid var(--bad); background: var(--bad-soft); }
.tf .dim { border-color: var(--surface-2); color: var(--muted); }
.tf .dim .sym { color: var(--track); }
.tf .mark { position: absolute; top: 8px; right: 8px; font-size: 22px; }
.tf .good .mark { color: var(--good); }
.tf .bad .mark { color: var(--bad); }
.order-label { font-size: 12px; font-weight: 800; color: var(--muted); }
.slots-o, .pool { display: grid; gap: 8px; }
.slot { display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 10px 12px; border-radius: 14px; border: 2px dashed var(--line); text-align: left; font-weight: 700; width: 100%; }
.slot .n { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--track); color: #fff; font-family: var(--display); font-size: 13px; }
.slot.filled { border-style: solid; background: var(--surface); }
.slot.filled .n { background: var(--accent); }
.slot.good { border-color: var(--good); background: var(--good-soft); }
.slot.good .n { background: var(--good); }
.slot.bad { border-color: var(--bad); background: var(--bad-soft); }
.slot.bad .n { background: var(--bad); }
.token { width: 100%; text-align: left; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 2px solid var(--line); font-weight: 700; transition: transform .1s; }
.token:active { transform: scale(.98); }
.order-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.order-actions .btn { min-height: 48px; }
.feedback { padding: 18px 20px calc(14px + env(safe-area-inset-bottom, 0px)); border-radius: 26px 26px 0 0; background: var(--fb-bg); box-shadow: 0 -10px 30px rgba(0, 0, 0, .12); display: grid; gap: 10px; animation: slideup .28s cubic-bezier(.2, .9, .3, 1); }
.feedback.good { --fb-bg: var(--good-soft); --c: var(--good); }
.feedback.bad { --fb-bg: var(--bad-soft); --c: var(--bad); }
.feedback .head { display: flex; align-items: center; gap: 12px; color: var(--c); }
.feedback .head .ic { font-size: 34px; }
.feedback .head b { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.2; }
.feedback .head small { font-size: 13px; font-weight: 800; }
.feedback .answer { font-weight: 800; }
.feedback .answer small { display: block; font-size: 12px; color: var(--c); }
.feedback .exp { font-size: 14px; line-height: 1.75; max-height: 30vh; overflow-y: auto; }
@keyframes slideup { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.flash { position: absolute; inset: 0; pointer-events: none; border: 10px solid var(--c); animation: flash .45s forwards; }
@keyframes flash { from { opacity: .9; } to { opacity: 0; } }
.confirm { position: absolute; inset: 0; z-index: 3; display: grid; align-items: end; background: rgba(10, 8, 30, .45); }
.confirm .panel { background: var(--surface); border-radius: 26px 26px 0 0; padding: 22px 20px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.confirm h3 { font-size: 18px; font-weight: 800; }
.confirm p { font-size: 14px; color: var(--muted); }

/* ---------- result ---------- */
.result { flex: 1; overflow-y: auto; }
.result .inner { display: grid; gap: 18px; padding: 26px 20px 24px; }
.result .hero { display: grid; justify-items: center; gap: 6px; text-align: center; }
.result .hero .emoji { font-size: 72px; line-height: 1.1; animation: pop2 .5s cubic-bezier(.3, 1.6, .5, 1); }
.result .hero h2 { font-family: var(--display); font-weight: 400; font-size: 27px; line-height: 1.3; }
.result .hero p { color: var(--muted); }
.big-stars { display: flex; justify-content: center; align-items: flex-end; gap: 14px; color: var(--track); }
.big-stars .ic { font-size: 50px; }
.big-stars .ic:nth-child(2) { font-size: 64px; transform: translateY(-10px); }
.big-stars .on { color: var(--gold); filter: drop-shadow(0 0 10px color-mix(in srgb, var(--gold) 60%, transparent)); animation: starpop .45s cubic-bezier(.3, 1.8, .5, 1) backwards; }
.big-stars .ic:nth-child(2).on { animation-name: starpop2; }
@keyframes starpop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes starpop2 { from { transform: translateY(-10px) scale(.2); opacity: 0; } to { transform: translateY(-10px) scale(1); opacity: 1; } }
.loot { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
.loot span { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 99px; background: var(--surface); box-shadow: var(--shadow); font-weight: 800; font-variant-numeric: tabular-nums; }
.chest { display: grid; justify-items: center; gap: 8px; padding: 16px; border-radius: 20px; text-align: center; background: var(--surface); box-shadow: var(--shadow); width: 100%; }
.chest .box { position: relative; width: 96px; height: 96px; display: grid; place-items: center; border-radius: 26px; font-size: 56px; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--cc) 40%, var(--surface)), var(--surface) 75%); border: 3px solid var(--cc); animation: wobble 1.1s ease-in-out infinite; }
.chest.rainbow .box { border-color: transparent; background: radial-gradient(circle at 50% 40%, #FFE9F4, var(--surface) 75%) padding-box, var(--rainbow) border-box; }
.chest.opened .box { animation: none; }
.chest b { font-family: var(--display); font-weight: 400; font-size: 18px; }
.chest small { font-size: 12px; color: var(--muted); font-weight: 700; }
.chest .contents { animation: pop2 .4s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(-8deg) scale(1.04); } 30% { transform: rotate(7deg); } 45% { transform: rotate(-4deg); } 60% { transform: rotate(0); } }
.notes { display: grid; gap: 4px; font-size: 14px; font-weight: 800; color: var(--gold); }
.notes div { display: flex; align-items: center; gap: 6px; }
.levelup { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; color: #fff; background: linear-gradient(135deg, #7F72F0, var(--w-indigo)); }
.levelup .ic { font-size: 38px; }
.levelup b { font-family: var(--display); font-weight: 400; font-size: 19px; display: block; }
.levelup small { font-weight: 700; font-size: 13px; opacity: .92; }
.badge-row { display: flex; align-items: center; gap: 12px; }
.badge-row b { display: block; font-size: 14px; }
.badge-row small { font-size: 12px; color: var(--muted); }
.drop-row { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.drop-row .item { font-size: 30px; }
.result .actions { padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 4px; }

/* ---------- review / collection / profile / save ---------- */
.hero-card { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 22px 18px; }
.hero-card .big { font-size: 50px; color: var(--c); }
.hero-card h2 { font-family: var(--display); font-weight: 400; font-size: 24px; }
.hero-card p { color: var(--muted); font-size: 14px; max-width: 34em; }
.note { font-size: 13px; color: var(--muted); }
.note b { color: var(--ink); display: flex; align-items: center; gap: 6px; font-size: 14px; margin-bottom: 4px; }
.weak { display: flex; gap: 12px; width: 100%; text-align: left; background: var(--surface); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); }
.weak .stripe { width: 5px; border-radius: 3px; background: var(--c); flex: none; }
.weak .meta { flex: 1; min-width: 0; display: grid; gap: 4px; }
.weak .src { font-size: 12px; font-weight: 800; color: var(--c); }
.weak .q { font-weight: 700; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.weak .cnt { display: flex; gap: 12px; font-size: 12px; font-weight: 800; }
.weak .cnt .x { color: var(--bad); }
.weak .cnt .o { color: var(--good); }
.search { display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 44px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); color: var(--muted); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; outline: none; }
.coll-head { display: grid; gap: 10px; }
.coll-head .count { display: flex; align-items: baseline; gap: 6px; }
.coll-head .count b { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; }
.coll-head .count span { color: var(--muted); font-weight: 700; }
.subject-row { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.subject-row .ic { color: var(--c); font-size: 18px; }
.subject-row small { margin-left: auto; color: var(--muted); font-weight: 700; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.lcard { display: grid; align-content: space-between; gap: 8px; min-height: 104px; padding: 12px; border-radius: 16px; text-align: left; color: #fff; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 80%, #fff), var(--c)); transition: transform .1s; }
.lcard:active:not(:disabled) { transform: scale(.97); }
.lcard b { font-weight: 800; font-size: 15px; line-height: 1.4; }
.lcard small { font-size: 11px; opacity: .92; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lcard.locked { background: var(--surface-2); color: var(--faint); }
.lvring { width: 86px; height: 86px; position: relative; flex: none; }
.lvring svg { width: 100%; height: 100%; }
.lvring circle { fill: none; stroke-width: 9; }
.lvring .t { stroke: var(--track); }
.lvring .p { stroke: var(--gold); stroke-linecap: round; }
.lvring div { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.lvring small { font-size: 11px; font-weight: 800; line-height: 1; }
.lvring b { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; }
.profile-head { display: flex; align-items: center; gap: 16px; }
.profile-head h2 { font-size: 19px; font-weight: 800; }
.profile-head p { font-size: 13px; color: var(--muted); }
.profile-head .xp { color: var(--gold); font-weight: 800; font-size: 14px; }
.menu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.menu-btn { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); font-weight: 800; text-align: left; }
.menu-btn .ic { font-size: 22px; color: var(--c); }
.menu-btn small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; gap: 8px; height: 150px; margin-top: 8px; }
.week div { display: grid; justify-items: center; align-content: end; gap: 5px; height: 100%; }
.week i { width: 100%; border-radius: 6px; background: var(--c, var(--track)); min-height: 6px; }
.week small { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.week .v { font-size: 10px; font-weight: 700; color: var(--muted); }
.week .today small { color: var(--ink); font-weight: 800; }
.mastery { display: grid; gap: 14px; }
.mastery .row { display: grid; gap: 6px; }
.mastery .top { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
.mastery .top .ic { color: var(--c); }
.mastery .top .gold { margin-left: auto; color: var(--gold); display: inline-flex; align-items: center; gap: 3px; font-size: 12px; }
.mastery .top small { width: 78px; text-align: right; color: var(--muted); font-size: 12px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 14px 8px; }
.badge { display: grid; justify-items: center; gap: 6px; text-align: center; font-size: 10.5px; font-weight: 800; line-height: 1.35; color: var(--muted); }
.badge.earned { color: var(--ink); }
.medal { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 23px; background: var(--surface-2); color: var(--faint); flex: none; }
.earned .medal, .medal.earned { background: linear-gradient(145deg, #FFD34D, var(--flame)); color: #fff; box-shadow: 0 3px 10px color-mix(in srgb, var(--flame) 35%, transparent), inset 0 0 0 3px rgba(255, 255, 255, .45); }
.settings { display: grid; gap: 16px; }
.settings .label { font-weight: 800; font-size: 14px; margin-bottom: 8px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); padding: 3px; border-radius: 12px; background: var(--surface-2); }
.seg button { height: 34px; border-radius: 9px; font-weight: 800; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.switch-row { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 14px; }
.switch { width: 52px; height: 32px; border-radius: 16px; background: var(--track); position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.sync { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; transform: translateY(-1px); }
.sync i.on { background: var(--good); }
.danger { display: inline-flex; align-items: center; gap: 6px; color: var(--bad); font-weight: 800; font-size: 14px; padding: 6px 0; }
.fineprint { font-size: 11.5px; color: var(--muted); text-align: center; padding-inline: 8px; }
.save-card { display: grid; gap: 12px; }
.save-card h3 { margin: 0; }
.save-card p { font-size: 13px; color: var(--muted); }
.codebox { width: 100%; min-height: 96px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); color: var(--ink); font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; resize: vertical; }
.codebox:focus { outline: none; border-color: var(--accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.filebtn { position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.facts-list { display: grid; gap: 6px; font-size: 14px; }
.facts-list div { display: flex; justify-content: space-between; gap: 12px; }
.facts-list span:first-child { color: var(--muted); font-weight: 700; }
.facts-list span:last-child { font-weight: 800; font-variant-numeric: tabular-nums; }

/* ---------- sheet & toast ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 70; display: grid; align-items: end; justify-items: center; background: rgba(10, 8, 30, .45); animation: fade .2s; }
.sheet { width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 26px 26px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; animation: slideup .25s cubic-bezier(.2, .9, .3, 1); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheet .bar-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet h2 { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.35; }
.sheet .body { font-size: 16px; line-height: 1.9; }
.sheet .opt { display: flex; gap: 8px; align-items: baseline; font-size: 14px; color: var(--muted); }
.sheet .opt.ok { color: var(--good); font-weight: 800; }
.boxed { padding: 12px 14px; border-radius: 14px; background: var(--surface-2); display: grid; gap: 4px; }
.boxed small { font-size: 12px; font-weight: 800; color: var(--c, var(--good)); }
.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.calendar div { display: grid; justify-items: center; gap: 2px; padding: 8px 2px; border-radius: 12px; background: var(--surface-2); font-size: 10.5px; font-weight: 800; text-align: center; line-height: 1.3; }
.calendar div .e { font-size: 20px; }
.calendar .got { opacity: .45; }
.calendar .today { background: color-mix(in srgb, var(--gold) 25%, var(--surface)); outline: 2px solid var(--gold); animation: pop2 .4s; }
.pick-list { display: grid; gap: 8px; }
.pick { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 8px; border-radius: 14px; background: var(--surface-2); text-align: left; }
.pick .item { font-size: 26px; }
.pick b { display: block; font-size: 14px; }
.pick small { font-size: 12px; color: var(--muted); font-weight: 700; }
.pick.on { outline: 2px solid var(--accent); }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 95; transform: translateX(-50%); padding: 10px 18px; border-radius: 99px; background: var(--ink); color: var(--paper); font-weight: 800; font-size: 14px; box-shadow: var(--shadow); animation: toast 2.4s forwards; pointer-events: none; white-space: nowrap; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -6px); } }
@keyframes fade { from { opacity: 0; } }

canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 90; pointer-events: none; }

@media (max-width: 380px) {
  .chip { padding: 0 6px; font-size: 11px; }
  .topbar .wordmark { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .orb.after { opacity: 1; }
}

<script type="application/json" id="sq-content">[{"id":"econ","order":1,"title":"経済学・経済政策","shortTitle":"経済学","worldName":"景気の渓谷","symbol":"chart.line.uptrend.xyaxis","theme":"orange","boss":{"name":"デフレ大魔王","emoji":"👹","taunt":"物価も景気も、ぜんぶ下げてやろう…！"},"stages":[{"id":"econ-1","title":"GDPとGNI","summary":"国の経済の大きさをはかる、いちばん基本の指標を押さえよう。","cards":[{"title":"GDP（国内総生産）","body":"一定期間に「国内」で新たに生み出された付加価値の合計。景気を測る最も身近な指標で、その変化率を経済成長率という。","formula":"付加価値 ＝ 生産額 − 中間投入額（原材料など）"},{"title":"付加価値を積み上げる","body":"各生産段階の付加価値を足すとGDPになる。例：小麦300万円 → 小麦粉500万円 → パン1,000万円なら、300＋200＋500＝1,000万円。この額は最終消費（パンの販売額）と一致する。","formula":null},{"title":"GNI（国民総所得）","body":"一国の「国民」が一定期間に受け取った所得の合計。以前はGNP（国民総生産）と呼ばれていた。","formula":"GNI ＝ GDP ＋ 海外からの所得受取 − 海外への所得支払"},{"title":"GDPとGNIの違い","body":"海外駐在の日本人が得た所得は、日本のGNIに含むがGDPには含まない。日本で働く外国人の所得は、日本のGDPに含むがGNIには含まない。基準が「場所（国内）」か「人（国民）」かの違い。","formula":null}],"questions":[{"id":"econ-1-01","type":"choice","prompt":"GDP（国内総生産）の説明として最も適切なものはどれ？","options":["一定期間に国内で新たに生み出された付加価値の合計","一定期間に国民が受け取った所得の合計","一定期間に国内で取引されたすべての商品の販売額の合計","ある時点で国内に存在する資産の合計"],"answer":0,"explanation":"GDPは「国内」で「新たに生み出された付加価値」の合計。販売額をそのまま足すと原材料が二重に数えられてしまう。国民が受け取った所得の合計はGNI、資産の合計はある時点のストックの考え方。"},{"id":"econ-1-02","type":"choice","prompt":"農家が小麦200万円を生産して製粉業者に販売、製粉業者は小麦粉を350万円でパン屋に販売、パン屋はパンを800万円で消費者に販売した。この経済のGDPは？","options":["800万円","1,350万円","550万円","1,000万円"],"answer":0,"explanation":"付加価値は、農家200、製粉業者150（350−200）、パン屋450（800−350）で合計800万円。最終消費であるパンの販売額800万円とも一致する。"},{"id":"econ-1-03","type":"tf","prompt":"日本に住む外国人が日本国内で得た所得は、日本のGDPに含まれない。","answer":false,"explanation":"GDPは国内で生まれた付加価値なので、受け取るのが外国人でも含まれる。含まれないのは日本のGNIのほう。"},{"id":"econ-1-04","type":"tf","prompt":"海外に駐在する日本人ビジネスパーソンが現地で得た所得は、日本のGNIに含まれる。","answer":true,"explanation":"GNIは日本国民が受け取る所得の合計なので含まれる。ただし日本国内の生産ではないため、日本のGDPには含まれない。"},{"id":"econ-1-05","type":"choice","prompt":"GNIを求める式として正しいものは？","options":["GDP＋海外からの所得受取−海外への所得支払","GDP−海外からの所得受取＋海外への所得支払","GDP＋輸出−輸入","GDP−中間投入額"],"answer":0,"explanation":"国内の生産（GDP）に、国民が海外から受け取った所得を足し、海外（外国人）へ支払った所得を引く。この差額をまとめて「海外からの純所得受取」とも呼ぶ。"},{"id":"econ-1-06","type":"choice","prompt":"GDPの変化率を何と呼ぶ？","options":["経済成長率","物価上昇率","限界消費性向","実質利子率"],"answer":0,"explanation":"GDPの変化率が経済成長率。プラスなら景気が上向き、マイナスなら下向きと判断する材料になる。"},{"id":"econ-1-07","type":"tf","prompt":"GNIは、以前はGNP（国民総生産）という名称で呼ばれていた。","answer":true,"explanation":"そのとおり。現在はGNI（Gross National Income）という名称が使われている。"}]},{"id":"econ-2","title":"三面等価と帰属計算","summary":"GDPを「生産・分配・支出」の3つの面から見る考え方を学ぼう。","cards":[{"title":"分配面から見たGDP","body":"生み出された付加価値は、賃金（家計）・利潤（企業）・税（政府）として各経済主体に分配される。受け取る側から見れば所得なので「所得面から見たGDP」ともいう。","formula":"分配面のGDP ＝ 家計の収入 ＋ 企業の利潤 ＋ 政府の収入"},{"title":"支出面から見たGDP","body":"分配された所得は、消費・投資・政府支出として使われる。支出は需要でもあるので「需要面から見たGDP」ともいう。海外との取引を考えるときは純輸出を加える。","formula":"支出面のGDP ＝ 消費 ＋ 投資 ＋ 政府支出 ＋（輸出 − 輸入）"},{"title":"三面等価の原則","body":"経済は「生産（つくる）→ 分配（受け取る）→ 支出（使う）」と循環している。同じ価値を3つの面から見ているので、3つのGDPは事後的に一致する。","formula":"生産 ＝ 分配 ＝ 支出（事後的に成立）"},{"title":"帰属計算","body":"実際には市場で取引されていなくても、取引があったとみなしてGDPに含める操作。代表例は「持ち家の帰属家賃」（自分に家賃を払っているとみなす）と「農家の自家消費」。","formula":null}],"questions":[{"id":"econ-2-01","type":"order","prompt":"経済の循環を、流れの順に並べよ。","items":["生産（つくる）","分配（受け取る）","支出（使う）"],"explanation":"生産で生まれた付加価値が所得として分配され、それが消費や投資として支出される。3つの面のGDPは事後的に一致する（三面等価の原則）。"},{"id":"econ-2-02","type":"choice","prompt":"三面等価の原則で、生産面・分配面・支出面のGDPはどのように一致する？","options":["事後的に一致する","事前（計画段階）に一致する","好況期にだけ一致する","長期的には一致しない"],"answer":0,"explanation":"同じ価値を別々の角度から測ったものなので、結果として（事後的に）必ず一致する。"},{"id":"econ-2-03","type":"choice","prompt":"支出面から見たGDPの構成要素に含まれないものは？","options":["中間投入額","消費","投資","政府支出"],"answer":0,"explanation":"支出面のGDPは、消費＋投資＋政府支出＋純輸出。中間投入は最終生産物の価格に含まれているので、別に数えない。"},{"id":"econ-2-04","type":"tf","prompt":"持ち家に住む人の帰属家賃は、実際には家賃を払っていないのでGDPに含まれない。","answer":false,"explanation":"帰属計算により、自分に家賃を払っているとみなして家計最終消費支出としてGDPに含める。"},{"id":"econ-2-05","type":"choice","prompt":"帰属計算の代表例の組み合わせは？","options":["持ち家の帰属家賃と農家の自家消費","株式の値上がり益と土地の売買","中古品の売買と相続","宝くじの当選金と贈与"],"answer":0,"explanation":"市場で売れば収入になるものを自分で使っているケースを、取引があったとみなしてGDPに含める。株や土地の値上がり益、中古品の売買は新たな付加価値ではないので含まない。"},{"id":"econ-2-06","type":"tf","prompt":"分配面から見たGDPは「所得面から見たGDP」とも呼ばれる。","answer":true,"explanation":"分配されたものは各経済主体にとっての所得なので、所得面から見たGDPともいう。同様に支出面は需要面とも呼ぶ。"},{"id":"econ-2-07","type":"choice","prompt":"支出面から見たGDPで、純輸出を表すものは？","options":["輸出 − 輸入","輸入 − 輸出","輸出 ＋ 輸入","輸出 × 為替レート"],"answer":0,"explanation":"国内で生産されたものへの海外からの需要が輸出。輸入は海外で生産されたものへの支出なので差し引く。"}]},{"id":"econ-3","title":"物価と経済成長率","summary":"名目と実質の違い、GDPデフレータと成長率の計算をマスターしよう。","cards":[{"title":"名目と実質","body":"物価の変動を含んだ額面上の値が「名目」、物価変動の影響を取り除いた値が「実質」。生産量が同じでも物価が2倍になれば名目GDPは2倍になるが、実質は変わらない。","formula":null},{"title":"物価指数","body":"物価がどれだけ上がった・下がったかを表す指標。消費者が買うモノ・サービスが対象の「消費者物価指数」（経済の体温計）、企業間で取引されるモノが対象の「企業物価指数」などがある。","formula":null},{"title":"GDPデフレータ","body":"名目GDPから物価の影響を取り除くための物価指数。100より大きければ基準時より物価が上昇、小さければ下落している。","formula":"実質GDP ＝ 名目GDP ÷ GDPデフレータ × 100"},{"title":"経済成長率","body":"前期のGDPに対して今期のGDPがどれだけ変化したか。名目GDPで計算すれば名目成長率、実質GDPで計算すれば実質成長率。","formula":"成長率（％）＝（今期GDP − 前期GDP）÷ 前期GDP × 100"},{"title":"実質成長率","body":"物価変動の影響を取り除いた成長率。名目で10％成長しても、そのうち8％が物価上昇なら実質は2％にすぎない。","formula":"実質成長率 ≒ 名目成長率 − GDPデフレータ変化率"}],"questions":[{"id":"econ-3-01","type":"choice","prompt":"名目GDPが550兆円、GDPデフレータが110のとき、実質GDPは？","options":["500兆円","605兆円","440兆円","550兆円"],"answer":0,"explanation":"実質GDP＝名目GDP÷GDPデフレータ×100＝550÷110×100＝500兆円。"},{"id":"econ-3-02","type":"choice","prompt":"名目成長率が6％、GDPデフレータの変化率が4％のとき、実質成長率はおよそ？","options":["2％","10％","4％","−2％"],"answer":0,"explanation":"実質成長率≒名目成長率−GDPデフレータ変化率＝6−4＝2％。"},{"id":"econ-3-03","type":"tf","prompt":"名目GDPが一定のとき、GDPデフレータが上昇すると実質GDPは減少する。","answer":true,"explanation":"実質GDP＝名目GDP÷デフレータ×100なので、分母（デフレータ）が大きくなるほど実質GDPは小さくなる。"},{"id":"econ-3-04","type":"choice","prompt":"「経済の体温計」とも呼ばれ、消費者が購入するモノ・サービスの価格を対象とする指数は？","options":["消費者物価指数","企業物価指数","GDPデフレータ","日経平均株価"],"answer":0,"explanation":"消費者物価指数は国民の生活水準が直接反映されるため、経済政策のかじ取りで重視される。"},{"id":"econ-3-05","type":"tf","prompt":"GDPデフレータが100を下回っているとき、基準時点より物価が上昇していることを示す。","answer":false,"explanation":"100未満は基準時より物価が下落していることを示す。100超なら上昇。"},{"id":"econ-3-06","type":"choice","prompt":"前期のGDPが400兆円、今期のGDPが412兆円のとき、経済成長率は？","options":["3％","12％","0.3％","4％"],"answer":0,"explanation":"（412−400）÷400×100＝3％。変化した量を前期の値で割る。"},{"id":"econ-3-07","type":"tf","prompt":"物価の変動を含んだ、額面上（見かけ）の値のことを「実質値」という。","answer":false,"explanation":"額面上の値は「名目値」。物価変動の影響を取り除いたものが「実質値」。"}]},{"id":"econ-4","title":"インフレ・デフレと利子率","summary":"物価の変化で「得する人・損する人」と、名目・実質の利子率を理解しよう。","cards":[{"title":"インフレーション","body":"物価が継続的に上昇する状態。需要が供給を上回る、エネルギー費などの生産コストが上がる、市場に出回る貨幣量が増える、といった原因で起こる。","formula":null},{"title":"インフレと貨幣価値","body":"インフレ時は同じお金で買える量が減る＝貨幣価値が下がる。借金の実質的な重さも軽くなるので、お金を貸した債権者が損をし、借りた債務者が得をする（債権者から債務者への所得再配分）。","formula":null},{"title":"デフレーション","body":"物価が継続的に下落する状態。供給が需要を上回り、モノが余っているときに進みやすい。貨幣価値が上がるので、債務者から債権者へ所得が再配分される。","formula":null},{"title":"名目利子率と実質利子率","body":"額面上の金利が名目利子率。そこから予想される物価上昇率を差し引いた実質的な金利が実質利子率。金利5％でも物価が4％上がれば、実質的な得は1％だけ。","formula":"実質利子率 ＝ 名目利子率 − 物価上昇率（フィッシャー方程式）"}],"questions":[{"id":"econ-4-01","type":"tf","prompt":"インフレは、債権者から債務者への実質的な所得移転をもたらす。","answer":true,"explanation":"インフレで貨幣価値が下がると、将来返してもらうお金の価値も下がる。債権者は損をし、返済負担が軽くなる債務者は得をする。"},{"id":"econ-4-02","type":"choice","prompt":"デフレのときに起きることとして正しいものは？","options":["貨幣価値が上昇し、債務者から債権者へ所得が再配分される","貨幣価値が下落し、債権者から債務者へ所得が再配分される","貨幣価値が上昇し、債権者から債務者へ所得が再配分される","貨幣価値は変わらず、所得の再配分も起きない"],"answer":0,"explanation":"デフレはインフレの逆。貨幣価値が上がるので、お金を貸している債権者が有利、借りている債務者が不利になる。"},{"id":"econ-4-03","type":"choice","prompt":"名目利子率が3％、物価上昇率が5％のとき、実質利子率は？","options":["−2％","2％","8％","15％"],"answer":0,"explanation":"フィッシャー方程式より、実質利子率＝3−5＝−2％。預けたお金の実質的な価値は目減りしている。"},{"id":"econ-4-04","type":"tf","prompt":"名目利子率が一定で、将来の物価上昇が見込まれるとき、実質利子率は上昇する。","answer":false,"explanation":"実質利子率＝名目利子率−物価上昇率。物価上昇率がプラスになれば、実質利子率は低下する。"},{"id":"econ-4-05","type":"choice","prompt":"インフレの発生要因として適切でないものは？","options":["供給が需要を大きく上回ること","市場に出回る貨幣量の増加","エネルギー価格の高騰","需要が供給を上回ること"],"answer":0,"explanation":"供給過剰はモノが余っている状態で、価格が下がるデフレの要因になる。"},{"id":"econ-4-06","type":"choice","prompt":"1個100円のパンが、物価上昇で1個200円になった。1,000円で買えるパンの数と、1,000円の価値はどう変わる？","options":["10個から5個に減り、貨幣価値は下落した","10個から20個に増え、貨幣価値は上昇した","10個のままで、貨幣価値は変わらない","10個から5個に減り、貨幣価値は上昇した"],"answer":0,"explanation":"同じ1,000円で買える量が半分になった＝お金の価値が下がった。これがインフレ時の貨幣価値の下落。"},{"id":"econ-4-07","type":"tf","prompt":"デフレとは、物価が一時的に下落することをいう。","answer":false,"explanation":"デフレは「継続的な」物価の下落。インフレも同様に「継続的な」物価の上昇を指す。"}]},{"id":"econ-5","title":"生産物市場と乗数効果","summary":"均衡国民所得の求め方と、投資や政府支出が何倍にもふくらむ乗数効果を学ぼう。","cards":[{"title":"マクロ経済の3つの市場","body":"生産物市場（モノ・サービス）、貨幣市場（お金）、労働市場（労働力）。診断士試験では特に生産物市場と貨幣市場が重要。マクロ経済学では国民所得とGDPを同じものとして扱う。","formula":null},{"title":"ケインズ派の2つの政策","body":"財政政策：政府が公共事業や減税・増税で需要を調整する（不況期に支出拡大・減税するのが拡張的財政政策）。金融政策：中央銀行（日本銀行）が貨幣供給量や利子率を調整する。","formula":null},{"title":"総需要と消費関数","body":"海外を考えない場合、総需要は消費・投資・政府支出の合計。消費は「所得から税を引いた可処分所得のうち一定割合」＋「所得ゼロでも必要な独立消費（基礎消費）」で表す。","formula":"総需要 Y ＝ C ＋ I ＋ G\n消費 C ＝ c（Y − T）＋ C₀"},{"title":"限界消費性向 c","body":"所得が増えたとき、そのうち消費に回す割合。0と1の間の値をとる。c＝0.8なら、所得が100万円増えると80万円を消費し、20万円を貯蓄する。","formula":null},{"title":"均衡国民所得と乗数","body":"総供給（＝国民所得）と総需要が一致するときの国民所得。投資や政府支出が増えると、その何倍も国民所得が増える（乗数効果）。増税は国民所得を減らすので租税乗数はマイナス。","formula":"Y ＝（C₀ − cT ＋ I ＋ G）÷（1 − c）\n投資乗数・政府支出乗数 ＝ 1 ÷（1 − c）\n租税乗数 ＝ −c ÷（1 − c）"}],"questions":[{"id":"econ-5-01","type":"choice","prompt":"限界消費性向が0.8のとき、投資乗数は？","options":["5","4","0.8","1.25"],"answer":0,"explanation":"投資乗数＝1÷（1−c）＝1÷0.2＝5。投資が1兆円増えると国民所得は5兆円増える。"},{"id":"econ-5-02","type":"choice","prompt":"限界消費性向が0.75の経済で、政府支出を20兆円増やした。均衡国民所得はいくら増える？","options":["80兆円","60兆円","15兆円","26.7兆円"],"answer":0,"explanation":"政府支出乗数＝1÷（1−0.75）＝4。20兆円×4＝80兆円増える。"},{"id":"econ-5-03","type":"choice","prompt":"限界消費性向が0.8のとき、租税乗数は？","options":["−4","−5","4","−0.8"],"answer":0,"explanation":"租税乗数＝−c÷（1−c）＝−0.8÷0.2＝−4。マイナスは「増税すると国民所得が減る」ことを表す。"},{"id":"econ-5-04","type":"tf","prompt":"限界消費性向は、0から1の間の値をとる。","answer":true,"explanation":"増えた所得のうち消費に回す割合なので、0から1の間。だから1÷（1−c）は1より大きくなり、乗数効果が生まれる。"},{"id":"econ-5-05","type":"choice","prompt":"所得がゼロでも、生きていくために最低限必要な消費を何という？","options":["独立消費（基礎消費）","限界消費","可処分所得","貯蓄"],"answer":0,"explanation":"消費関数 C＝c（Y−T）＋C₀ の C₀ が独立消費（基礎消費）。"},{"id":"econ-5-06","type":"choice","prompt":"国民所得Yから租税Tを差し引いたもの（Y−T）を何という？","options":["可処分所得","均衡国民所得","独立消費","純所得受取"],"answer":0,"explanation":"実際に使えるお金である可処分所得に、限界消費性向をかけた分が消費に回る。"},{"id":"econ-5-07","type":"tf","prompt":"不況期に政府支出を増やしたり減税したりする政策を、拡張的金融政策という。","answer":false,"explanation":"政府が支出や税で需要を調整するのは財政政策（拡張的財政政策）。中央銀行が貨幣供給量を増やすのが拡張的金融政策。"},{"id":"econ-5-08","type":"choice","prompt":"貨幣市場で、世の中に出回るお金の量（貨幣供給量）を調節する主体は？","options":["中央銀行（日本では日本銀行）","政府（財務省）","市中の銀行","家計"],"answer":0,"explanation":"貨幣を供給するのは中央銀行。貨幣を需要するのは家計・企業・政府。"}]},{"id":"econ-6","title":"IS曲線","summary":"利子率と国民所得の関係を表すIS曲線が、なぜ右下がりになるのかを理解しよう。","cards":[{"title":"利子率と投資","body":"企業は銀行から借りたお金で設備投資をする。利子率が高いと借入コストが高いので投資を控え、利子率が低いと投資が増える。","formula":"利子率↑ → 投資↓　／　利子率↓ → 投資↑"},{"title":"IS曲線とは","body":"生産物市場を均衡させる国民所得と利子率の組み合わせを描いた曲線。縦軸に利子率、横軸に国民所得をとると右下がりになる。","formula":null},{"title":"右下がりになる理由","body":"利子率が下がる → 投資が増える → 総需要が増える → 需要に合わせて生産（＝国民所得）が増える。つまり、低い利子率には大きな国民所得が対応する。","formula":null},{"title":"IS曲線の上側と下側","body":"上側は利子率が高く投資が少ないので、需要が供給を下回る「超過供給」。下側は投資が多すぎて「超過需要」。","formula":"上側＝超過供給　／　下側＝超過需要"}],"questions":[{"id":"econ-6-01","type":"choice","prompt":"IS曲線が表しているものは？","options":["生産物市場を均衡させる国民所得と利子率の組み合わせ","貨幣市場を均衡させる国民所得と利子率の組み合わせ","労働市場を均衡させる賃金と雇用量の組み合わせ","物価と総供給の組み合わせ"],"answer":0,"explanation":"IS曲線は生産物市場の均衡を表す。貨幣市場の均衡を表すのはLM曲線。"},{"id":"econ-6-02","type":"choice","prompt":"縦軸に利子率、横軸に国民所得をとったとき、IS曲線の形は？","options":["右下がり","右上がり","水平","垂直"],"answer":0,"explanation":"利子率が低いほど投資が増えて国民所得も大きくなるので、右下がりになる。"},{"id":"econ-6-03","type":"tf","prompt":"利子率が高い水準にあると投資水準も高くなるので、IS曲線は右下がりに描かれる。","answer":false,"explanation":"利子率が高いと借入コストが上がるため、投資は抑えられる。右下がりという結論は正しいが、理由が誤り。"},{"id":"econ-6-04","type":"choice","prompt":"IS曲線より上側の領域では、生産物市場はどんな状態？","options":["超過供給","超過需要","均衡している","判断できない"],"answer":0,"explanation":"上側は同じ国民所得に対して利子率が高すぎ、投資（需要）が足りない状態。需要＜供給なので超過供給。"},{"id":"econ-6-05","type":"order","prompt":"IS曲線が右下がりになる理由を、因果の順に並べよ。","items":["利子率が下がる","企業の投資が増える","総需要が増える","均衡国民所得が増える"],"explanation":"利子率の低下 → 投資の増加 → 総需要の増加 → 生産（国民所得）の増加。だから低い利子率と大きい国民所得が組み合わさる。"},{"id":"econ-6-06","type":"tf","prompt":"ケインズの投資理論によれば、利子率の低下は投資を増加させる。","answer":true,"explanation":"利子率は資金調達のコスト。下がれば企業はお金を借りやすくなり、設備投資が増える。"}]},{"id":"econ-7","title":"貨幣市場とLM曲線","summary":"お金を持ちたい理由（貨幣需要）と、LM曲線が右上がりになる仕組みを学ぼう。","cards":[{"title":"貨幣と債券","body":"資産は貨幣か債券で持つ（ウラオモテの関係）。貨幣は利子がつかないがすぐ使える（流動性が高い）。債券は国債・社債のように利子がつくが、そのままでは買い物に使えない（流動性が低い）。","formula":null},{"title":"貨幣の取引需要","body":"モノやサービスを買うために貨幣を持とうとする需要。景気が良く所得が増えれば、買い物のためにお金が欲しくなる。","formula":"取引需要は国民所得の増加関数"},{"title":"貨幣の投機的需要","body":"利子率が高いと債券を持つメリットが大きく、貨幣の需要は減る。利子率が低いと債券の魅力が薄れ、貨幣で持つほうが好まれる。","formula":"投機的需要は利子率の減少関数"},{"title":"実質貨幣供給量","body":"中央銀行が決める名目の貨幣供給量を、物価水準で割ったもの。貨幣市場の分析では、特にことわりがなければ一定とみなす。","formula":"実質貨幣供給量 ＝ 名目貨幣供給量 ÷ 物価水準"},{"title":"LM曲線","body":"貨幣市場を均衡させる国民所得と利子率の組み合わせ。利子率が上がって投機的需要が減った分を、国民所得の増加（取引需要の増加）で埋めるので右上がりになる。","formula":"上側＝超過供給　／　下側＝超過需要"}],"questions":[{"id":"econ-7-01","type":"choice","prompt":"貨幣の取引需要は、何の増加関数か？","options":["国民所得","利子率","債券価格","失業率"],"answer":0,"explanation":"国民所得が増えると買い物のための貨幣需要が増え、減ると減る。"},{"id":"econ-7-02","type":"tf","prompt":"利子率が上昇すると、貨幣の投機的需要は減少する。","answer":true,"explanation":"利子率が上がると債券の収益が高まり、債券で持つほうが有利になる。その分、貨幣で持とうとする需要は減る。"},{"id":"econ-7-03","type":"choice","prompt":"縦軸に利子率、横軸に国民所得をとったとき、LM曲線の形は？","options":["右上がり","右下がり","水平","垂直"],"answer":0,"explanation":"利子率が上がって減った貨幣需要を、国民所得の増加（取引需要の増加）で補うことで均衡するため、右上がりになる。"},{"id":"econ-7-04","type":"choice","prompt":"LM曲線より上側の領域では、貨幣市場はどんな状態？","options":["超過供給","超過需要","均衡している","判断できない"],"answer":0,"explanation":"上側は利子率が高く、貨幣需要が少ない状態。貨幣供給が需要を上回るので超過供給。"},{"id":"econ-7-05","type":"choice","prompt":"IS曲線より下側で、かつLM曲線より上側にある点の状態は？","options":["生産物市場は超過需要、貨幣市場は超過供給","生産物市場は超過供給、貨幣市場は超過需要","両方の市場とも超過需要","両方の市場とも超過供給"],"answer":0,"explanation":"IS曲線の下側は生産物市場の超過需要、LM曲線の上側は貨幣市場の超過供給。それぞれの曲線について上か下かで判断する。"},{"id":"econ-7-06","type":"tf","prompt":"貨幣は利子がつかない代わりに、流動性が高い資産である。","answer":true,"explanation":"現金や預金は利子がつかない（またはわずか）が、使いたいときにすぐ使える。これを流動性が高いという。"},{"id":"econ-7-07","type":"choice","prompt":"実質貨幣供給量の求め方は？","options":["名目貨幣供給量 ÷ 物価水準","名目貨幣供給量 × 物価水準","名目貨幣供給量 − 物価上昇率","国民所得 ÷ 利子率"],"answer":0,"explanation":"物価の影響を取り除くため、名目の貨幣供給量を物価水準で割る。"}]}]},{"id":"acct","order":2,"title":"財務・会計","shortTitle":"財務・会計","worldName":"決算の城","symbol":"yensign.circle.fill","theme":"green","boss":{"name":"粉飾ドラゴン","emoji":"🐉","taunt":"数字をごまかすのは得意でな…見抜けるかな？"},"stages":[{"id":"acct-1","title":"財務諸表のきほん","summary":"会計の目的と、押さえるべき3つの財務諸表を知ろう。","cards":[{"title":"簿記と財務諸表","body":"日々の取引を帳簿に記録し（簿記）、一定期間ごとに報告書＝財務諸表にまとめる。これで企業の経営成績（もうけ）と財政状態（財産の状態）が明らかになる。","formula":null},{"title":"管理会計と財務会計","body":"管理会計は、経営者など企業内部の管理者に向けて、経営の維持・成長に役立つ情報を提供する。財務会計は、株主・投資家・債権者など外部の利害関係者に向けて、投資などの判断材料を提供する。","formula":null},{"title":"3つの重要な財務諸表","body":"貸借対照表（B/S）、損益計算書（P/L）、キャッシュフロー計算書（C/F）。C/Fは現金預金の増減とその要因を示し、損益計算書だけではわからない資金の状況がわかる。","formula":null}],"questions":[{"id":"acct-1-01","type":"choice","prompt":"株主や債権者など、企業外部の利害関係者への情報提供を目的とする会計は？","options":["財務会計","管理会計","原価計算","意思決定会計"],"answer":0,"explanation":"外部向けが財務会計、内部の経営管理者向けが管理会計。財務諸表は両方に数値面の情報を提供する。"},{"id":"acct-1-02","type":"choice","prompt":"現金預金の増減と、その要因を表す財務諸表は？","options":["キャッシュフロー計算書","貸借対照表","損益計算書","株主資本等変動計算書"],"answer":0,"explanation":"キャッシュフロー計算書は、利益が出ていても資金が足りない、といった損益計算書では見えない状況を把握するのに役立つ。"},{"id":"acct-1-03","type":"tf","prompt":"管理会計は、経営者など企業内部の経営管理者向けの会計である。","answer":true,"explanation":"そのとおり。企業の維持・成長に役立つ情報を内部に提供するのが管理会計。"},{"id":"acct-1-04","type":"choice","prompt":"「ある時点の財政状態」を表す財務諸表は？","options":["貸借対照表","損益計算書","キャッシュフロー計算書","製造原価報告書"],"answer":0,"explanation":"貸借対照表は通常、事業年度末という「時点」の財産の状態を表す。"},{"id":"acct-1-05","type":"choice","prompt":"「一定期間の経営成績」を表す財務諸表は？","options":["損益計算書","貸借対照表","定款","株主名簿"],"answer":0,"explanation":"損益計算書は、通常1事業年度という「期間」の収益・費用・利益を表す。"},{"id":"acct-1-06","type":"tf","prompt":"簿記とは、日々の企業活動を帳簿に記録し、その結果を財務諸表にまとめる一連の処理のことである。","answer":true,"explanation":"記録（帳簿への記入）から報告（財務諸表の作成）までの一連の処理を簿記という。"}]},{"id":"acct-2","title":"貸借対照表のしくみ","summary":"左右に分かれた貸借対照表の構造と、グループ分けのルールをつかもう。","cards":[{"title":"貸借対照表（B/S）","body":"ある時点（通常は期末）の財政状態を表す。バランスシートともいう。左右に分かれ、左右の合計は必ず一致する。","formula":"資産 ＝ 負債 ＋ 純資産"},{"title":"左は運用、右は調達","body":"右側は、お金をどこから集めたか（負債＝他人から、純資産＝主に株主から）。左側は、そのお金を何に使っているか（資産）を表す。","formula":null},{"title":"流動と固定","body":"資産・負債とも「流動」と「固定」に分ける。目安は、1年以内に現金化・支払いをするかどうか（決算日の翌日から1年）。","formula":null},{"title":"資産のグループ","body":"資産は流動資産と固定資産に分かれ、固定資産はさらに有形固定資産・無形固定資産・投資その他の資産の3つに分かれる。細かい科目がどのグループに属するかを覚えるのがコツ。","formula":null}],"questions":[{"id":"acct-2-01","type":"choice","prompt":"貸借対照表の右側に表示されるものは？","options":["負債と純資産","資産と負債","資産だけ","収益と費用"],"answer":0,"explanation":"右側は資金の調達源である負債と純資産、左側はその運用である資産。収益と費用は損益計算書の項目。"},{"id":"acct-2-02","type":"tf","prompt":"貸借対照表の資産合計と、負債・純資産合計は必ず一致する。","answer":true,"explanation":"集めたお金（右）と、その使いみち（左）は同じ額なので必ず一致する。"},{"id":"acct-2-03","type":"choice","prompt":"資産合計が5,000万円、負債合計が3,200万円のとき、純資産は？","options":["1,800万円","8,200万円","3,200万円","5,000万円"],"answer":0,"explanation":"純資産＝資産−負債＝5,000−3,200＝1,800万円。"},{"id":"acct-2-04","type":"order","prompt":"貸借対照表の資産の部を、表示される順に並べよ。","items":["流動資産","有形固定資産","無形固定資産","投資その他の資産"],"explanation":"まず流動資産、次に固定資産。固定資産は有形固定資産 → 無形固定資産 → 投資その他の資産の順に並ぶ。"},{"id":"acct-2-05","type":"choice","prompt":"貸借対照表の別名は？","options":["バランスシート","プロフィット・アンド・ロス","キャッシュフロー・ステートメント","トライアル・バランス"],"answer":0,"explanation":"Balance Sheet の略で B/S と呼ぶ。損益計算書は Profit and Loss で P/L。"},{"id":"acct-2-06","type":"tf","prompt":"負債は返済義務があるため「自己資本」と呼ばれる。","answer":false,"explanation":"返済義務がある負債は「他人資本」。原則返済不要の純資産が「自己資本」。"}]},{"id":"acct-3","title":"資産の部","summary":"現金から特許権まで、主な資産の科目と減価償却の考え方を学ぼう。","cards":[{"title":"流動資産の主な科目","body":"現金及び預金、売掛金（商品を売ったが代金が未収の分）、有価証券（売買目的など短期のもの）、商品（期末の売れ残り在庫）、短期貸付金（1年以内に回収予定）など。","formula":null},{"title":"貸倒引当金","body":"売掛金や貸付金のうち、取引先の倒産などで回収できなくなりそうな額を見積もったもの。資産の部にマイナスで表示し、債権の実質的な価値を示す。","formula":"実質的な売掛金 ＝ 売掛金 − 貸倒引当金"},{"title":"有形固定資産","body":"建物、車両運搬具、土地、建設仮勘定など形のある固定資産。建設仮勘定は建築中の建物への支払いで、完成したら建物などに振り替える。","formula":null},{"title":"減価償却","body":"土地以外の固定資産は、使用や時の経過で価値が減る。そこで取得価額を使用する各期間に費用（減価償却費）として配分する。土地は価値が減らないので減価償却しない。","formula":null},{"title":"無形固定資産と投資その他の資産","body":"無形固定資産は特許権など形のない権利。投資その他の資産は投資有価証券や長期貸付金などの投資資産。","formula":null}],"questions":[{"id":"acct-3-01","type":"choice","prompt":"減価償却を行わない有形固定資産は？","options":["土地","建物","車両運搬具","機械装置"],"answer":0,"explanation":"土地は時間がたっても価値が下がるものではないため、減価償却しない。"},{"id":"acct-3-02","type":"choice","prompt":"商品を販売したが、代金をまだ受け取っていない場合の権利を表す科目は？","options":["売掛金","買掛金","短期借入金","前払金"],"answer":0,"explanation":"売掛金は後でお金をもらえる権利（債権）で、流動資産。仕入代金が未払いなら買掛金（負債）。"},{"id":"acct-3-03","type":"tf","prompt":"貸倒引当金は、負債の部にプラスの金額で表示される。","answer":false,"explanation":"貸倒引当金は資産の部で、売掛金などから差し引く形（マイナス）で表示する。"},{"id":"acct-3-04","type":"choice","prompt":"特許権はどこに分類される？","options":["無形固定資産","有形固定資産","流動資産","投資その他の資産"],"answer":0,"explanation":"特許権や実用新案権などの法律上の権利は、形のない無形固定資産。"},{"id":"acct-3-05","type":"choice","prompt":"建築中の建物について、完成前に支払った金額を処理する科目は？","options":["建設仮勘定","建物","前払費用","長期貸付金"],"answer":0,"explanation":"未完成の建物への手付金などは建設仮勘定。完成と同時に建物などの科目に振り替える。"},{"id":"acct-3-06","type":"tf","prompt":"決算日の翌日から1年以内に回収予定の貸付金は、短期貸付金として流動資産に表示される。","answer":true,"explanation":"1年以内に回収するものは流動資産の短期貸付金、1年を超えるものは投資その他の資産の長期貸付金。"},{"id":"acct-3-07","type":"choice","prompt":"投資有価証券が分類されるのは？","options":["投資その他の資産","流動資産","無形固定資産","純資産"],"answer":0,"explanation":"短期の売買目的の有価証券は流動資産、長期保有の投資有価証券は固定資産の「投資その他の資産」。"}]},{"id":"acct-4","title":"負債・純資産の部","summary":"他人資本と自己資本の違い、純資産の中身を整理しよう。","cards":[{"title":"流動負債","body":"比較的短期間（1年以内）に支払う負債。買掛金（仕入代金の未払い分）、短期借入金（1年以内に返済）など。","formula":null},{"title":"固定負債","body":"返済期限が1年を超える負債。社債（不特定多数に発行して長期資金を集める）、長期借入金など。","formula":null},{"title":"他人資本と自己資本","body":"負債は銀行や取引先などの債権者から集めたお金で、返す必要がある「他人資本」。純資産は主に株主から集めたお金で、返す必要がない「自己資本」。","formula":"純資産 ＝ 資産 − 負債"},{"title":"株主資本の中身","body":"資本金（事業の元手）、資本剰余金（資本金以外の出資）、利益剰余金（事業のもうけの蓄積）、自己株式（自社株を買い戻したもの。マイナス表示）。","formula":null}],"questions":[{"id":"acct-4-01","type":"choice","prompt":"商品を仕入れたが、代金がまだ未払いのときの科目は？","options":["買掛金","売掛金","未収金","前受金"],"answer":0,"explanation":"買掛金は仕入先に対する支払義務（債務）で、流動負債に分類される。"},{"id":"acct-4-02","type":"choice","prompt":"長期資金を調達するために発行した社債は、どこに分類される？","options":["固定負債","流動負債","純資産","流動資産"],"answer":0,"explanation":"社債は返済までの期間が長いので固定負債。長期借入金も同じく固定負債。"},{"id":"acct-4-03","type":"tf","prompt":"純資産は返済の必要がないため「自己資本」とも呼ばれる。","answer":true,"explanation":"主に株主から集めたお金で、原則として返済不要。だから自己資本と呼ばれる。"},{"id":"acct-4-04","type":"choice","prompt":"事業活動で生み出したもうけの蓄積を表す項目は？","options":["利益剰余金","資本金","資本剰余金","自己株式"],"answer":0,"explanation":"利益剰余金は企業活動によって生じた純資産。利益準備金や繰越利益剰余金などから成る。"},{"id":"acct-4-05","type":"choice","prompt":"自社が発行した株式を、市場などから買い戻したものは？","options":["自己株式","投資有価証券","資本準備金","有価証券"],"answer":0,"explanation":"自己株式は純資産の部にマイナスで表示される。"},{"id":"acct-4-06","type":"tf","prompt":"決算日の翌日から1年を超えて返済する借入金は、短期借入金として表示する。","answer":false,"explanation":"1年を超えるものは長期借入金（固定負債）。1年以内に返済するものが短期借入金（流動負債）。"}]},{"id":"acct-5","title":"損益計算書と5つの利益","summary":"売上から当期純利益まで、段階ごとの利益の意味を理解しよう。","cards":[{"title":"損益計算書（P/L）","body":"一定期間の経営成績（収益・費用・利益）を表す。収益と費用を段階的に差し引くことで、性質の異なる5つの利益を示す。","formula":null},{"title":"売上総利益（粗利）","body":"売上高から、その売上のために仕入れた商品などの原価（売上原価）を引いた利益。","formula":"売上総利益 ＝ 売上高 − 売上原価\n売上原価 ＝ 期首商品棚卸高 ＋ 当期仕入高 − 期末商品棚卸高"},{"title":"営業利益","body":"本業から得られる利益。販売費及び一般管理費（給料、広告宣伝費、支払家賃、減価償却費など）を差し引く。","formula":"営業利益 ＝ 売上総利益 − 販売費及び一般管理費"},{"title":"経常利益","body":"財務活動も含めた、通常の経営活動による利益。営業外収益（受取利息・配当金）と営業外費用（支払利息）を加減する。","formula":"経常利益 ＝ 営業利益 ＋ 営業外収益 − 営業外費用"},{"title":"税引前当期純利益と当期純利益","body":"臨時・例外的な特別利益（固定資産売却益など）と特別損失（災害損失など）を加減して税引前当期純利益。そこから法人税等を引いたのが最終的なもうけ＝当期純利益。","formula":"当期純利益 ＝ 税引前当期純利益 − 法人税、住民税及び事業税"}],"questions":[{"id":"acct-5-01","type":"order","prompt":"損益計算書に登場する5つの利益を、上から順に並べよ。","items":["売上総利益","営業利益","経常利益","税引前当期純利益","当期純利益"],"explanation":"売上原価 → 販管費 → 営業外損益 → 特別損益 → 法人税等 の順に加減していく。"},{"id":"acct-5-02","type":"choice","prompt":"期首商品棚卸高50、当期商品仕入高300、期末商品棚卸高70のとき、売上原価は？","options":["280","420","320","230"],"answer":0,"explanation":"売上原価＝期首50＋仕入300−期末70＝280。売れ残った期末在庫は原価に含めない。"},{"id":"acct-5-03","type":"choice","prompt":"借入金の支払利息が計上される区分は？","options":["営業外費用","販売費及び一般管理費","特別損失","売上原価"],"answer":0,"explanation":"支払利息は本業以外（主に財務活動）の費用なので営業外費用。経常利益の計算で差し引かれる。"},{"id":"acct-5-04","type":"choice","prompt":"火災による損失や固定資産売却益が計上される区分は？","options":["特別損益","営業外損益","販売費及び一般管理費","売上原価"],"answer":0,"explanation":"毎期発生するものではない臨時・例外的な損益は、特別利益・特別損失に計上する。"},{"id":"acct-5-05","type":"choice","prompt":"営業利益300、営業外収益120、営業外費用160のとき、経常利益は？","options":["260","580","340","140"],"answer":0,"explanation":"経常利益＝300＋120−160＝260。"},{"id":"acct-5-06","type":"tf","prompt":"営業利益は、企業の本業から得られる利益を表す。","answer":true,"explanation":"売上総利益から販売費及び一般管理費を引いた営業利益は、本業のもうけを示す。"},{"id":"acct-5-07","type":"tf","prompt":"売上総利益は「粗利益（粗利）」とも呼ばれる。","answer":true,"explanation":"売上高から売上原価を引いただけの、いちばん大まかな利益なので粗利と呼ばれる。"},{"id":"acct-5-08","type":"choice","prompt":"従業員の給料や広告宣伝費が含まれる区分は？","options":["販売費及び一般管理費","営業外費用","特別損失","法人税等"],"answer":0,"explanation":"本来の営業活動の販売業務や管理業務で発生する費用は、販売費及び一般管理費（販管費）。"}]},{"id":"acct-6","title":"収益性分析","summary":"「もうける力」を測る資本利益率と売上高利益率を計算しよう。","cards":[{"title":"経営分析のきほん","body":"財務諸表の数値から比率を計算し、他社や過去と比べて企業の状態を理解する。覚えるのは①計算式と②高いほうが良いか低いほうが良いかの2点。","formula":null},{"title":"資本利益率（ROI）","body":"投下した資本からどれだけ利益を上げたかを示す、総合的な収益性の指標。高いほど良い。売上高利益率と資本回転率に分解できる。","formula":"資本利益率 ＝ 売上高利益率 × 資本回転率\n（利益/資本 ＝ 利益/売上高 × 売上高/資本）"},{"title":"総資本経常利益率とROE","body":"総資本経常利益率は、総資本を使ってどれだけ経常利益を上げたか。ROE（自己資本利益率）は、株主が出したお金でどれだけ当期純利益を上げたか。どちらも高いほど良い。","formula":"総資本経常利益率 ＝ 経常利益 ÷ 総資本 × 100\nROE ＝ 当期純利益 ÷ 自己資本 × 100"},{"title":"売上高利益率","body":"売上からどれだけ利益を残せるか。総利益率は商品そのもの、営業利益率は本業、経常利益率は支払利息なども含めた収益性を表す。","formula":"売上高総利益率 ＝ 売上総利益 ÷ 売上高 × 100\n売上高営業利益率 ＝ 営業利益 ÷ 売上高 × 100\n売上高経常利益率 ＝ 経常利益 ÷ 売上高 × 100"},{"title":"分析で使う損益項目","body":"事業利益は、本業の成果に財務活動の成果を加えた利益。金融費用は、他人資本（借入金・社債）で資金を集めたことに伴うコスト。","formula":"事業利益 ＝ 営業利益 ＋ 受取利息・配当金\n金融費用 ＝ 支払利息 ＋ 社債利息"}],"questions":[{"id":"acct-6-01","type":"choice","prompt":"売上高1,000万円、営業利益80万円のとき、売上高営業利益率は？","options":["8％","80％","12.5％","0.8％"],"answer":0,"explanation":"80÷1,000×100＝8％。本業の収益性を表し、高いほど良い。"},{"id":"acct-6-02","type":"choice","prompt":"当期純利益40万円、自己資本320万円のとき、ROE（自己資本利益率）は？","options":["12.5％","8％","5％","40％"],"answer":0,"explanation":"ROE＝40÷320×100＝12.5％。株主が出資した資本でどれだけ利益を上げたかを示す。"},{"id":"acct-6-03","type":"choice","prompt":"経常利益60万円、総資本800万円のとき、総資本経常利益率は？","options":["7.5％","6％","13.3％","60％"],"answer":0,"explanation":"60÷800×100＝7.5％。総資本は貸借対照表の負債と純資産の合計（＝総資産）。"},{"id":"acct-6-04","type":"choice","prompt":"資本利益率を分解した式として正しいものは？","options":["売上高利益率 × 資本回転率","売上高利益率 ÷ 資本回転率","資本回転率 − 売上高利益率","自己資本比率 × 負債比率"],"answer":0,"explanation":"利益/資本＝（利益/売上高）×（売上高/資本）。どちらかを高めれば資本利益率も高まる。"},{"id":"acct-6-05","type":"tf","prompt":"売上高総利益率は、商品・サービスそのものの収益性を表し、低いほうが望ましい。","answer":false,"explanation":"前半は正しいが、売上高総利益率は高いほうが望ましい。売上原価を減らせば向上する。"},{"id":"acct-6-06","type":"choice","prompt":"売上高営業利益率と売上高経常利益率の差を生む主な要因は？","options":["支払利息などの営業外損益","売上原価","法人税等","特別損失"],"answer":0,"explanation":"経常利益は営業利益に営業外収益を足し、営業外費用（特に支払利息）を引いたもの。借入の多さが表れる。"},{"id":"acct-6-07","type":"choice","prompt":"経営分析で使う「事業利益」の計算式は？","options":["営業利益 ＋ 受取利息・配当金","経常利益 ＋ 支払利息","売上総利益 − 販管費","当期純利益 ＋ 法人税等"],"answer":0,"explanation":"事業利益は、営業活動の成果（営業利益）に財務活動の成果（受取利息・配当金）を加えたもの。"}]},{"id":"acct-7","title":"効率性分析（回転率）","summary":"資産をどれだけ効率よく売上に変えているか、回転率で測ろう。","cards":[{"title":"回転率とは","body":"資本（資産）からどれだけ売上を生み出したかを示す。少ない資本で多くの売上を上げていれば効率が良い。単位は「回」（×100はしない）。原則として高いほど良い。","formula":"回転率（回）＝ 売上高 ÷ 資本（各資産）"},{"title":"総資本回転率","body":"総資本（総資産）をどれだけ効率よく使って売上を得たか。1回なら総資本と同額の売上を上げたという意味。低いときは個別の資産の回転率を調べて原因を探る。","formula":"総資本回転率 ＝ 売上高 ÷ 総資本"},{"title":"売上債権回転率","body":"売掛金などの回収状況を表す。高いほど回収が順調で、資金繰りの良さもわかる。貸倒引当金を差し引いた後の額を使う。","formula":"売上債権回転率 ＝ 売上高 ÷ 売上債権"},{"title":"棚卸資産回転率","body":"在庫がどれだけ速く売れているか。高いほど在庫の消化が速く、在庫管理が適切といえる。","formula":"棚卸資産回転率 ＝ 売上高 ÷ 棚卸資産"},{"title":"有形固
