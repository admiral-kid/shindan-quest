// ---------------------------------------------------------------- save codes
const toB64 = (bytes) => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
async function encodeSave() {
  const json = JSON.stringify({ app: 'shindan-quest', v: 2, data: S });
  if (window.CompressionStream) {
    const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate'));
    return 'SQ2:' + toB64(new Uint8Array(await new Response(stream).arrayBuffer()));
  }
  return 'SQ1:' + toB64(new TextEncoder().encode(json));
}
async function decodeSave(text) {
  const code = String(text || '').trim();
  let parsed;
  try {
  if (code.startsWith('{')) parsed = JSON.parse(code);
  else {
    const tag = code.slice(0, 4), body = code.slice(4).replace(/\s+/g, '');
    const bytes = fromB64(body);
    if (tag === 'SQ2:') {
      if (!window.DecompressionStream) throw new Error('このブラウザは圧縮コードに対応していません');
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
      parsed = JSON.parse(await new Response(stream).text());
    } else if (tag === 'SQ1:') parsed = JSON.parse(new TextDecoder().decode(bytes));
    else throw new Error('format');
  }
  } catch (e) {
    throw new Error(e && e.message === 'このブラウザは圧縮コードに対応していません' ? e.message : 'セーブコードを読み取れませんでした。途中で切れていないか確認してください');
  }
  const data = parsed && parsed.app === 'shindan-quest' ? parsed.data : parsed;
  if (!data || typeof data !== 'object' || typeof data.xp !== 'number') throw new Error('診断士クエストのセーブデータではありません');
  return normalize(data);
}

function renderQuiz() {
  const host = $('#quiz');
  const quiz = ui.quiz;
  if (!quiz) { host.hidden = true; host.innerHTML = ''; document.body.style.overflow = ''; return; }
  host.hidden = false;
  document.body.style.overflow = 'hidden';
  if (quiz.phase === 'finished') { host.innerHTML = `<div class="frame">${resultHTML(quiz)}</div>`; animateCount(); return; }
  const q = quiz.current, fb = quiz.feedback, answering = quiz.phase === 'answering';
  const origin = QREF[q.id];
  let topMid;
  if (quiz.mode === 'time') {
    topMid = `<span class="bar" style="--c:${themeVar(quiz.theme)}"><i id="ta-bar" style="width:${(quiz.remaining / quiz.timeLimit) * 100}%;transition:none"></i></span>
      <b id="ta-sec" class="ta-sec num">${Math.ceil(quiz.remaining)}秒</b>

function animateCount() {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-count]').forEach((el) => {
    const target = Number(el.dataset.count), start = performance.now();
    if (reduce) { el.textContent = `+${fmt(target)}`; return; }
    const step = (t) => {
      const k = Math.min(1, (t - start - 300) / 800);
      el.textContent = `+${fmt(target * Math.max(0, 1 - Math.pow(1 - k, 3)))}`;
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

// confetti
function confetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  cv.hidden = false;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ['#F5B301', '#F2445B', '#22A35A', '#3478F0', '#9356E4', '#FF7A1A'];
  const pieces = Array.from({ length: 90 }, () => ({ x: Math.random(), delay: Math.random() * 0.6, speed: 0.28 + Math.random() * 0.27, drift: (Math.random() - 0.5) * 80, spin: 2 + Math.random() * 5, w: 6 + Math.random() * 4, h: 10 + Math.random() * 6, color: colors[Math.floor(Math.random() * colors.length)] }));
  const t0 = performance.now();
  const frame = (now) => {
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ctx.globalAlpha = t > 3.2 ? Math.max(0, 1 - (t - 3.2) / 0.8) : 1;
    for (const p of pieces) {
      const lt = t - p.delay;
      if (lt <= 0) continue;
      const y = -20 + lt * p.speed * innerHeight, x = p.x * innerWidth + Math.sin(lt * 2.5 + p.x * 10) * p.drift;
      ctx.save(); ctx.translate(x, y); ctx.rotate(lt * p.spin); ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (t < 4) requestAnimationFrame(frame); else cv.hidden = true;
  };
  requestAnimationFrame(frame);
}

const ORB = { N: '#4DA3FF', R: '#4DA3FF', SR: '#B070FF', SSR: '#FFC233', UR: 'rainbow' };
function startSummon(n, pay) {
  const results = summon(n, pay);
  if (!results) { toast(pay === 'gems' ? 'ジェムが足りません' : 'チケットが足りません'); return; }
  const best = results.reduce((b, r) => RANK[r.rarity] > RANK[b] ? r.rarity : b, 'N');
  // 昇格演出：最初は低いレア度の色で光り、途中で本来の色に変わる
  let from = best;
  if (best === 'UR') from = 'SSR';
  else if (best === 'SSR' && Math.random() < 0.5) from = 'R';
  else if (best === 'SR' && Math.random() < 0.3) from = 'R';
  ui.summon = { results, n, pay, best, from, phase: 'orb' };
  renderSummon();
  sfx(RANK[best] >= 3 ? 'rare' : 'up');
  clearTimeout(ui.summonTimer);
  ui.summonTimer = setTimeout(() => { if (ui.summon && ui.summon.phase === 'orb') { ui.summon.phase = 'cards'; renderSummon(); } }, from !== best ? 2100 : 1500);
  evaluateBadges();
  renderWallet();
}

function resetSheet() {
  openSheet(`
    <h2>進捗をリセットしますか？</h2>
    <p>XP・クリア状況・装備・通貨・バッジ・復習データがすべて消えます。元に戻せません。必要なら先にセーブデータを書き出してください。</p>
    <button class="btn" style="--c:var(--bad)" data-act="reset-yes">すべてリセット</button>
    <button class="linkbtn" data-act="sheet-close">キャンセル</button>`);
}
function itemSheet(id, flash = '') {
  const it = ITEM[id], own = S.items[id];
  if (!it || !own) return;
  if (own.isNew) { own.isNew = false; persist(); renderTabbar(); }
  ui.sheetItem = id;
  const cur = itemStats(it, own.lv, own.lb), mx = maxLv(id);
  const nextS = own.lv < mx ? itemStats(it, own.lv + 1, own.lb) : null;
  const cost = own.lv < mx ? enhanceCost(id) : 0;
  const slot = equippedSlot(id);
  const equipBtns = it.type === 'acc'
    ? ['acc1', 'acc2'].map((s) => S.equip[s] === id
      ? `<button class="btn small ghost" data-act="unequip" data-slot="${s}">${SLOT_NAME[s]}から外す</button>`
      : `<button class="btn small" data-act="equip" data-id="${id}" data-slot="${s}">${SLOT_NAME[s]}に装備</button>`).join('')
    : slot
      ? `<button class="btn small ghost" style="grid-column:1/-1" data-act="unequip" data-slot="${slot}">外す</button>`
      : `<button class="btn small" style="grid-column:1/-1" data-act="equip" data-id="${id}" data-slot="${it.type}">装備する</button>`;
  openSheet(`
    <div class="bar-row"><span class="eyebrow">${TYPE_NAME[it.type]}</span>${closeX}</div>
    <div class="detail-head">
      ${itemTile(id, { bare: true })}
      <div style="display:grid;gap:6px">
        <h2>${esc(it.name)}</h2>
        <div class="sub"><span class="rtag" data-r="${it.rarity}">${it.rarity}</span><span class="num">Lv ${own.lv} / ${mx}</span></div>
        <div class="sub">限界突破 <span class="lbpips">${Array.from({ length: MAX_LB }, (_, i) => `<i class="${i < own.lb ? 'on' : ''}"></i>`).join('')}</span></div>
      </div>
    </div>
    <p class="flavor">「${esc(it.flavor)}」</p>
    <div class="boxed statrows">${Object.keys(cur).map((k) => `<div><span>${STAT_LABEL[k]}</span><span>${statText(k, cur[k])}${nextS && nextS[k] !== cur[k] ? ` <span class="up">→ ${statText(k, nextS[k])}</span>` : ''}</span></div>`).join('')}</div>
    ${flash ? `<div class="boom">${flash}</div>` : ''}
    ${own.lv < mx ? `
    <div class="enh-row">
      <button class="btn small stack" style="--c:var(--flame)" data-act="enhance" data-id="${id}" data-times="1" ${S.gold >= cost ? '' : 'disabled'}>強化<small class="num">🪙 ${fmt(cost)}</small></button>
      <button class="btn small stack" style="--c:var(--flame)" data-act="enhance" data-id="${id}" data-times="10" ${S.gold >= cost ? '' : 'disabled'}>10回強化<small>ゴールドが続く限り</small></button>
    </div>
    <p class="note" style="text-align:center">所持 🪙${fmt(S.gold)}・12%で大成功（+2）、3%で超成功（+3）</p>` : `<p class="note" style="text-align:center">最大レベルです。同じ装備を召喚すると限界突破で上限が +${LB_LV} されます。</p>`}
    <div class="two">${equipBtns}</div>`);
}
function slotSheet(slot) {
  const type = slotType(slot);
  const owned = Object.keys(S.items).filter((id) => ITEM[id] && ITEM[id].type === type)
    .sort((a, b) => (RANK[ITEM[b].rarity] - RANK[ITEM[a].rarity]) || (S.items[b].lv - S.items[a].lv));
  openSheet(`
    <div class="bar-row"><h2>${SLOT_NAME[slot]}を選ぶ</h2>${closeX}</div>
    ${owned.length ? `<div class="pick-list">${owned.map((id) => {
      const st = itemStats(ITEM[id], S.items[id].lv, S.items[id].lb);
      return `<button class="pick ${S.equip[slot] === id ? 'on' : ''}" data-act="equip" data-id="${id}" data-slot="${slot}">${itemTile(id)}<span><b>${esc(ITEM[id].name)}</b><small>${Object.keys(st).map((k) => `${STAT_LABEL[k]} ${statText(k, st[k])}`).join('・')}</small></span>${S.equip[slot] === id ? icon('check') : ''}</button>`;
    }).join('')}</div>` : `<p class="note">この枠に装備できるアイテムがありません。召喚で手に入れよう。</p><button class="btn" data-act="tab" data-tab="gacha">${icon('sparkle')}召喚へ</button>`}
    ${S.equip[slot] ? `<button class="linkbtn" data-act="unequip" data-slot="${slot}">外す</button>` : ''}`);
}
function welcomeSheet(loginIdx) {
  const showWelcome = ui.welcomeNow;
  openSheet(`
    ${showWelcome ? `
    <div style="display:grid;justify-items:center;gap:8px;text-align:center">
      <div style="font-size:60px">🎁</div>
      <h2>装備召喚、解禁！</h2>
      <p>武器や防具を集めて強化し、ボスに挑もう。スタートダッシュ記念をお届けします。</p>
      <div class="loot"><span>💎 1,500</span><span>🎫 10</span><span>🪙 3,000</span></div>
    </div>` : ''}
    ${loginIdx !== null ? `
    <div style="display:grid;gap:10px">
      <h2 style="text-align:center">ログインボーナス ${((S.loginDays - 1) % 7) + 1}日目</h2>
      <div class="calendar">${LOGIN.map((l, i) => `<div class="${i < loginIdx ? 'got' : i === loginIdx ? 'today' : ''}"><span class="e">${l.tickets ? '🎫' : l.gems ? '💎' : '🪙'}</span><span>${i + 1}日目</span><span class="num">${lootLabel(l)}</span></div>`).join('')}</div>
      <p class="note" style="text-align:center">毎日開くだけでもらえます。7日目はチケット3枚！</p>
    </div>` : ''}
    <button class="btn" data-act="sheet-close">受け取る</button>`);
  ui.welcomeNow = false;
}

// ================================================================ render
const VIEW_TITLE = { gacha: '召喚', equip: '装備', review: '復習', profile: '記録', collection: '用語図鑑', save: 'セーブデータ', lesson: 'レッスン', boss: 'ボス戦' };
function walletHTML() {
  return `<div class="wallet" id="wallet"><span class="chip">🪙${fmt(S.gold)}</span><span class="chip">💎${fmt(S.gems)}</span><span class="chip">🎫${fmt(S.tickets)}</span></div>`;
}
function renderWallet() { const w = $('#wallet'); if (w) w.outerHTML = walletHTML(); }
function render() {
  const view = $('#view'), bar = $('#topbar');
  const t = top();
  let title = VIEW_TITLE[t.view] || '', html = '';
  switch (t.view) {
    case 'home': html = homeHTML(); break;
    case 'world': { const s = SUBJ[t.id]; title = s.shortTitle; html = worldHTML(s); break; }
    case 'stage': { const st = STAGE[t.id]; title = st.title; html = stageHTML(st); break; }
    case 'lesson': html = lessonHTML(STAGE[t.id]); break;
    case 'boss': html = bossHTML(SUBJ[t.id]); break;
    case 'gacha': html = gachaHTML(); break;
    case 'equip': html = equipHTML(); break;
    case 'review': html = reviewHTML(); break;
    case 'profile': html = profileHTML(); break;
    case 'collection': html = collectionHTML(); break;
    case 'save': html = saveHTML(); break;
  }
  const canBack = stack().length > 1;
  const heading = t.view === 'home' ? '<h1 class="wordmark">診断士クエスト</h1>' : `<h1>${esc(title)}</h1>`;
  bar.innerHTML = `${canBack ? `<button class="back" data-act="back" aria-label="戻る">${icon('back')}</button>` : ''}${heading}${walletHTML()}`;
  view.innerHTML = html;
  if (t.view === 'lesson') bindLesson(STAGE[t.id]);
  renderTabbar();
}
function renderTabbar() {
  const due = dueReview().length, newItems = newItemCount(), missionDot = claimable().length > 0;
  const tabs = [['home', '冒険', 'map'], ['gacha', '召喚', 'sparkle'], ['equip', '装備', 'sword'], ['review', '復習', 'refresh'], ['profile', '記録', 'trophy']];
  $('#tabbar').innerHTML = `<div class="inner">${tabs.map(([id, label, ic]) => {
    let badge = '';
    if (id === 'review' && due) badge = `<span class="count num">${due}</span>`;
    else if (id === 'equip' && newItems) badge = `<span class="count num">${newItems}</span>`;
    else if (id === 'gacha' && (S.tickets > 0 || S.gems >= COST_1)) badge = '<span class="dot"></span>';
    else if (id === 'home' && missionDot) badge = '<span class="dot"></span>';
    return `<button class="tab" data-act="tab" data-tab="${id}" ${ui.tab === id ? 'aria-current="page"' : ''}>${icon(ic)}<span>${label}</span>${badge}</button>`;
  }).join('')}</div>`;
}

function startQuiz(mode, id) {
  const quiz = makeQuiz(mode, id);
  if (!quiz) {
    openSheet(`<h2>出題できる問題がありません</h2><p>${mode === 'review' ? '間違えた問題がここに届きます。まずはステージに挑戦しよう！' : '学習データを確認してください。'}</p><button class="btn" data-act="sheet-close">とじる</button>`);
    return;
  }
  ui.quiz = quiz;
  renderQuiz();
  if (quiz.mode === 'time') startTimer(quiz);
}
function closeQuiz() {
  stopTimer();
  ui.quiz = null;
  renderQuiz();
  render();
}
function switchTab(tab) {
  if (ui.tab === tab && stack().length > 1) ui.stacks[tab] = [{ view: ROOT_VIEW[tab] }];
  ui.tab = tab;
  render();
  scrollTo(0, 0);
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast('コピーしました'); }
  catch (e) { if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); } toast('選択したのでコピーしてください'); }
}
async function exportFile() {
  const payload = JSON.stringify({ app: 'shindan-quest', v: 2, exportedAt: Date.now(), data: S });
  const name = `shindan-quest-save-${dayKey(new Date()).replace(/-/g, '')}.json`;
  if (inArtifact) {
    try {
      const dl = ui.downloads || await window.claude.use('downloads');
      if (!dl) { toast('ここではファイル保存が使えません。セーブコードを使ってください'); return; }
      await dl.save({ filename: name, data: payload });
      toast('保存しました');
    } catch (e) { if (!e || e.code !== 'declined') toast('ファイルに保存できませんでした'); }
    return;
  }
  const url = URL.createObjectURL(new Blob([payload], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('ファイルを保存しました');
}

// ================================================================ events
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, quiz = ui.quiz;
  switch (act) {
    case 'tab': closeSheet(); if (ui.quiz && ui.quiz.phase === 'finished') { ui.quiz = null; renderQuiz(); } switchTab(el.dataset.tab); break;
    case 'push':
      stack().push({ view: el.dataset.view, id: el.dataset.id });
      render(); scrollTo(0, 0); break;
    case 'back':
      if (stack().length > 1) stack().pop();
      render(); scrollTo(0, 0); break;
    case 'start': startQuiz(el.dataset.mode, el.dataset.id); break;
    case 'pg': {
      const pager = $('#pager');
      if (pager) pager.scrollBy({ left: Number(el.dataset.dir) * pager.clientWidth, behavior: 'smooth' });
      break;
    }
    case 'ans-choice': submit(quiz, { i: Number(el.dataset.i) }); renderQuiz(); break;
    case 'ans-tf': submit(quiz, { v: el.dataset.v === '1' }); renderQuiz(); break;
    case 'ord-pick': quiz.picked.push(quiz.shuffled[Number(el.dataset.i)]); renderQuiz(); break;
    case 'ord-remove': quiz.picked.splice(Number(el.dataset.slot), 1); renderQuiz(); break;
    case 'ord-reset': quiz.picked = []; renderQuiz(); break;
    case 'ord-submit': submit(quiz, { items: quiz.picked.slice() }); renderQuiz(); break;
    case 'hint': useHint(quiz); renderQuiz(); break;
    case 'next': next(quiz); renderQuiz(); break;
    case 'quiz-close':
      if (quiz && quiz.answered > 0 && quiz.phase !== 'finished') { quiz.confirmQuit = true; renderQuiz(); }
      else closeQuiz();
      break;
    case 'quit-yes': closeQuiz(); break;
    case 'quit-no': quiz.confirmQuit = false; renderQuiz(); break;
    case 'quiz-exit': closeQuiz(); break;
    case 'quiz-equip': closeQuiz(); switchTab('equip'); break;
    case 'quiz-retry': {
      const nq = makeQuiz(quiz.mode, quiz.arg);
      stopTimer();
      if (!nq) { closeQuiz(); break; }
      ui.quiz = nq; renderQuiz();
      if (nq.mode === 'time') startTimer(nq);
      break;
    }
    case 'open-chest': quiz.chestOpened = true; sfx(quiz.summary.chest.tier >= 2 ? 'rare' : 'coin'); renderQuiz(); break;
    case 'claim': {
      const r = claimMission(el.dataset.id);
      if (r) { sfx('coin'); toast(`受け取りました ${lootLabel(r)}`); render(); }
      break;
    }
    case 'summon': startSummon(Number(el.dataset.n), el.dataset.pay); break;
    case 'summon-skip': if (ui.summon) { ui.summon.phase = 'cards'; renderSummon(); } break;
    case 'summon-again': { const { n, pay } = ui.summon; startSummon(n, pay); break; }
    case 'summon-close': ui.summon = null; renderSummon(); render(); break;
    case 'filter': ui.filter = el.dataset.f; render(); break;
    case 'item': itemSheet(el.dataset.id); render(); break;
    case 'slot': slotSheet(el.dataset.slot); break;
    case 'equip': equipItem(el.dataset.slot, el.dataset.id); sfx('up'); closeSheet(); toast(`${ITEM[el.dataset.id].name} を装備しました`); render(); break;
    case 'unequip': equipItem(el.dataset.slot, null); closeSheet(); render(); break;
    case 'enhance': {
      const r = enhance(el.dataset.id, Number(el.dataset.times));
      if (!r.done) { toast('ゴールドが足りません'); break; }
      const flash = r.super ? '超成功！' : r.great ? '大成功！' : '';
      sfx(r.super || r.great ? 'rare' : 'up');
      itemSheet(el.dataset.id, `${flash} Lv ${r.before} → ${r.after}${r.done > 1 ? `（${r.done}回・🪙${fmt(r.spent)}）` : ''}`);
      evaluateBadges();
      render();
      break;
    }
    case 'card': cardSheet(el.dataset.id); break;
    case 'question': questionSheet(el.dataset.id); break;
    case 'badge': badgeSheet(el.dataset.id); break;
    case 'sheet-close': closeSheet(); render(); break;
    case 'goal': S.dailyGoal = Number(el.dataset.goal); persist(); render(); break;
    case 'sound': S.sound = !S.sound; persist(); if (S.sound) sfx('good'); render(); break;
    case 'reset': resetSheet(); break;
    case 'reset-yes': {
      const keep = { dailyGoal: S.dailyGoal, sound: S.sound, welcomeGiven: true, lastLoginDay: S.lastLoginDay, loginDays: S.loginDays };
      S = normalize(keep);
      persist();
      closeSheet(); render(); break;
    }
    case 'make-code': {
      const box = $('#save-code');
      box.value = '作成中…';
      box.value = await encodeSave();
      toast('セーブコードを作りました');
      break;
    }
    case 'copy-code': {
      const box = $('#save-code');
      if (!box.value || box.value === '作成中…') box.value = await encodeSave();
      copyText(box.value, box);
      break;
    }
    case 'export-file': exportFile(); break;
    case 'import-code': {
      const text = ($('#import-code') || {}).value;
      if (!text || !text.trim()) { toast('セーブコードを貼り付けてください'); break; }
      try { importPreview(await decodeSave(text)); } catch (err) { toast(err.message || '読み込めませんでした'); }
      break;
    }
    case 'import-yes':
      if (ui.pendingImport) {
        S = ui.pendingImport;
        ui.pendingImport = null;
        persist();
        closeSheet();
        toast('セーブデータを読み込みました');
        render();
      }
      break;
  }
});
document.addEventListener('change', async (e) => {
  if (e.target.id !== 'import-file') return;
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try { importPreview(await decodeSave(await file.text())); } catch (err) { toast(err.message || '読み込めませんでした'); }
});
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') { closeSheet(); render(); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (!$('#sheet').hidden) { closeSheet(); render(); }
    else if (ui.summon && ui.summon.phase === 'cards') { ui.summon = null; renderSummon(); render(); }
    else if (ui.quiz && ui.quiz.confirmQuit) { ui.quiz.confirmQuit = false; renderQuiz(); }
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'coll-q') { ui.query = e.target.value; const g = $('#coll-grid'); if (g) g.innerHTML = collectionGrid(); }
});
$('#quiz').addEventListener('scroll', (e) => { if (e.target.id === 'q-scroll' && ui.quiz) ui.quiz.scrollKeep = e.target.scrollTop; }, true);

// ================================================================ boot
function grantDaily() {
  let loginIdx = null;
  if (!S.welcomeGiven) { S.welcomeGiven = true; S.gems += 1500; S.tickets += 10; S.gold += 3000; ui.welcomeNow = true; }
  const today = dayKey(new Date());
  if (S.lastLoginDay !== today) {
    S.lastLoginDay = today;
    loginIdx = S.loginDays % 7;
    S.loginDays++;
    applyLoot(LOGIN[loginIdx]);
  }
  if (ui.welcomeNow || loginIdx !== null) {
    persist();
    render();
    welcomeSheet(loginIdx);
  }
}
const PLAIN_VIEWS = ['home', 'gacha', 'equip', 'review', 'profile', 'collection', 'save'];
const validView = (x) => !!x && (PLAIN_VIEWS.includes(x.view)
  || ((x.view === 'world' || x.view === 'boss') && !!SUBJ[x.id])
  || ((x.view === 'stage' || x.view === 'lesson') && !!STAGE[x.id]));
async function start(saved) {
  if (saved && typeof saved === 'object') {
    if (TABS.includes(saved.tab)) ui.tab = saved.tab;
    if (saved.stacks && typeof saved.stacks === 'object') {
      for (const t of TABS) {
        const st = saved.stacks[t];
        if (Array.isArray(st) && st.length && st.every(validView)) ui.stacks[t] = st;
      }
    }
  }
  render();
  if (!inArtifact && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (inArtifact) {
    window.claude.use('downloads').then((dl) => { ui.downloads = dl; ui.canDownload = !!dl; if (top().view === 'save') render(); }).catch(() => {});
  }
  // claude.ai 上では、保存済みデータを読み込んでから日替わり報酬を配る
  await connectCloud();
  grantDaily();
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ tab: ui.tab, stacks: ui.stacks }));
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
